{{- /* Sculptural security illustrations in the site's cream/rose material palette. */ -}}
{{- if eq .icon "shield" -}}
<svg class="compute-security__art" viewBox="0 0 400 300" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="secNetGlow" cx="50%" cy="48%" r="52%">
      <stop stop-color="var(--hot)" stop-opacity=".24"/>
      <stop offset="1" stop-color="var(--hot)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="secNetGlass" x1="100" y1="50" x2="300" y2="285" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe8f0" stop-opacity=".96"/>
      <stop offset=".48" stop-color="#ffadcd" stop-opacity=".62"/>
      <stop offset="1" stop-color="#ff6ba8" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="secNetCream" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff8f1"/>
      <stop offset="1" stop-color="#e8ccbd"/>
    </linearGradient>
    <linearGradient id="secNetScreen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd5e5"/>
      <stop offset="1" stop-color="#ff8dbb"/>
    </linearGradient>
    <filter id="secNetShadow" x="-30%" y="-30%" width="160%" height="190%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#6d0f3c" flood-opacity=".2"/>
    </filter>
    <filter id="secNetSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <ellipse cx="200" cy="158" rx="156" ry="132" fill="url(#secNetGlow)"/>
  <ellipse cx="200" cy="274" rx="104" ry="14" fill="#a3154d" opacity=".13" filter="url(#secNetSoft)"/>
  <g filter="url(#secNetShadow)">
    <path d="M200 34 326 84v82c0 66-63 102-126 121-63-19-126-55-126-121V84Z" fill="url(#secNetGlass)" stroke="#ff5c9f" stroke-width="2"/>
    <path d="M200 49 311 93v73c0 55-53 86-111 104" stroke="#fff" stroke-opacity=".6" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M200 270c-58-18-111-49-111-104" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
  </g>
  <g stroke="var(--hot)" stroke-width="2.4" stroke-linecap="round" opacity=".82">
    <path d="M128 142 200 110l72 32-72 50Z" stroke-dasharray="2 8"/>
    <path d="M200 110v82"/>
  </g>
  <g>
    <rect x="112" y="126" width="50" height="36" rx="7" fill="url(#secNetCream)" stroke="#d7b4a4"/>
    <rect x="119" y="133" width="36" height="22" rx="3" fill="url(#secNetScreen)"/>
    <path d="M137 162v7m-13 0h26" stroke="#b58e7d" stroke-width="2" stroke-linecap="round"/>
    <rect x="239" y="126" width="50" height="36" rx="7" fill="url(#secNetCream)" stroke="#d7b4a4"/>
    <rect x="246" y="133" width="36" height="22" rx="3" fill="url(#secNetScreen)"/>
    <path d="M264 162v7m-13 0h26" stroke="#b58e7d" stroke-width="2" stroke-linecap="round"/>
    <rect x="181" y="184" width="38" height="54" rx="8" fill="url(#secNetCream)" stroke="#d7b4a4"/>
    <rect x="187" y="190" width="26" height="36" rx="4" fill="url(#secNetScreen)"/>
    <circle cx="200" cy="235" r="3" fill="#d59cac"/>
  </g>
  <circle cx="200" cy="110" r="8" fill="var(--hot)" opacity=".95"/>
  <circle cx="200" cy="110" r="17" stroke="var(--hot)" stroke-opacity=".35" stroke-width="2"/>
  <g fill="#fff" opacity=".8">
    <circle cx="128" cy="142" r="3"/><circle cx="272" cy="142" r="3"/><circle cx="200" cy="192" r="3"/>
  </g>
</svg>

    <rect x="318" y="65" width="40" height="40" rx="11" fill="url(#secCubeCream)" stroke="#d7b4a4" transform="rotate(8 338 85)"/>
    <circle cx="338" cy="85" r="7" fill="none" stroke="#ff8fba" stroke-width="3"/>
    <rect x="320" y="220" width="44" height="44" rx="12" fill="url(#secCubeCream)" stroke="#d7b4a4" transform="rotate(6 342 242)"/>
    <path d="m333 235 9 7-9 8" stroke="#ff8fba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
