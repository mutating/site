faq:
  index: 08 / QUESTIONS & ANSWERS
  heading: Frequently asked questions.
  items:
  - question: Whose machines run my jobs?
    answer:
    - Your personal devices and computers in organizations you have access to. There is no public compute exchange.
  - question: What can I run today?
    answer:
    - Currently, only GitHub Actions CI is available. Jobs run in Linux ARM64 VMs on Apple Silicon Macs. Runs start
      on a push or manually for the selected branch.
    - 'Not yet supported: macOS/Xcode jobs, pull request triggers, reusable workflows, Docker container actions
      or service containers.'
  - question: What if my computers are busy or offline?
    answer:
    - The computer must be on and awake, with the agent running, internet access and available resources.
    - Without a suitable device, the GitHub Actions workflow fails. It doesn’t wait for resources or automatically
      fall back to hosted runners. Rerun when resources are available or after stopping a job.
  - question: What costs are separate from the subscription?
    answer:
    - Electricity and internet. GitHub may charge for storage and integration jobs on its hosted runners. Rented
      servers are not included.
  - question: Which tasks work well on Mutating Compute?
    answer:
    - Independent parallel jobs that take long enough to justify VM setup and data transfer — for example, tests
      split in advance. Devices don’t combine CPU or memory into one VM.
