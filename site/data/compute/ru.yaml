faq:
  index: 08 / ВОПРОСЫ И ОТВЕТЫ
  heading: Частые вопросы.
  items:
  - question: На чьих компьютерах выполняются мои задачи?
    answer:
    - На ваших устройствах и компьютерах организаций, к которым у вас есть доступ. Публичного обмена мощностями
      нет.
  - question: Что можно запускать сейчас?
    answer:
    - Сейчас доступен CI через GitHub Actions. Задания выполняются в VM с Linux ARM64 на Mac с Apple Silicon. Запуск
      — по push или вручную для выбранной ветки.
    - Пока не поддерживаются задания для macOS/Xcode, запуск по pull request, reusable workflows, Docker container
      actions и service containers.
  - question: Что, если компьютеры заняты или недоступны?
    answer:
    - Нужны работающий агент, интернет и свободные ресурсы. Выключенные и спящие устройства задания не выполняют.
    - 'Без подходящего устройства workflow GitHub Actions завершится ошибкой: он не ждёт ресурсов и не переходит
      автоматически на арендные раннеры. Повторите запуск при появлении ресурсов или после остановки задания.'
  - question: Что оплачивается помимо подписки?
    answer:
    - Электричество и интернет. GitHub может брать плату за хранилище и служебные задачи на своих раннерах. Аренда
      серверов не включена.
  - question: Для каких задач подходит Mutating Compute?
    answer:
    - Независимые задачи, достаточно долгие, чтобы оправдать подготовку VM и передачу данных. Например, заранее
      разделённые части тестов можно запускать параллельно. CPU и память устройств не объединяются в одну VM.
