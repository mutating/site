<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent !important;
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <script>
      (async () => {
        const response = await fetch("/pantograph-variant-20-clean.svg");
        if (!response.ok) {
          throw new Error(`Pantograph SVG failed to load: ${response.status}`);
        }

        const source = new DOMParser().parseFromString(
          await response.text(),
          "image/svg+xml",
        );
        const parseError = source.querySelector("parsererror");
        if (parseError) {
          throw new Error(parseError.textContent || "Pantograph SVG is invalid");
        }

        const sourceScript = source.querySelector("script");
        const runtimeCode = sourceScript?.textContent || "";
        sourceScript?.remove();

        const svg = document.importNode(source.documentElement, true);
        svg.removeAttribute("width");
        svg.removeAttribute("height");
        document.body.replaceChildren(svg);

        if (runtimeCode) {
          const runtime = document.createElement("script");
          runtime.textContent = runtimeCode;
          document.body.append(runtime);
        }
      })().catch((error) => {
        document.documentElement.dataset.pantographError =
          error instanceof Error ? error.message : String(error);
      });
    </script>
  </body>
</html>
