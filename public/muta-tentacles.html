          pointer.y = pointer.targetY;
          const targetEnergy = pointer.inside ? 1 : 0;
          pointer.energy += (targetEnergy - pointer.energy) * (1 - Math.exp(-delta * 6));
          const pointerInteraction =
            currentPointerInteraction(wallTime);
          const collectDiagnostics =
            debugTargets || wallTime - diagnosticStart >= 1;
          if (collectDiagnostics) {
            diagnostics.activeTips = 0;
            diagnostics.maximumAttraction = 0;
            diagnostics.minimumTipClearance = 1;
            diagnostics.minimumCursorDistance = 1;
            diagnostics.closestTipX = pointer.x;
            diagnostics.closestTipY = pointer.y;
            diagnostics.strongTipCount = 0;
            diagnostics.strongTipX = 0;
            diagnostics.strongTipY = 0;
            diagnostics.grabberCount = 0;
            diagnostics.maximumGrabberError = 0;
          }

          const grabberCandidates = [];
          for (const skeleton of skeletons) {
            skeleton.grabbed = false;
            if (pointer.energy <= 0.01) {
              continue;
            }
            const projectedRoot = projectPointToCanvas({
              x: skeleton.root.x,
              y: skeleton.root.y,
              z: skeleton.baseHeight,
            });
            const rootDistance = length2(
              (
                pointer.x -
                projectedRoot.x
              ) *
                surfaceAspect,
              pointer.y - projectedRoot.y,
            );
            if (
              pointer.pressDirection >= 0 &&
              rootDistance <= skeleton.maximumGrabDistance
            ) {
              let insertionIndex = grabberCandidates.length;
              while (
                insertionIndex > 0 &&
                grabberCandidates[insertionIndex - 1].rootDistance >
                  rootDistance
              ) {
                insertionIndex--;
              }
              if (insertionIndex < MAX_CURSOR_GRABBERS) {
                grabberCandidates.splice(insertionIndex, 0, {
                  skeleton,
                  rootDistance,
                });
                if (
                  grabberCandidates.length > MAX_CURSOR_GRABBERS
                ) {
                  grabberCandidates.pop();
                }
              }
            }
          }
          const grabberCount = grabberCandidates.length;
          if (collectDiagnostics) {
            diagnostics.grabberCount = grabberCount;
          }
          for (
            let grabberIndex = 0;
            grabberIndex < grabberCount;
            grabberIndex++
          ) {
            grabberCandidates[grabberIndex].skeleton.grabbed = true;
          }

          spatialCountPixels.fill(0);
          spatialGridValid = true;
          maximumSpatialCellLoad = 0;
          const velocityDamping = Math.exp(-delta * 10.2);
          const restResponse = 72.0 * delta * delta;
          const verticalMotionTime = time * 0.31;

          for (const skeleton of skeletons) {
            const points = skeleton.points;
            const root = points[0];
            root.x = skeleton.root.x;
            root.y = skeleton.root.y;
            root.z = skeleton.baseHeight;
            root.px = root.x;
            root.py = root.y;
            root.pz = root.z;

            let restX = root.x;
            let restY = root.y;
            let restZ = root.z;
            const timeSpeed = time * skeleton.speed;
            const timeSpeedSecondary = timeSpeed * 0.47;
            const timeSpeedDetail = timeSpeed * 1.53;
            const detailPhase = skeleton.phase * 0.31;

            for (let joint = 1; joint <= CHAIN_LINKS; joint++) {
              const point = points[joint];
              const profile = jointProfiles[joint];
              const spatialNoise =
                Math.sin(
                  timeSpeed +
                    skeleton.phase +
                    profile.noisePhaseA,
                ) *
                  0.62 +
                Math.sin(
                  timeSpeedSecondary +
                    skeleton.phase2 -
                    profile.noisePhaseB,
                ) *
                  0.27 +
                Math.sin(
                  timeSpeedDetail +
                    detailPhase +
                    profile.noisePhaseC,
                ) *
                  0.11;
              const restAngle =
                skeleton.baseAngle +
                skeleton.bend * profile.bendFactor +
                spatialNoise *
                  skeleton.noiseStrength *
                  profile.noiseWeight;
              const horizontalStep =
                skeleton.horizontalSteps[joint];
              const verticalStep =
                skeleton.verticalSteps[joint];
              restX += Math.cos(restAngle) * horizontalStep;
              restY += Math.sin(restAngle) * horizontalStep;
              restZ +=
                verticalStep *
                (
                  0.96 +
                  Math.sin(
                    verticalMotionTime +
                      skeleton.phase2 +
                      profile.verticalPhase,
                  ) *
                    0.035
                );

              const velocityX = (point.x - point.px) * velocityDamping;
              const velocityY = (point.y - point.py) * velocityDamping;
              const velocityZ = (point.z - point.pz) * velocityDamping;
              point.px = point.x;
              point.py = point.y;
              point.pz = point.z;
              point.x +=
                velocityX +
                (restX - point.x) * restResponse;
              point.y +=
                velocityY +
                (restY - point.y) * restResponse;
              point.z +=
                velocityZ +
                (restZ - point.z) * restResponse;
            }

            const tip = points[CHAIN_LINKS];
            const projectedTip = projectPointToCanvas(tip);
            const tipDistance = length2(
              (
                pointer.x -
                projectedTip.x
              ) *
                surfaceAspect,
              pointer.y - projectedTip.y,
            );
            const normalizedDistance = clamp(
              tipDistance /
                (
                  skeleton.projectedAttractionRadius *
                  pointerInteraction.radiusMultiplier
                ),
              0,
              1,
            );
            const distanceFalloff = 1 - normalizedDistance;
            const forceDirection = pointer.pressed
              ? pointer.pressDirection
              : 1;
            const pointerForce =
              pointer.energy *
              distanceFalloff *
              distanceFalloff *
              pointerInteraction.forceMultiplier *
              forceDirection;
            if (collectDiagnostics) {
              const forceMagnitude = Math.abs(pointerForce);
              if (forceMagnitude > 0.01) {
                diagnostics.activeTips += 1;
              }
              diagnostics.maximumAttraction = Math.max(
                diagnostics.maximumAttraction,
                forceMagnitude,
              );
            }
            const surfaceDistance = tip.z - skeleton.baseHeight;
            const repulsion = clamp(
              1 - surfaceDistance / skeleton.tipClearance,
              0,
              1,
            );
            tip.z += repulsion * repulsion * delta * 0.160;

            for (let iteration = 0; iteration < 8; iteration++) {
              root.x = skeleton.root.x;
              root.y = skeleton.root.y;
              root.z = skeleton.baseHeight;

              for (let joint = 0; joint < CHAIN_LINKS; joint++) {
                const a = points[joint];
                const b = points[joint + 1];
                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const dz = b.z - a.z;
                const distance = Math.max(
                  0.000001,
                  length3(dx, dy, dz),
                );
                const correction =
                  (distance - skeleton.linkLength) / distance;

                if (joint === 0) {
                  b.x -= dx * correction;
                  b.y -= dy * correction;
                  b.z -= dz * correction;
                } else {
                  const weightA = 0.48;
                  const weightB = 0.52;
                  a.x += dx * correction * weightA;
                  a.y += dy * correction * weightA;
                  a.z += dz * correction * weightA;
                  b.x -= dx * correction * weightB;
                  b.y -= dy * correction * weightB;
                  b.z -= dz * correction * weightB;
                }
              }

              const constrainedTip = points[CHAIN_LINKS];
              if (
                constrainedTip.z < skeleton.minimumTipHeight
              ) {
                constrainedTip.z +=
                  (
                    skeleton.minimumTipHeight -
                    constrainedTip.z
                  ) *
                  0.28;
              }

            }

            solveChainTowardPointer(skeleton, pointerForce, delta);

            if (collectDiagnostics) {
              const forceMagnitude = Math.abs(pointerForce);
              const finalTip = points[CHAIN_LINKS];
              const finalProjectedTip =
                projectPointToCanvas(finalTip);
              const cursorDistance = length2(
                (
                  pointer.x -
                  finalProjectedTip.x
                ) *
                  surfaceAspect,
                pointer.y - finalProjectedTip.y,
              );
              if (skeleton.grabbed) {
                diagnostics.maximumGrabberError = Math.max(
                  diagnostics.maximumGrabberError,
                  cursorDistance,
                );
              }
              if (forceMagnitude > 0.48) {
                diagnostics.strongTipCount += 1;
                diagnostics.strongTipX += finalProjectedTip.x;
                diagnostics.strongTipY += finalProjectedTip.y;
              }
              if (
                forceMagnitude > 0.01 ||
                skeleton.grabbed
              ) {
                if (
                  cursorDistance <
                  diagnostics.minimumCursorDistance
                ) {
                  diagnostics.minimumCursorDistance =
                    cursorDistance;
                  diagnostics.closestTipX =
                    finalProjectedTip.x;
                  diagnostics.closestTipY =
                    finalProjectedTip.y;
                }
              }
              diagnostics.minimumTipClearance = Math.min(
                diagnostics.minimumTipClearance,
                finalTip.z - skeleton.baseHeight,
              );
            }

            let boundMinimumX = Infinity;
            let boundMinimumY = Infinity;
            let boundMaximumX = -Infinity;
            let boundMaximumY = -Infinity;
            for (let renderJoint = 0; renderJoint < RENDER_POINTS; renderJoint++) {
              const chainJoint =
                renderChainJoints[renderJoint];
              const point = points[chainJoint];
              const radius =
                skeleton.radius *
                renderRadiusScales[renderJoint];
              const offset =
                skeleton.pixelOffset + renderJoint * 4;
              skeletonPixels[offset] = point.x;
              skeletonPixels[offset + 1] = point.y;
              skeletonPixels[offset + 2] = point.z;
              skeletonPixels[offset + 3] = radius;

              const boundRadius =
                radius * renderBoundScales[renderJoint];
              boundMinimumX = Math.min(
                boundMinimumX,
                point.x - boundRadius,
              );
              boundMinimumY = Math.min(
                boundMinimumY,
                point.y - boundRadius,
              );
              boundMaximumX = Math.max(
                boundMaximumX,
                point.x + boundRadius,
              );
              boundMaximumY = Math.max(
                boundMaximumY,
                point.y + boundRadius,
              );
            }

            let touchedSkeletonCellCount = 0;
            if (spatialGridValid) {
              for (
                let renderSegment = 0;
                renderSegment < RENDER_POINTS - 1;
                renderSegment++
              ) {
                const pointA =
                  points[renderChainJoints[renderSegment]];
                const pointB =
                  points[renderChainJoints[renderSegment + 1]];
                const radiusA =
                  skeleton.radius *
                  renderRadiusScales[renderSegment];
                const radiusB =
                  skeleton.radius *
                  renderRadiusScales[renderSegment + 1];
                let segmentPadding =
                  Math.max(radiusA, radiusB) + 0.001;
                if (renderSegment === 0) {
                  segmentPadding = Math.max(
                    segmentPadding,
                    radiusA * 1.48 + 0.001,
                  );
                }
                const segmentMinimumCellX = clamp(
                  Math.floor(
                    (
                      (
                        Math.min(pointA.x, pointB.x) -
                        segmentPadding
                      ) /
                      surfaceAspect
                    ) *
                      SPATIAL_GRID_COLUMNS,
                  ),
                  0,
                  SPATIAL_GRID_COLUMNS - 1,
                );
                const segmentMinimumCellY = clamp(
                  Math.floor(
                    (
                      Math.min(pointA.y, pointB.y) -
                      segmentPadding
                    ) *
                      SPATIAL_GRID_ROWS,
                  ),
                  0,
                  SPATIAL_GRID_ROWS - 1,
                );
                const segmentMaximumCellX = clamp(
                  Math.floor(
                    (
                      (
                        Math.max(pointA.x, pointB.x) +
                        segmentPadding
                      ) /
                      surfaceAspect
                    ) *
                      SPATIAL_GRID_COLUMNS,
                  ),
                  0,
                  SPATIAL_GRID_COLUMNS - 1,
                );
                const segmentMaximumCellY = clamp(
                  Math.floor(
                    (
                      Math.max(pointA.y, pointB.y) +
                      segmentPadding
                    ) *
                      SPATIAL_GRID_ROWS,
                  ),
                  0,
                  SPATIAL_GRID_ROWS - 1,
                );
                const segmentBit = 1 << renderSegment;
                for (
                  let cellY = segmentMinimumCellY;
                  cellY <= segmentMaximumCellY;
                  cellY++
                ) {
                  for (
                    let cellX = segmentMinimumCellX;
                    cellX <= segmentMaximumCellX;
                    cellX++
                  ) {
                    const cellIndex =
                      cellY * SPATIAL_GRID_COLUMNS + cellX;
                    if (skeletonCellSegmentMasks[cellIndex] === 0) {
                      touchedSkeletonCells[
                        touchedSkeletonCellCount++
                      ] = cellIndex;
                    }
                    skeletonCellSegmentMasks[cellIndex] |=
                      segmentBit;
                  }
                }
              }
            }

            const boundCenterX = (boundMinimumX + boundMaximumX) * 0.5;
            const boundCenterY = (boundMinimumY + boundMaximumY) * 0.5;
            const skeletonBoundRadius =
              length2(
                boundMaximumX - boundMinimumX,
                boundMaximumY - boundMinimumY,
              ) *
                0.5 +
              0.035;
            const boundOffset = skeleton.boundOffset;
            skeletonBoundsPixels[boundOffset] = boundCenterX;
            skeletonBoundsPixels[boundOffset + 1] = boundCenterY;
            skeletonBoundsPixels[boundOffset + 2] =
              skeletonBoundRadius;
            skeletonBoundsPixels[boundOffset + 3] = 1;

            if (spatialGridValid) {
              for (
                let touchedCell = 0;
                touchedCell < touchedSkeletonCellCount;
                touchedCell++
              ) {
                const cellIndex =
                  touchedSkeletonCells[touchedCell];
                const segmentMask =
                  skeletonCellSegmentMasks[cellIndex];
                const cellLoad = spatialCountPixels[cellIndex];
                if (cellLoad >= MAX_SPATIAL_SKELETONS) {
                  spatialGridValid = false;
                  break;
                }
                spatialIndexPixels[
                  cellIndex * MAX_SPATIAL_SKELETONS + cellLoad
                ] = skeleton.index;
                spatialSegmentMaskPixels[
                  cellIndex * MAX_SPATIAL_SKELETONS + cellLoad
                ] = segmentMask;
                const nextCellLoad = cellLoad + 1;
                spatialCountPixels[cellIndex] = nextCellLoad;
                maximumSpatialCellLoad = Math.max(
                  maximumSpatialCellLoad,
                  nextCellLoad,
                );
              }
            }
            for (
              let touchedCell = 0;
              touchedCell < touchedSkeletonCellCount;
              touchedCell++
            ) {
              skeletonCellSegmentMasks[
                touchedSkeletonCells[touchedCell]
              ] = 0;
            }
          }

          if (debugTargets) {
            const visible = pointer.inside ? "block" : "none";
            cursorMarker.style.display = visible;
            tipMarker.style.display = visible;
            cursorMarker.style.left = `${pointer.x * 100}%`;
            cursorMarker.style.top = `${pointer.y * 100}%`;
            tipMarker.style.left = `${diagnostics.closestTipX * 100}%`;
            tipMarker.style.top = `${diagnostics.closestTipY * 100}%`;
          }

          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, skeletonTexture);
          gl.texSubImage2D(
            gl.TEXTURE_2D,
            0,
            0,
            0,
            RENDER_POINTS,
            skeletonCount,
            gl.RGBA,
            gl.FLOAT,
            skeletonPixels,
          );
          gl.activeTexture(gl.TEXTURE2);
          gl.bindTexture(gl.TEXTURE_2D, skeletonBoundsTexture);
          gl.texSubImage2D(
            gl.TEXTURE_2D,
            0,
            0,
            0,
            1,
            skeletonCount,
            gl.RGBA,
            gl.FLOAT,
            skeletonBoundsPixels,
          );
          if (spatialGridValid) {
            gl.activeTexture(gl.TEXTURE3);
            gl.bindTexture(gl.TEXTURE_2D, spatialIndexTexture);
            gl.pixelStorei(
              gl.UNPACK_ROW_LENGTH,
              MAX_SPATIAL_SKELETONS,
            );
            gl.texSubImage2D(
              gl.TEXTURE_2D,
              0,
              0,
              0,
              maximumSpatialCellLoad,
              SPATIAL_CELL_COUNT,
              gl.RED_INTEGER,
              gl.UNSIGNED_SHORT,
              spatialIndexPixels,
            );
            gl.activeTexture(gl.TEXTURE5);
            gl.bindTexture(
              gl.TEXTURE_2D,
              spatialSegmentMaskTexture,
            );
            gl.texSubImage2D(
              gl.TEXTURE_2D,
              0,
              0,
              0,
              maximumSpatialCellLoad,
              SPATIAL_CELL_COUNT,
              gl.RED_INTEGER,
              gl.UNSIGNED_SHORT,
              spatialSegmentMaskPixels,
            );
            gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 0);
            gl.activeTexture(gl.TEXTURE4);
            gl.bindTexture(gl.TEXTURE_2D, spatialCountTexture);
            gl.texSubImage2D(
              gl.TEXTURE_2D,
              0,
              0,
              0,
              1,
              SPATIAL_CELL_COUNT,
              gl.RED_INTEGER,
              gl.UNSIGNED_SHORT,
              spatialCountPixels,
            );
          }
        }

        function bindTexture(unit, texture) {
          gl.activeTexture(gl.TEXTURE0 + unit);
          gl.bindTexture(gl.TEXTURE_2D, texture);
        }

        function render(time) {
          resize();
          const texelX = 1 / pixelWidth;
          const texelY = 1 / pixelHeight;

          gl.bindFramebuffer(gl.FRAMEBUFFER, renderTargets.surfaceFramebuffer);
          gl.viewport(0, 0, pixelWidth, pixelHeight);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.useProgram(surfaceProgram);
          bindTexture(0, noiseTexture);
          bindTexture(1, skeletonTexture);
          bindTexture(2, skeletonBoundsTexture);
          bindTexture(3, spatialIndexTexture);
          bindTexture(4, spatialCountTexture);
          bindTexture(5, spatialSegmentMaskTexture);
          gl.uniform1i(
            surfaceUniforms.useSpatialGrid,
            spatialGridValid ? 1 : 0,
          );
          gl.uniform1f(surfaceUniforms.time, time);
          gl.bindVertexArray(surfaceVao);
          gl.drawElements(gl.TRIANGLES, grid.indices.length, gl.UNSIGNED_INT, 0);

          gl.bindVertexArray(fullscreenVao);
          gl.useProgram(scatterProgram);
          gl.uniform2f(scatterUniforms.texel, texelX, texelY);

          gl.bindFramebuffer(gl.FRAMEBUFFER, renderTargets.scatterFramebufferA);
          bindTexture(0, renderTargets.sharp);
          bindTexture(1, renderTargets.geometry);
          gl.uniform2f(scatterUniforms.direction, 1, 0);
          gl.uniform1f(scatterUniforms.pass, 0);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          gl.bindFramebuffer(gl.FRAMEBUFFER, renderTargets.scatterFramebufferB);
          bindTexture(0, renderTargets.scatterA);
          bindTexture(1, renderTargets.geometry);
          gl.uniform2f(scatterUniforms.direction, 0, 1);
          gl.uniform1f(scatterUniforms.pass, 1);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, pixelWidth, pixelHeight);
          gl.useProgram(compositeProgram);
          bindTexture(0, renderTargets.sharp);
          bindTexture(1, renderTargets.scatterB);
          bindTexture(2, renderTargets.geometry);
          gl.uniform2f(compositeUniforms.texel, texelX, texelY);
          gl.uniform2f(compositeUniforms.pointer, pointer.x, 1 - pointer.y);
          gl.uniform1f(compositeUniforms.pointerInside, pointer.energy);
          gl.uniform1f(compositeUniforms.time, time);
          gl.uniform3f(
            compositeUniforms.substrate,
            substrateColor[0],
            substrateColor[1],
            substrateColor[2],
          );
          gl.uniform2f(
            compositeUniforms.viewport,
            pixelWidth,
            pixelHeight,
          );
          gl.uniform1f(
            compositeUniforms.cornerRadius,
            32 *
              Math.min(
                pixelWidth / Math.max(1, canvasRect.width),
                pixelHeight / Math.max(1, canvasRect.height),
              ),
          );
          gl.uniform1f(
            compositeUniforms.useTransparentSubstrate,
            activeTheme === "light" ? 1 : 0,
          );
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        let lastTime = performance.now() * 0.001;
        let smoothedTime = lastTime;
        let diagnosticStart = lastTime;
        let diagnosticFrames = 0;
        let immediateFrameInProgress = false;
        let skipRedundantAnimationFrame = false;
        let lastPhysicsDuration = 0;
        let lastRenderSubmissionDuration = 0;

        function runImmediateInteractionFrame() {
          if (immediateFrameInProgress || !pointer.impulsePending) {
            return;
          }
          immediateFrameInProgress = true;
          const inputStartedAt = pointer.impulseStartedAt;
          const now = performance.now() * 0.001;
          const elapsed = Math.max(0.001, now - lastTime);
          const delta = Math.min(
            0.033,
            Math.max(1 / 90, elapsed),
          );
          lastTime = now;
          smoothedTime +=
            delta * (prefersReducedMotion ? 0.22 : 1);
          const physicsStartedAt = performance.now();
          updateSkeletons(smoothedTime, delta, now);
          lastPhysicsDuration =
            performance.now() - physicsStartedAt;
          const renderStartedAt = performance.now();
          render(smoothedTime);
          gl.flush();
          lastRenderSubmissionDuration =
            performance.now() - renderStartedAt;
          canvas.dataset.inputToImpulseSubmissionMs =
            (
              performance.now() -
              inputStartedAt * 1000
            ).toFixed(1);
          canvas.dataset.immediateImpulseFrame = "enabled";
          skipRedundantAnimationFrame = true;
          immediateFrameInProgress = false;
        }

        function frame(nowMilliseconds) {
          const now = nowMilliseconds * 0.001;
          if (
            skipRedundantAnimationFrame &&
            now - lastTime < 0.008
          ) {
            skipRedundantAnimationFrame = false;
            requestAnimationFrame(frame);
            return;
          }
          skipRedundantAnimationFrame = false;
          const delta = Math.min(0.033, Math.max(0.001, now - lastTime));
          lastTime = now;
          smoothedTime += delta * (prefersReducedMotion ? 0.22 : 1);
          const physicsStartedAt = performance.now();
          updateSkeletons(smoothedTime, delta, now);
          lastPhysicsDuration =
            performance.now() - physicsStartedAt;
          const renderStartedAt = performance.now();
          render(smoothedTime);
          lastRenderSubmissionDuration =
            performance.now() - renderStartedAt;
          diagnosticFrames += 1;
          if (now - diagnosticStart >= 1) {
            diagnostics.fps = diagnosticFrames / (now - diagnosticStart);
            canvas.dataset.fps = diagnostics.fps.toFixed(0);
            canvas.dataset.linksPerTentacle = String(CHAIN_LINKS);
            canvas.dataset.tentacles = String(skeletons.length);
            canvas.dataset.spatialAcceleration =
              spatialGridValid ? "enabled" : "fallback";
            canvas.dataset.maximumSpatialCellLoad = String(
              maximumSpatialCellLoad,
            );
            canvas.dataset.activeTips = String(diagnostics.activeTips);
            canvas.dataset.maximumAttraction =
              diagnostics.maximumAttraction.toFixed(3);
            canvas.dataset.minimumTipClearance =
              diagnostics.minimumTipClearance.toFixed(3);
            canvas.dataset.minimumCursorDistance =
              diagnostics.minimumCursorDistance.toFixed(4);
            canvas.dataset.motionSpeedMultiplier = String(
              MOTION_SPEED_MULTIPLIER,
            );
            canvas.dataset.pointerX = pointer.x.toFixed(4);
            canvas.dataset.pointerY = pointer.y.toFixed(4);
            canvas.dataset.closestTipX =
              diagnostics.closestTipX.toFixed(4);
            canvas.dataset.closestTipY =
              diagnostics.closestTipY.toFixed(4);
            canvas.dataset.strongTipCount =
              String(diagnostics.strongTipCount);
            canvas.dataset.strongTipX =
              (
                diagnostics.strongTipX /
                Math.max(1, diagnostics.strongTipCount)
              ).toFixed(4);
            canvas.dataset.strongTipY =
              (
                diagnostics.strongTipY /
                Math.max(1, diagnostics.strongTipCount)
              ).toFixed(4);
            canvas.dataset.grabberCount =
              String(diagnostics.grabberCount);
            canvas.dataset.maximumGrabberError =
              diagnostics.maximumGrabberError.toFixed(4);
            canvas.dataset.physicsMs =
              lastPhysicsDuration.toFixed(1);
            canvas.dataset.renderSubmissionMs =
              lastRenderSubmissionDuration.toFixed(1);
            diagnosticStart = now;
            diagnosticFrames = 0;
          }
          requestAnimationFrame(frame);
        }

        updateSkeletons(smoothedTime, 1 / 60);
        resize();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
