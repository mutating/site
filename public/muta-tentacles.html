<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffafb" />
    <meta
      name="description"
      content="Muta — единая живая желейная поверхность с процедурными щупальцами."
    />
    <title>Muta — живая желейная актиния</title>
    <style>
      :root {
        color-scheme: light;
        --site-background: #fffafb;
        background: transparent;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --site-background: #090608;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        border-radius: 32px;
        overflow: hidden;
        background: transparent;
      }

      body,
      main {
        width: 100%;
        height: 100%;
      }

      main {
        position: relative;
      }

      .organism {
        position: absolute;
        inset: 0;
        border-radius: 32px;
        overflow: hidden;
        background: transparent;
        isolation: isolate;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 32px;
        outline: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

    </style>
  </head>
  <body>
    <main>
      <section
        class="organism"
        aria-label="Интерактивная живая поверхность Muta"
        aria-describedby="interaction-help"
      >
        <canvas id="muta" tabindex="0"></canvas>
        <p class="sr-only" id="interaction-help">
          Перемещайте указатель внутри квадрата. Щупальца в радиусе досягаемости
          потянутся к нему, а ближайшие попробуют обхватить указатель. Нажатие
          левой кнопки создаёт короткий импульс притяжения, правой — отталкивания.
        </p>
      </section>
    </main>

    <script>
      (() => {
        "use strict";

        const canvas = document.querySelector("#muta");
        const gl = canvas.getContext("webgl2", {
          alpha: true,
          antialias: false,
          depth: false,
          desynchronized: true,
          powerPreference: "high-performance",
          preserveDrawingBuffer: false,
          premultipliedAlpha: true,
        });

        if (!gl) {
          const fallback = document.createElement("p");
          fallback.textContent = "Для рендера Muta требуется браузер с поддержкой WebGL 2.";
          fallback.style.cssText =
            "position:absolute;inset:10%;display:grid;place-items:center;text-align:center;color:#a83368;font:500 16px system-ui";
          canvas.replaceWith(fallback);
          return;
        }
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, 2);

        const CHAIN_LINKS = 50;
        const RENDER_POINTS = 14;
        const MAX_SKELETONS = 900;
        const MOTION_SPEED_MULTIPLIER = (4 / 5) * 2 * 1.2;
        const TENTACLE_THICKNESS_MULTIPLIER = 1.5 * 1.3 * 1.3;
        const CURSOR_ATTRACTION_MULTIPLIER = 1 / 6 / 1.1;
        const LEFT_HELD_FORCE_MULTIPLIER = 2;
        const RIGHT_HELD_FORCE_MULTIPLIER = 1;
        const PRESS_IMPULSE_MULTIPLIER = 20 / 1.5;
        const PRESS_IMPULSE_RADIUS_MULTIPLIER = 1.5;
        const PRESS_IMPULSE_HOLD_SECONDS = 0.10 / 6.75;
        const PRESS_IMPULSE_DECAY_RATE = 26 * 6.75;
        const PRESS_IMPULSE_TOTAL_SECONDS = 0.28 / 6.75;
        const POINTER_SOLVER_FULL_BODY_FORCE = 0.35;
        const MAX_CURSOR_GRABBERS = 6;
        const PROJECTION_SCALE = 1.0;
        const HEIGHT_PERSPECTIVE = 0;
        const HEIGHT_OFFSET_X = 0;
        const HEIGHT_OFFSET_Y = 0;
        const RENDER_SUPERSAMPLE = 2;
        const SPATIAL_GRID_ROWS = 64;
        const MAX_SPATIAL_SKELETONS = 512;
        const prefersReducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const floatColor = Boolean(gl.getExtension("EXT_color_buffer_float"));
        const isCompact = matchMedia("(max-width: 620px)").matches;
        const initialCanvasRect = canvas.getBoundingClientRect();
        const surfaceAspect = Math.min(
          2.4,
          Math.max(
            0.6,
            initialCanvasRect.width / Math.max(1, initialCanvasRect.height),
          ),
        );
        const maximumTextureDimension = gl.getParameter(
          gl.MAX_TEXTURE_SIZE,
        );
        const SPATIAL_GRID_COLUMNS = Math.min(
          Math.floor(
            maximumTextureDimension / SPATIAL_GRID_ROWS,
          ),
          Math.max(
            1,
            Math.round(SPATIAL_GRID_ROWS * surfaceAspect),
          ),
        );
        const SPATIAL_CELL_COUNT =
          SPATIAL_GRID_COLUMNS * SPATIAL_GRID_ROWS;
        const skeletonCount = Math.min(
          MAX_SKELETONS,
          Math.max(
            150,
            Math.round((isCompact ? 209 : 356) * surfaceAspect),
          ),
        );
        const gridResolution = isCompact ? 512 : 640;
        const gpuRenderLimit = Math.min(
          maximumTextureDimension,
          gl.getParameter(gl.MAX_RENDERBUFFER_SIZE),
        );
        const jointProfiles = Array.from(
          { length: CHAIN_LINKS + 1 },
          (_, joint) => {
            const s = joint / CHAIN_LINKS;
            return {
              s,
              bendFactor: s * s,
              initialPhase: s * 4.2,
              noisePhaseA: s * 5.3,
              noisePhaseB: s * 9.1,
              noisePhaseC: s * 14.7,
              noiseWeight: 0.28 + s * 0.72,
              horizontalTaper: 1 - s * 0.08,
              verticalPhase: s * 3.2,
            };
          },
        );
        const renderChainJoints = new Uint8Array(RENDER_POINTS);
        const renderRadiusScales = new Float64Array(RENDER_POINTS);
        const renderBoundScales = new Float64Array(RENDER_POINTS);
        for (
          let renderJoint = 0;
          renderJoint < RENDER_POINTS;
          renderJoint++
        ) {
          const s = renderJoint / (RENDER_POINTS - 1);
          renderChainJoints[renderJoint] = Math.round(
            s * CHAIN_LINKS,
          );
          renderRadiusScales[renderJoint] =
            renderJoint === 0 ? 1.48 : 1.09 - s * 0.12;
          renderBoundScales[renderJoint] =
            renderJoint === 0 ? 1.48 : 1;
        }

        const surfaceVertex = `#version 300 es
          precision highp float;
          precision highp int;

          in vec2 aUv;

          uniform sampler2D uNoise;
          uniform sampler2D uSkeletons;
          uniform sampler2D uSkeletonBounds;
          uniform highp usampler2D uSpatialIndices;
          uniform highp usampler2D uSpatialSegmentMasks;
          uniform highp usampler2D uSpatialCounts;
          uniform int uSkeletonCount;
          uniform int uUseSpatialGrid;
          uniform float uTime;
          uniform float uSurfaceAspect;

          out vec3 vWorld;
          out float vHeight;
          out float vVariation;
          out float vEdge;
          out float vRidge;

          const int MAX_SKELS = ${MAX_SKELETONS};
          const int RENDER_POINTS = ${RENDER_POINTS};
          const int RENDER_SEGMENTS = ${RENDER_POINTS - 1};
          const int SPATIAL_GRID_COLUMNS = ${SPATIAL_GRID_COLUMNS};
          const int SPATIAL_GRID_ROWS = ${SPATIAL_GRID_ROWS};
          const int MAX_SPATIAL_SKELS = ${MAX_SPATIAL_SKELETONS};
          float saturate(float x) {
            return clamp(x, 0.0, 1.0);
          }

          float smoothMaximum(float a, float b, float softness) {
            float h = saturate(0.5 + 0.5 * (b - a) / softness);
            return mix(a, b, h) + softness * h * (1.0 - h);
          }

          vec4 noise4(vec2 uv) {
            return textureLod(uNoise, fract(uv), 0.0);
          }

          float morphNoise(vec2 uv) {
            float t = uTime;
            vec4 n0 = noise4(uv * 1.05 + vec2(t * 0.010, -t * 0.008));
            vec4 n1 = noise4(uv * 1.87 + vec2(-t * 0.007, t * 0.011));
            float a = 0.5 + 0.5 * sin(t * 0.135);
            float b = 0.5 + 0.5 * sin(t * 0.091 + 1.7);
            return mix(n0.r, n0.g, a) * 0.63 + mix(n1.b, n1.a, b) * 0.37;
          }

          float organismMask(vec2 uv) {
            return 1.0;
          }

          vec2 segmentMetric(vec2 p, vec2 a, vec2 b) {
            vec2 ab = b - a;
            float t = saturate(dot(p - a, ab) / max(dot(ab, ab), 0.000001));
            return vec2(length(p - (a + ab * t)), t);
          }

          float capsuleTop(float distanceToAxis, float radius, float centerHeight) {
            float x = saturate(distanceToAxis / max(radius, 0.0001));
            float dome = sqrt(max(0.0, 1.0 - x * x));
            float skirt = pow(1.0 - x, 2.2);
            return centerHeight * mix(skirt, dome, 0.78);
          }

          float evaluateSurface(
            vec2 rawUv,
            out float variation,
            out float ridgeAmount,
            out float edgeMask
          ) {
            vec2 displayUv = clamp(rawUv, 0.0, 1.0);
            vec2 uv = vec2(
              displayUv.x * uSurfaceAspect,
              displayUv.y
            );
            edgeMask = organismMask(uv);
            float mask = edgeMask;
            float broad = morphNoise(uv * 0.71 + vec2(0.13, 0.29));
            float fine = morphNoise(uv * 2.55 + vec2(0.47, 0.11));
            float base = (0.022 + broad * 0.030 + fine * 0.012) * mask;
            float height = base;
            float strongest = 0.0;
            variation = (fine - 0.5) * 0.36;

            ivec2 spatialCell = ivec2(
              clamp(
                floor(
                  vec2(
                    uv.x / uSurfaceAspect *
                      float(SPATIAL_GRID_COLUMNS),
                    uv.y * float(SPATIAL_GRID_ROWS)
                  )
                ),
                vec2(0.0),
                vec2(
                  float(SPATIAL_GRID_COLUMNS - 1),
                  float(SPATIAL_GRID_ROWS - 1)
                )
              )
            );
            int spatialCellIndex =
              spatialCell.y * SPATIAL_GRID_COLUMNS +
              spatialCell.x;
            int spatialCandidateCount = min(
              int(
                texelFetch(
                  uSpatialCounts,
                  ivec2(0, spatialCellIndex),
                  0
                ).r
              ),
              MAX_SPATIAL_SKELS
            );
            int candidateCount =
              uUseSpatialGrid != 0
                ? spatialCandidateCount
                : uSkeletonCount;

            for (int candidate = 0; candidate < MAX_SKELS; candidate++) {
              if (candidate >= candidateCount) {
                break;
              }
              int i =
                uUseSpatialGrid != 0
                  ? int(
                      texelFetch(
                        uSpatialIndices,
                        ivec2(candidate, spatialCellIndex),
                        0
                      ).r
                    )
                  : candidate;
              uint segmentMask =
                uUseSpatialGrid != 0
                  ? texelFetch(
                      uSpatialSegmentMasks,
                      ivec2(candidate, spatialCellIndex),
                      0
                    ).r
                  : uint((1 << RENDER_SEGMENTS) - 1);

              vec4 skeletonBounds =
                texelFetch(uSkeletonBounds, ivec2(0, i), 0);
              vec2 boundDelta = uv - skeletonBounds.xy;
              if (
                dot(boundDelta, boundDelta) >
                skeletonBounds.z * skeletonBounds.z
              ) {
                continue;
              }

              float strand = 0.0;

              for (int joint = 1; joint < RENDER_POINTS; joint++) {
                uint segmentBit = uint(1) << uint(joint - 1);
                if ((segmentMask & segmentBit) == uint(0)) {
                  continue;
                }
                vec4 previousPoint =
                  texelFetch(uSkeletons, ivec2(joint - 1, i), 0);
                vec4 currentPoint = texelFetch(uSkeletons, ivec2(joint, i), 0);
                vec2 metric = segmentMetric(uv, previousPoint.xy, currentPoint.xy);
                float radius = mix(previousPoint.w, currentPoint.w, metric.y);
                float centerHeight = mix(previousPoint.z, currentPoint.z, metric.y);
                strand = max(
                  strand,
                  capsuleTop(metric.x, radius, centerHeight)
                );
              }

              if (
                (
                  segmentMask &
                  (uint(1) << uint(RENDER_SEGMENTS - 1))
                ) != uint(0)
              ) {
                vec4 tipPoint =
                  texelFetch(
                    uSkeletons,
                    ivec2(RENDER_POINTS - 1, i),
                    0
                  );
                float tipDistance = length(uv - tipPoint.xy);
                strand = max(
                  strand,
                  capsuleTop(
                    tipDistance,
                    tipPoint.w,
                    tipPoint.z * 1.025
                  )
                );
              }
              if ((segmentMask & uint(1)) != uint(0)) {
                vec4 rootPoint =
                  texelFetch(uSkeletons, ivec2(0, i), 0);
                float rootDistance = length(uv - rootPoint.xy);
                strand = max(
                  strand,
                  capsuleTop(
                    rootDistance,
                    rootPoint.w * 1.48,
                    rootPoint.z * 0.90
                  )
                );
              }
              strand *= mask;

              float softness = mix(0.019, 0.032, saturate(strand * 4.2));
              height = smoothMaximum(height, strand, softness);

              float strength = strand / max(height, 0.001);
              if (strength > strongest) {
                strongest = strength;
                float indexVariation =
                  sin(float(i) * 12.9898 + 4.137) * 0.5 +
                  sin(float(i) * 3.711) * 0.24;
                variation = indexVariation;
              }
            }

            float micro =
              (morphNoise(uv * 4.8 + vec2(0.31, 0.73)) - 0.5) *
              0.0013 *
              mask;
            ridgeAmount = saturate((height - base) * 5.0);
            return max(0.0, (height + micro) * mask);
          }

          void main() {
            float variation;
            float ridge;
            float edge;
            float height =
              evaluateSurface(aUv, variation, ridge, edge);

            vec3 world = vec3(aUv.x * uSurfaceAspect, aUv.y, height);
            float perspective = 1.0 + height * ${HEIGHT_PERSPECTIVE.toFixed(3)};
            vec2 projected =
              vec2(0.5) +
              (aUv - vec2(0.5)) *
              perspective *
              ${PROJECTION_SCALE.toFixed(3)};
            projected +=
              height *
              vec2(
                ${HEIGHT_OFFSET_X.toFixed(3)} / uSurfaceAspect,
                ${HEIGHT_OFFSET_Y.toFixed(3)}
              );

            vWorld = world;
            vHeight = height;
            vVariation = variation;
            vEdge = edge;
            vRidge = ridge;

            gl_Position = vec4(
              projected.x * 2.0 - 1.0,
              1.0 - projected.y * 2.0,
              0.58 - height * 0.84,
              1.0
            );
          }
        `;

        const surfaceFragment = `#version 300 es
          precision highp float;

          in vec3 vWorld;
          in float vHeight;
          in float vVariation;
          in float vEdge;
          in float vRidge;

          layout(location = 0) out vec4 outColor;
          layout(location = 1) out vec4 outGeometry;

          const float PI = 3.14159265359;

          float saturate(float x) {
            return clamp(x, 0.0, 1.0);
          }

          float distributionGGX(vec3 n, vec3 h, float roughness) {
            float a = roughness * roughness;
            float a2 = a * a;
            float ndh = max(dot(n, h), 0.0);
            float d = ndh * ndh * (a2 - 1.0) + 1.0;
            return a2 / max(PI * d * d, 0.0001);
          }

          float geometrySchlick(float ndv, float roughness) {
            float r = roughness + 1.0;
            float k = (r * r) / 8.0;
            return ndv / max(ndv * (1.0 - k) + k, 0.0001);
          }

          vec3 fresnelSchlick(float cosTheta, vec3 f0) {
            return f0 + (1.0 - f0) * pow(1.0 - cosTheta, 5.0);
          }

          vec3 pbrLight(
            vec3 n,
            vec3 v,
            vec3 lightDirection,
            vec3 radiance,
            vec3 albedo,
            float roughness
          ) {
            vec3 l = normalize(lightDirection);
            vec3 h = normalize(v + l);
            float ndl = max(dot(n, l), 0.0);
            float ndv = max(dot(n, v), 0.001);
            float ndh = max(dot(n, h), 0.0);
            float vdh = max(dot(v, h), 0.0);
            vec3 f0 = mix(vec3(0.035), albedo, 0.045);
            vec3 f = fresnelSchlick(vdh, f0);
            float d = distributionGGX(n, h, roughness);
            float g = geometrySchlick(ndv, roughness) * geometrySchlick(ndl, roughness);
            vec3 specular = d * g * f / max(4.0 * ndv * ndl, 0.001);
            vec3 diffuse = (vec3(1.0) - f) * albedo / PI;
            return (diffuse + specular) * radiance * ndl;
          }

          void main() {
            if (vEdge < 0.015) {
              discard;
            }

            vec3 derivativeX = dFdx(vWorld);
            vec3 derivativeY = dFdy(vWorld);
            vec3 n = normalize(cross(derivativeX, derivativeY));
            if (n.z < 0.0) {
              n = -n;
            }
            vec3 v = normalize(vec3(-0.09, -0.11, 1.0));
            float normalizedColorShift =
              clamp(vVariation / 0.72, -1.0, 1.0);
            normalizedColorShift =
              sign(normalizedColorShift) *
              sqrt(abs(normalizedColorShift));
            float colorShift = normalizedColorShift * 0.72;
            vec3 roseA = vec3(0.776471, 0.282353, 0.470588);
            vec3 roseB = vec3(0.984314, 0.533333, 0.705882);
            vec3 albedo = mix(roseA, roseB, 0.50 + colorShift * 0.46);
            albedo *= 0.985 + 0.035 * sin(vWorld.x * 31.0 + vWorld.y * 19.0);

            float roughness = mix(0.235, 0.165, vRidge);
            vec3 color = albedo * vec3(0.61, 0.52, 0.57);
            color += pbrLight(
              n,
              v,
              normalize(vec3(-0.54, -0.66, 0.79)),
              vec3(1.46, 1.34, 1.38),
              albedo,
              roughness
            );
            color += pbrLight(
              n,
              v,
              normalize(vec3(0.69, 0.24, 0.52)),
              vec3(0.78, 0.64, 0.72),
              albedo,
              roughness + 0.08
            );

            float ndv = max(dot(n, v), 0.0);
            float fresnel = pow(1.0 - ndv, 3.2);
            float back = pow(max(dot(-n, normalize(vec3(0.49, 0.62, -0.58))), 0.0), 1.4);
            float thickness = saturate(1.0 - vHeight * 2.1) * 0.44 + (1.0 - vRidge) * 0.17;
            vec3 transmission = vec3(1.0, 0.22, 0.42) * back * (0.12 + thickness * 0.42);
            color += transmission;
            color += vec3(1.0, 0.75, 0.84) * fresnel * 0.36;

            float tipGlow = smoothstep(0.13, 0.32, vHeight) * max(n.z, 0.0);
            color += vec3(1.0, 0.54, 0.68) * tipGlow * 0.075;
            vec3 studioHalf = normalize(v + normalize(vec3(-0.52, -0.65, 0.86)));
            float broadSheen = pow(max(dot(n, studioHalf), 0.0), 9.0);
            float wetGlint = pow(max(dot(n, studioHalf), 0.0), 52.0);
            color +=
              vec3(1.0, 0.66, 0.78) * broadSheen * 0.17 +
              vec3(1.0, 0.95, 0.98) * wetGlint * 0.38;
            color = min(color, vec3(1.45));

            outColor = vec4(color, 1.0);
            outGeometry = vec4(n * 0.5 + 0.5, vHeight);
          }
        `;

        const postVertex = `#version 300 es
          precision highp float;

          out vec2 vUv;

          void main() {
            vec2 p = vec2(
              float((gl_VertexID << 1) & 2),
              float(gl_VertexID & 2)
            );
            vUv = p;
            gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
          }
        `;

        const scatterFragment = `#version 300 es
          precision highp float;

          uniform sampler2D uSource;
          uniform sampler2D uGeometry;
          uniform vec2 uDirection;
          uniform vec2 uTexel;
          uniform float uPass;

          in vec2 vUv;
          out vec4 outColor;

          void main() {
            vec4 centerGeometry = texture(uGeometry, vUv);
            float centerHeight = centerGeometry.a;
            vec3 center = texture(uSource, vUv).rgb;
            if (centerHeight < 0.002) {
              outColor = vec4(center, 1.0);
              return;
            }
            vec3 accumulated = center * 0.225;
            float total = 0.225;

            const float weights[6] = float[6](
              0.1946, 0.1650, 0.1210, 0.0760, 0.0410, 0.0180
            );

            for (int i = 1; i <= 6; i++) {
              float fi = float(i);
              vec2 offset = uDirection * uTexel * fi * mix(1.55, 2.15, uPass);

              for (int side = -1; side <= 1; side += 2) {
                vec2 sampleUv = vUv + offset * float(side);
                vec4 sampleGeometry = texture(uGeometry, sampleUv);
                float sampleHeight = sampleGeometry.a;
                float bilateral = exp(-abs(sampleHeight - centerHeight) * 18.0);
                bilateral *= step(0.0015, sampleHeight);
                float weight = weights[i - 1] * bilateral;
                vec3 sampleColor = texture(uSource, sampleUv).rgb;
                accumulated += sampleColor * weight;
                total += weight;
              }
            }

            vec3 blurred = accumulated / max(total, 0.001);
            outColor = vec4(blurred, 1.0);
          }
        `;

        const compositeFragment = `#version 300 es
          precision highp float;

          uniform sampler2D uSharp;
          uniform sampler2D uScatter;
          uniform sampler2D uGeometry;
          uniform vec2 uTexel;
          uniform vec2 uPointer;
          uniform float uPointerInside;
          uniform float uTime;
          uniform float uSurfaceAspect;
          uniform vec2 uViewport;
          uniform float uCornerRadius;
          uniform float uUseTransparentSubstrate;

          in vec2 vUv;
          out vec4 outColor;

          const float SSS_TRANSPARENCY = 0.05;
          const vec3 SSS_LIGHT_POSITION = vec3(-0.12, 1.12, 0.42);
          uniform vec3 uSubstrate;
          const vec3 TENTACLE_ROSE =
            vec3(0.941176, 0.376471, 0.588235);
          const vec3 MUTA_PINK_DEEP =
            vec3(0.674510, 0.215686, 0.396078);
          const vec3 MUTA_PINK_SHADOW =
            vec3(0.776471, 0.282353, 0.470588);
          const vec3 MUTA_PINK_MID =
            vec3(0.882353, 0.313725, 0.525490);
          const vec3 MUTA_PINK_BODY =
            vec3(0.968627, 0.447059, 0.643137);
          const vec3 MUTA_PINK_LIGHT =
            vec3(0.984314, 0.533333, 0.705882);
          const vec3 MUTA_PINK_HIGHLIGHT =
            vec3(0.992157, 0.803922, 0.874510);

          float saturate(float x) {
            return clamp(x, 0.0, 1.0);
          }

          vec3 mutaPinkPalette(float tone) {
            float t = saturate(tone);
            if (t < 0.20) {
              return mix(
                MUTA_PINK_DEEP,
                MUTA_PINK_SHADOW,
                t / 0.20
              );
            }
            if (t < 0.43) {
              return mix(
                MUTA_PINK_SHADOW,
                MUTA_PINK_MID,
                (t - 0.20) / 0.23
              );
            }
            if (t < 0.68) {
              return mix(
                MUTA_PINK_MID,
                MUTA_PINK_BODY,
                (t - 0.43) / 0.25
              );
            }
            if (t < 0.86) {
              return mix(
                MUTA_PINK_BODY,
                MUTA_PINK_LIGHT,
                (t - 0.68) / 0.18
              );
            }
            return mix(
              MUTA_PINK_LIGHT,
              MUTA_PINK_HIGHLIGHT,
              (t - 0.86) / 0.14
            );
          }

          void main() {
            vec2 halfViewport = uViewport * 0.5;
            vec2 cornerPosition =
              abs(vUv * uViewport - halfViewport) -
              (halfViewport - vec2(uCornerRadius));
            float cornerDistance =
              length(max(cornerPosition, 0.0)) +
              min(max(cornerPosition.x, cornerPosition.y), 0.0) -
              uCornerRadius;
            if (cornerDistance > 0.0) {
              outColor = vec4(0.0);
              return;
            }

            vec4 geometry = texture(uGeometry, vUv);
            float height = geometry.a;

            if (height < 0.0015) {
              if (uUseTransparentSubstrate > 0.5) {
                outColor = vec4(0.0);
                return;
              }

              float groundShadow = 0.0;
              groundShadow +=
                step(
                  0.002,
                  texture(uGeometry, vUv - vec2(5.0, 7.0) * uTexel).a
                ) *
                0.32;
              groundShadow +=
                step(
                  0.002,
                  texture(uGeometry, vUv - vec2(10.0, 13.0) * uTexel).a
                ) *
                0.18;
              groundShadow +=
                step(
                  0.002,
                  texture(uGeometry, vUv - vec2(16.0, 20.0) * uTexel).a
                ) *
                0.08;
              float pointerAura =
                uPointerInside *
                exp(
                  -length(
                    vec2(
                      (vUv.x - uPointer.x) * uSurfaceAspect,
                      vUv.y - uPointer.y
                    )
                  ) *
                  54.0
                ) *
                (0.010 + 0.003 * sin(uTime * 4.0));
              vec3 shadowColor = mix(
                uSubstrate,
                vec3(0.025, 0.010, 0.018),
                0.76
              );
              vec3 paper = mix(
                uSubstrate,
                shadowColor,
                saturate(groundShadow * 0.78)
              );
              paper = mix(
                paper,
                TENTACLE_ROSE,
                pointerAura * 0.34
              );
              outColor = vec4(paper, 1.0);
              return;
            }

            vec3 normalAccumulator = geometry.rgb * 2.0 - 1.0;
            vec3 sharpAccumulator = texture(uSharp, vUv).rgb * 2.0;
            float smoothingWeight = 2.0;
            const vec2 smoothingOffsets[4] = vec2[4](
              vec2(1.0, 0.0),
              vec2(-1.0, 0.0),
              vec2(0.0, 1.0),
              vec2(0.0, -1.0)
            );

            for (int i = 0; i < 4; i++) {
              vec2 sampleUv = vUv + smoothingOffsets[i] * uTexel * 1.65;
              vec4 nearbyGeometry = texture(uGeometry, sampleUv);
              float nearbyWeight =
                exp(-abs(nearbyGeometry.a - height) * 72.0) *
                step(0.0015, nearbyGeometry.a);
              normalAccumulator +=
                (nearbyGeometry.rgb * 2.0 - 1.0) * nearbyWeight;
              sharpAccumulator +=
                texture(uSharp, sampleUv).rgb * nearbyWeight;
              smoothingWeight += nearbyWeight;
            }

            vec3 normal = normalize(normalAccumulator);
            vec3 sharp = sharpAccumulator / max(smoothingWeight, 0.001);
            vec3 scatter = texture(uScatter, vUv).rgb;
            vec3 sssLightVector =
              SSS_LIGHT_POSITION - vec3(vUv, height);
            float sssLightDistanceSquared =
              dot(sssLightVector, sssLightVector);
            vec3 sssLightDirection = normalize(sssLightVector);
            float sssIncidence = saturate(
              0.42 + 0.58 * dot(normal, sssLightDirection)
            );
            float sssLightFalloff =
              1.0 / (1.0 + sssLightDistanceSquared * 0.82);
            float sssLightEnergy = saturate(
              sssIncidence * sssLightFalloff * 1.55
            );

            float occlusion = 0.0;
            float neighboringSurface = 0.0;
            const vec2 directions[10] = vec2[10](
              vec2(1.0, 0.0),
              vec2(-1.0, 0.0),
              vec2(0.0, 1.0),
              vec2(0.0, -1.0),
              vec2(0.707, 0.707),
              vec2(-0.707, 0.707),
              vec2(0.707, -0.707),
              vec2(-0.707, -0.707),
              vec2(0.383, 0.924),
              vec2(-0.924, 0.383)
            );

            for (int i = 0; i < 10; i++) {
              vec2 sampleUv = vUv + directions[i] * uTexel * 8.0;
              float neighborHeight = texture(uGeometry, sampleUv).a;
              occlusion += max(0.0, neighborHeight - height - 0.007);
              neighboringSurface = max(
                neighboringSurface,
                smoothstep(0.066, 0.115, neighborHeight)
              );
            }

            occlusion = saturate(occlusion * 3.20);
            float valley = saturate((1.0 - normal.z) * 0.46 + occlusion);
            float scatterMix =
              0.24 + valley * 0.11 + sssLightEnergy * 0.10;
            vec3 color = mix(sharp, scatter, scatterMix);
            color *= 1.0 - occlusion * 0.18;

            float depthTint = saturate((0.095 - height) * 6.5);
            color = mix(color, color * vec3(0.98, 0.78, 0.87), depthTint * 0.18);

            float pointerSheen =
              uPointerInside *
              exp(
                -length(
                  vec2(
                    (vUv.x - uPointer.x) * uSurfaceAspect,
                    vUv.y - uPointer.y
                  )
                ) *
                18.0
              ) *
              0.035;
            color += vec3(1.0, 0.72, 0.82) * pointerSheen;

            color = vec3(1.0) - exp(-color * 2.05);
            color = pow(color, vec3(0.82));
            color = mix(color, TENTACLE_ROSE, 0.15);
            float tipColorGradient =
              smoothstep(0.048, 0.190, height);
            color = mix(
              uSubstrate,
              color,
              tipColorGradient
            );
            float heightLift = smoothstep(0.055, 0.205, height);
            color *= 0.88 + heightLift * 0.15;
            vec3 highlightDirection = normalize(vec3(-0.48, -0.62, 0.82));
            float softGloss = pow(max(dot(normal, highlightDirection), 0.0), 11.0);
            float sharpGloss = pow(max(dot(normal, highlightDirection), 0.0), 48.0);
            color +=
              vec3(1.0, 0.62, 0.76) * softGloss * 0.105 +
              vec3(1.0, 0.96, 0.99) * sharpGloss * 0.19;
            color = mix(color, vec3(1.0), 0.025);

            float vignette = smoothstep(0.73, 0.15, length(vUv - 0.5));
            color *= mix(0.985, 1.018, vignette);
            float tentacleMask = smoothstep(0.045, 0.120, height);
            float opticalThickness = saturate(height / 0.240);
            vec3 transmittedPaper = mix(
              uSubstrate,
              mix(
                uSubstrate,
                TENTACLE_ROSE,
                tipColorGradient
              ),
              opticalThickness
            );
            transmittedPaper *= mix(0.58, 1.28, sssLightEnergy);
            color = mix(
              color,
              transmittedPaper,
              SSS_TRANSPARENCY * tentacleMask
            );
            float paletteTone = saturate(
              dot(color, vec3(0.2126, 0.7152, 0.0722)) * 0.72 +
              tipColorGradient * 0.22 -
              occlusion * 0.18 +
              sharpGloss * 0.12
            );
            vec3 referencePink = mutaPinkPalette(paletteTone);
            float paletteStrength =
              smoothstep(0.052, 0.145, height) * 0.90;
            color = mix(color, referencePink, paletteStrength);
            color +=
              MUTA_PINK_HIGHLIGHT *
              sharpGloss *
              paletteStrength *
              0.08;
            float surfaceAlpha = max(
              smoothstep(0.066, 0.105, height),
              neighboringSurface * 0.16
            );
            surfaceAlpha = saturate(surfaceAlpha);
            outColor =
              uUseTransparentSubstrate > 0.5
                ? vec4(color * surfaceAlpha, surfaceAlpha)
                : vec4(color, 1.0);
          }
        `;

        function compileShader(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            const message = gl.getShaderInfoLog(shader);
            gl.deleteShader(shader);
            throw new Error(message || "Не удалось скомпилировать шейдер.");
          }
          return shader;
        }

        function createProgram(vertexSource, fragmentSource) {
          const program = gl.createProgram();
          gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vertexSource));
          gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fragmentSource));
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            const message = gl.getProgramInfoLog(program);
            gl.deleteProgram(program);
            throw new Error(message || "Не удалось собрать программу.");
          }
          return program;
        }

        const surfaceProgram = createProgram(surfaceVertex, surfaceFragment);
        const scatterProgram = createProgram(postVertex, scatterFragment);
        const compositeProgram = createProgram(postVertex, compositeFragment);

        function uniform(program, name) {

        }

        const surfaceUniforms = {
          noise: uniform(surfaceProgram, "uNoise"),
          skeletons: uniform(surfaceProgram, "uSkeletons"),
          skeletonBounds: uniform(surfaceProgram, "uSkeletonBounds"),
          spatialIndices: uniform(surfaceProgram, "uSpatialIndices"),
          spatialSegmentMasks: uniform(
            surfaceProgram,
            "uSpatialSegmentMasks",
          ),
          spatialCounts: uniform(surfaceProgram, "uSpatialCounts"),
          skeletonCount: uniform(surfaceProgram, "uSkeletonCount"),
          useSpatialGrid: uniform(surfaceProgram, "uUseSpatialGrid"),
          time: uniform(surfaceProgram, "uTime"),
          surfaceAspect: uniform(surfaceProgram, "uSurfaceAspect"),
        };

        const scatterUniforms = {
          source: uniform(scatterProgram, "uSource"),
          geometry: uniform(scatterProgram, "uGeometry"),
          direction: uniform(scatterProgram, "uDirection"),
          texel: uniform(scatterProgram, "uTexel"),
          pass: uniform(scatterProgram, "uPass"),
        };

        const compositeUniforms = {
          sharp: uniform(compositeProgram, "uSharp"),
          scatter: uniform(compositeProgram, "uScatter"),
          geometry: uniform(compositeProgram, "uGeometry"),
          texel: uniform(compositeProgram, "uTexel"),
          pointer: uniform(compositeProgram, "uPointer"),
          pointerInside: uniform(compositeProgram, "uPointerInside"),
          time: uniform(compositeProgram, "uTime"),
          surfaceAspect: uniform(compositeProgram, "uSurfaceAspect"),
          substrate: uniform(compositeProgram, "uSubstrate"),
          viewport: uniform(compositeProgram, "uViewport"),
          cornerRadius: uniform(compositeProgram, "uCornerRadius"),
          useTransparentSubstrate: uniform(
            compositeProgram,
            "uUseTransparentSubstrate",
          ),
        };

        gl.useProgram(surfaceProgram);
        gl.uniform1i(surfaceUniforms.noise, 0);
        gl.uniform1i(surfaceUniforms.skeletons, 1);
        gl.uniform1i(surfaceUniforms.skeletonBounds, 2);
        gl.uniform1i(surfaceUniforms.spatialIndices, 3);
        gl.uniform1i(surfaceUniforms.spatialCounts, 4);
        gl.uniform1i(surfaceUniforms.spatialSegmentMasks, 5);
        gl.uniform1i(surfaceUniforms.skeletonCount, skeletonCount);
        gl.uniform1f(surfaceUniforms.surfaceAspect, surfaceAspect);
        gl.useProgram(scatterProgram);
        gl.uniform1i(scatterUniforms.source, 0);
        gl.uniform1i(scatterUniforms.geometry, 1);
        gl.useProgram(compositeProgram);
        gl.uniform1i(compositeUniforms.sharp, 0);
        gl.uniform1i(compositeUniforms.scatter, 1);
        gl.uniform1i(compositeUniforms.geometry, 2);
        gl.uniform1f(compositeUniforms.surfaceAspect, surfaceAspect);
        gl.useProgram(null);
        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.BLEND);
        gl.clearColor(0, 0, 0, 0);

        const themeColors = {
          light: [1, 250 / 255, 251 / 255],
          dark: [9 / 255, 6 / 255, 8 / 255],
        };
        let activeTheme = "light";
        let substrateColor = themeColors.light;

        function applyTheme(theme) {
          activeTheme = theme === "dark" ? "dark" : "light";
          substrateColor = themeColors[activeTheme];
          document.documentElement.dataset.theme = activeTheme;
        }

        function readParentTheme() {
          try {
            return window.parent.document.documentElement.dataset.theme;
          } catch {
            return new URLSearchParams(location.search).get("theme");
          }
        }

        applyTheme(readParentTheme());
        addEventListener("message", (event) => {
          if (
            event.data?.type === "muta-tentacles-theme" &&
            (event.data.theme === "light" || event.data.theme === "dark")
          ) {
            applyTheme(event.data.theme);
          }
        });
        if (window.parent !== window) {
          window.parent.postMessage({ type: "muta-tentacles-ready" }, "*");
        }

        function mulberry32(seed) {
          let value = seed >>> 0;
          return () => {
            value += 0x6d2b79f5;
            let result = value;
            result = Math.imul(result ^ (result >>> 15), result | 1);
            result ^= result + Math.imul(result ^ (result >>> 7), result | 61);
            return ((result ^ (result >>> 14)) >>> 0) / 4294967296;
          };
        }

        function deriveSeed(seed, salt) {
          let value = (seed ^ salt) >>> 0;
          value = Math.imul(value ^ (value >>> 16), 0x45d9f3b);
          value = Math.imul(value ^ (value >>> 16), 0x45d9f3b);
          return (value ^ (value >>> 16)) >>> 0;
        }

        const sessionSeed = (() => {
          const seedBuffer = new Uint32Array(1);
          if (globalThis.crypto?.getRandomValues) {
            globalThis.crypto.getRandomValues(seedBuffer);
            return seedBuffer[0];
          }
          return (
            Date.now() ^
            Math.floor(performance.timeOrigin) ^
            Math.floor(performance.now() * 1000)
          ) >>> 0;
        })();
        const random = mulberry32(sessionSeed);
        const textureNoiseSeed = deriveSeed(sessionSeed, 713);
        const broadPeakSeed = deriveSeed(sessionSeed, 409);
        const mediumPeakSeed = deriveSeed(sessionSeed, 911);
        const detailPeakSeed = deriveSeed(sessionSeed, 1301);
        canvas.dataset.generationSeed = String(sessionSeed);
        const noiseSize = 112;
        const noisePixels = new Uint8Array(noiseSize * noiseSize * 4);

        function fade(value) {
          return value * value * value * (value * (value * 6 - 15) + 10);
        }

        function hash2(x, y, seed) {
          let value =
            Math.imul(x + seed * 37, 374761393) +
            Math.imul(y + seed * 17, 668265263);
          value = (value ^ (value >>> 13)) >>> 0;
          value = Math.imul(value, 1274126177) >>> 0;
          return ((value ^ (value >>> 16)) >>> 0) / 4294967295;
        }

        function valueNoise(x, y, seed) {
          const x0 = Math.floor(x);
          const y0 = Math.floor(y);
          const tx = fade(x - x0);
          const ty = fade(y - y0);
          const x1 = x0 + 1;
          const y1 = y0 + 1;
          const a = hash2(x0, y0, seed);
          const b = hash2(x1, y0, seed);
          const c = hash2(x0, y1, seed);
          const d = hash2(x1, y1, seed);
          return (
            (a + (b - a) * tx) * (1 - ty) +
            (c + (d - c) * tx) * ty
          );
        }

        function fbm(x, y, seed) {
          let sum = 0;
          let weight = 0.56;
          let frequency = 1;
          let normalizer = 0;
          for (let octave = 0; octave < 5; octave++) {
            sum += valueNoise(x * frequency, y * frequency, seed + octave * 31) * weight;
            normalizer += weight;
            frequency *= 1.93;
            weight *= 0.49;
          }
          return sum / normalizer;
        }

        for (let y = 0; y < noiseSize; y++) {
          for (let x = 0; x < noiseSize; x++) {
            const u = x / noiseSize;
            const v = y / noiseSize;
            const index = (y * noiseSize + x) * 4;
            for (let channel = 0; channel < 4; channel++) {
              const n = fbm(
                u * (5.4 + channel * 0.37) + channel * 3.7,
                v * (5.4 + channel * 0.29) - channel * 2.3,
                (textureNoiseSeed + channel * 101) >>> 0,
              );
              noisePixels[index + channel] = Math.round(n * 255);
            }

        const noiseTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, noiseTexture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
        gl.texImage2D(
          gl.TEXTURE_2D,
          0,
          gl.RGBA8,
          noiseSize,
          noiseSize,
          0,
          gl.RGBA,
          gl.UNSIGNED_BYTE,
          noisePixels,
        );

        function peakField(x, y) {
          const broad = fbm(
            x * 5.8 + 2.7,
            y * 5.8 - 1.3,
            broadPeakSeed,
          );
          const medium = fbm(
            x * 12.8 - 4.1,
            y * 12.8 + 3.2,
            mediumPeakSeed,
          );
          const detail = fbm(
            x * 22.5 + 7.3,
            y * 22.5 - 5.6,
            detailPeakSeed,
          );
          const center =
            1 -
            Math.min(
              1,
              Math.hypot(
                x / surfaceAspect - 0.5,
                y - 0.5,
              ) * 1.12,
            );
          return broad * 0.48 + medium * 0.31 + detail * 0.17 + center * 0.04;
        }

        function findNoiseMaxima(count) {
          const candidates = [];
          const scanY = 116;
          const scanX = Math.max(
            70,
            Math.round(scanY * surfaceAspect),
          );
          for (let y = 4; y < scanY - 4; y++) {
            for (let x = 4; x < scanX - 4; x++) {
              const u = (x / (scanX - 1)) * surfaceAspect;
              const v = y / (scanY - 1);
              if (
                u < 0.038 ||
                u > surfaceAspect - 0.038 ||
                v < 0.038 ||
                v > 0.962
              ) {
                continue;
              }
              const value = peakField(u, v);
              let isLocalPeak = true;
              for (let oy = -1; oy <= 1 && isLocalPeak; oy++) {
                for (let ox = -1; ox <= 1; ox++) {
                  if (
                    (ox || oy) &&
                    peakField(
                      u + (ox / scanX) * surfaceAspect,
                      v + oy / scanY,
                    ) > value
                  ) {
                    isLocalPeak = false;
                    break;
                  }
                }
              }
              candidates.push({ x: u, y: v, value, local: isLocalPeak });
            }
          }

          candidates.sort((a, b) => {
            if (a.local !== b.local) {
              return Number(b.local) - Number(a.local);
            }
            return b.value - a.value;
          });

          const peaks = [];
          let minimumDistance = 0.054;
          while (peaks.length < count && minimumDistance > 0.026) {
            for (const candidate of candidates) {
              if (peaks.length >= count) {
                break;
              }
              const jitterX = (random() - 0.5) * 0.005;
              const jitterY = (random() - 0.5) * 0.005;
              const point = {
                x: candidate.x + jitterX,
                y: candidate.y + jitterY,
                value: candidate.value,
              };
              if (
                peaks.every(
                  (peak) =>
                    Math.hypot(point.x - peak.x, point.y - peak.y) >= minimumDistance,
                )
              ) {
                peaks.push(point);
              }
            }
            minimumDistance -= 0.004;
          }

          while (peaks.length < count) {
            let bestPoint = null;
            let bestScore = -Infinity;
            for (let attempt = 0; attempt < 48; attempt++) {
              const x =
                0.038 +
                random() *
                  Math.max(
                    0.001,
                    surfaceAspect - 0.076,
                  );
              const y = 0.038 + random() * 0.924;
              const nearest = peaks.reduce(
                (distance, peak) => Math.min(distance, Math.hypot(x - peak.x, y - peak.y)),
                1,
              );
              const score = peakField(x, y) * 0.28 + nearest * 3.25;
              if (score > bestScore) {
                bestScore = score;
                bestPoint = { x, y, value: peakField(x, y) };
              }
            }
            peaks.push(bestPoint);
          }
          return peaks.slice(0, count);
        }

        function clamp(value, minimum, maximum) {
          return Math.min(maximum, Math.max(minimum, value));
        }

        function length2(x, y) {
          return Math.sqrt(x * x + y * y);
        }

        function length3(x, y, z) {
          return Math.sqrt(x * x + y * y + z * z);
        }

        function cursorTipSpeed(attraction) {
          return Math.max(0, attraction) * CURSOR_ATTRACTION_MULTIPLIER;
        }

        function projectPointToCanvas(point) {
          const scale =
            (1 + point.z * HEIGHT_PERSPECTIVE) * PROJECTION_SCALE;
          return {
            x:
              0.5 +
              (point.x / surfaceAspect - 0.5) * scale +
              point.z * HEIGHT_OFFSET_X / surfaceAspect,
            y:
              0.5 +
              (point.y - 0.5) * scale +
              point.z * HEIGHT_OFFSET_Y,
          };
        }

        function unprojectPointerAtHeight(height) {
          const scale =
            (1 + height * HEIGHT_PERSPECTIVE) * PROJECTION_SCALE;
          return {
            x:
              surfaceAspect *
              (
                0.5 +
                (
                  pointer.x -
                  0.5 -
                  height * HEIGHT_OFFSET_X / surfaceAspect
                ) /
                  scale
              ),
            y:
              0.5 +
              (pointer.y - 0.5 - height * HEIGHT_OFFSET_Y) / scale,
          };
        }

        const maxima = findNoiseMaxima(skeletonCount);
        const skeletons = maxima.map((peak, index) => {
          const edgeAngle = Math.atan2(
            peak.y - 0.5,
            peak.x - surfaceAspect * 0.5,
          );
          const tangent = edgeAngle + (random() < 0.5 ? -1 : 1) * (0.72 + random() * 0.55);
          const baseAngle = tangent + (random() - 0.5) * 1.25;
          const radius =
            (0.0115 + random() * 0.0070) *
            TENTACLE_THICKNESS_MULTIPLIER;
          const totalLength = 0.170 + random() * 0.080;
          const linkLength = totalLength / CHAIN_LINKS;
          const bend = (random() < 0.5 ? -1 : 1) * (0.58 + random() * 1.10);
          const horizontalScale = 0.26 + random() * 0.20;
          const baseHeight = 0.043 + (peak.value - 0.45) * 0.018;
          const phase = random() * Math.PI * 2;
          const phase2 = random() * Math.PI * 2;
          const points = [{ x: peak.x, y: peak.y, z: baseHeight }];
          const horizontalSteps = new Float64Array(
            CHAIN_LINKS + 1,
          );
          const verticalSteps = new Float64Array(
            CHAIN_LINKS + 1,
          );
          const linkLengthSquared = linkLength * linkLength;

          for (let joint = 1; joint <= CHAIN_LINKS; joint++) {
            const profile = jointProfiles[joint];
            const angle =
              baseAngle +
              bend * profile.bendFactor +
              Math.sin(phase + profile.initialPhase) *
                0.12 *
                profile.s;
            const horizontalStep =
              linkLength *
              horizontalScale *
              profile.horizontalTaper;
            const verticalStep = Math.sqrt(
              Math.max(
                0.000001,
                linkLengthSquared -
                  horizontalStep * horizontalStep,
              ),
            );
            horizontalSteps[joint] = horizontalStep;
            verticalSteps[joint] = verticalStep;
            const previous = points[joint - 1];
            points.push({
              x: previous.x + Math.cos(angle) * horizontalStep,
              y: previous.y + Math.sin(angle) * horizontalStep,
              z: previous.z + verticalStep,
            });
          }

            index,
            root: { x: peak.x, y: peak.y },
            baseAngle,
            bend,
            totalLength,
            totalLengthSquared: totalLength * totalLength,
            linkLength,
            horizontalSteps,
            verticalSteps,

            baseHeight,

            phase2,

        const spatialCountPixels = new Uint16Array(

        const skeletonTexture = gl.createTexture();

        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

          gl.TEXTURE_2D,
          0,
          gl.RGBA32F,

          0,
          gl.RGBA,

        function makeIntegerLookupTexture(width, height, pixels) {

            gl.TEXTURE_2D,
            gl.TEXTURE_MIN_FILTER,
            gl.NEAREST,

          gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_MAG_FILTER,
            gl.NEAREST,
          );
          gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_WRAP_S,
            gl.CLAMP_TO_EDGE,
          );
          gl.texParameteri(
            gl.TEXTURE_2D,
            gl.TEXTURE_WRAP_T,
            gl.CLAMP_TO_EDGE,

            gl.TEXTURE_2D,
            0,
            gl.R16UI,
            width,
            height,
            0,
            gl.RED_INTEGER,
            gl.UNSIGNED_SHORT,
            pixels,

        const spatialIndexTexture = makeIntegerLookupTexture(
          MAX_SPATIAL_SKELETONS,
          SPATIAL_CELL_COUNT,

        const spatialSegmentMaskTexture = makeIntegerLookupTexture(
          MAX_SPATIAL_SKELETONS,
          SPATIAL_CELL_COUNT,

        function buildGrid(resolution) {

          const indices = new Uint32Array(triangleCount * 3);
          let indexOffset = 0;
          for (let y = 0; y < resolution - 1; y++) {

              const b = a + 1;
              const c = a + resolution;
              const d = c + 1;
              indices[indexOffset++] = a;
              indices[indexOffset++] = c;
              indices[indexOffset++] = b;
              indices[indexOffset++] = b;
              indices[indexOffset++] = c;
              indices[indexOffset++] = d;

        function makeColorTexture(width, height, internalFormat, format, type) {
          const texture = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, texture);

          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

            gl.TEXTURE_2D,
            0,
            internalFormat,
            width,
            height,
            0,
            format,
            type,
            null,

        function deleteTargets(targets) {

        let pixelWidth = 1;
        let pixelHeight = 1;
        let resizeDirty = true;
        let canvasRect = canvas.getBoundingClientRect();

        function createRenderTargets(width, height) {
          deleteTargets(renderTargets);
          const colorInternal = floatColor ? gl.RGBA16F : gl.RGBA8;
          const colorType = floatColor ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
          const sharp = makeColorTexture(width, height, colorInternal, gl.RGBA, colorType);
          const geometry = makeColorTexture(width, height, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT);
          const scatterA = makeColorTexture(width, height, colorInternal, gl.RGBA, colorType);
          const scatterB = makeColorTexture(width, height, colorInternal, gl.RGBA, colorType);

          const surfaceFramebuffer = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, surfaceFramebuffer);

            gl.FRAMEBUFFER,
            gl.COLOR_ATTACHMENT0,
            gl.TEXTURE_2D,
            sharp,
            0,
          );

            gl.FRAMEBUFFER,
            gl.COLOR_ATTACHMENT1,
            gl.TEXTURE_2D,
            geometry,
            0,
          );

          const scatterFramebufferA = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, scatterFramebufferA);
          gl.framebufferTexture2D(
            gl.FRAMEBUFFER,
            gl.COLOR_ATTACHMENT0,
            gl.TEXTURE_2D,
            scatterA,
            0,
          );
          gl.drawBuffers([gl.COLOR_ATTACHMENT0]);

          const scatterFramebufferB = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, scatterFramebufferB);
          gl.framebufferTexture2D(
            gl.FRAMEBUFFER,
            gl.COLOR_ATTACHMENT0,
            gl.TEXTURE_2D,
            scatterB,
            0,
          );

            surfaceFramebuffer,
            scatterFramebufferA,
            scatterFramebufferB,

          renderTargets = {
            sharp,
            geometry,
            scatterA,
            scatterB,
            surfaceFramebuffer,
            scatterFramebufferA,
            scatterFramebufferB,
            textures: [sharp, geometry, scatterA, scatterB],
            framebuffers: [surfaceFramebuffer, scatterFramebufferA, scatterFramebufferB],

        function resize() {
          if (!resizeDirty) {
            return;

          resizeDirty = false;

          canvasRect = rect;

            2.4,
            Math.max(
              0.6,
              rect.width / Math.max(1, rect.height),

            renderTargets &&
            Math.abs(currentAspect - surfaceAspect) > 0.08 &&
            canvas.dataset.aspectReloading !== "true"

            devicePixelRatio || 1,
            isCompact ? 1.65 : 1.8,

          const maxDimension = Math.min(
            gpuRenderLimit,
            isCompact ? 1800 : 2560,
          );

          const requestedHeight = rect.height * ratio;
          const renderScale = Math.min(
            1,
            maxDimension / Math.max(requestedWidth, requestedHeight),
          );
          const nextWidth = Math.max(
            2,
            Math.round(requestedWidth * renderScale),
          );
          const nextHeight = Math.max(
            2,
            Math.round(requestedHeight * renderScale),
          );

          pixelHeight = nextHeight;

          targetY: 0.5,

          pressed: false,
          pressDirection: 0,
          impulseStartedAt: -Infinity,
          impulsePending: false,

          maximumAttraction: 0,
          minimumTipClearance: 1,
          minimumCursorDistance: 1,
          closestTipX: 0.5,
          closestTipY: 0.5,
          strongTipCount: 0,
          strongTipX: 0,
          strongTipY: 0,
          grabberCount: 0,
          maximumGrabberError: 0,

            event.clientX <= rect.right &&

        const pointerSolverOrigin = new Float64Array(
          (CHAIN_LINKS + 1) * 3,
        );

        function capturePointerSolverState(points) {
          for (let joint = 1; joint <= CHAIN_LINKS; joint++) {
            const point = points[joint];
            const offset = joint * 3;
            pointerSolverOrigin[offset] = point.x;
            pointerSolverOrigin[offset + 1] = point.y;
            pointerSolverOrigin[offset + 2] = point.z;
          }

        function blendPointerSolverBody(points, blend) {
          if (blend >= 1) {
            return;
          }
          for (let joint = 1; joint < CHAIN_LINKS; joint++) {
            const point = points[joint];
            const offset = joint * 3;
            point.x =
              pointerSolverOrigin[offset] +
              (point.x - pointerSolverOrigin[offset]) *
                blend;
            point.y =
              pointerSolverOrigin[offset + 1] +
              (point.y - pointerSolverOrigin[offset + 1]) *
                blend;
            point.z =
              pointerSolverOrigin[offset + 2] +
              (point.z - pointerSolverOrigin[offset + 2]) *
                blend;
          }
        }

        function stabilizePointerSolverVelocity(
          points,
          forceMagnitude,
          delta,
        ) {
          const tipVelocityDamping =
            1 -
            Math.exp(
              -delta * Math.min(forceMagnitude, 2) * 32,
            );

          for (let joint = 1; joint <= CHAIN_LINKS; joint++) {
            const point = points[joint];
            const offset = joint * 3;

            // The IK displacement shapes the tentacle, but it must not become
            // Verlet velocity on the next frame. Otherwise the tip overshoots
            // a stationary pointer and is pulled back every other frame.
            point.px += point.x - pointerSolverOrigin[offset];
            point.py += point.y - pointerSolverOrigin[offset + 1];
            point.pz += point.z - pointerSolverOrigin[offset + 2];

            const tipWeight = joint / CHAIN_LINKS;
            const damping =
              tipVelocityDamping * tipWeight * tipWeight;
            point.px += (point.x - point.px) * damping;
            point.py += (point.y - point.py) * damping;
            point.pz += (point.z - point.pz) * damping;
          }
        }

        function solveChainTowardPointer(skeleton, attraction, delta) {
          const forceMagnitude = Math.abs(attraction);
          if (forceMagnitude <= 0) {
            return;
          }
          const forceDirection = Math.sign(attraction);

          const points = skeleton.points;
          const root = points[0];
          const tip = points[CHAIN_LINKS];
          const rootX = skeleton.root.x;
          const rootY = skeleton.root.y;
          const rootZ = skeleton.baseHeight;
          const pointerTarget = unprojectPointerAtHeight(tip.z);
          const pointerDeltaX = pointerTarget.x - tip.x;
          const pointerDeltaY = pointerTarget.y - tip.y;
          const pointerDistance = length2(
            pointerDeltaX,
            pointerDeltaY,
          );
          const maximumTipStep =
            cursorTipSpeed(forceMagnitude) * delta;
          const movementScale =
            pointerDistance > 0
              ? Math.min(1, maximumTipStep / pointerDistance)
              : 0;
          const targetX =
            tip.x +
            pointerDeltaX * movementScale * forceDirection;
          const targetY =
            tip.y +
            pointerDeltaY * movementScale * forceDirection;
          const horizontalDistance = length2(
            targetX - rootX,
            targetY - rootY,
          );
          const maximumVerticalReach = Math.sqrt(
            Math.max(
              0,
              skeleton.totalLengthSquared -
                horizontalDistance * horizontalDistance,
            ),
          );
          const desiredHeight = Math.max(
            tip.z,
            skeleton.baseHeight + skeleton.tipClearance * 0.88,
          );
          const constrainedTargetZ = Math.min(
            desiredHeight,
            rootZ + maximumVerticalReach * 0.84,
          );
          const verticalTargetBlend = Math.min(
            1,
            maximumTipStep /
              Math.max(0.000001, skeleton.linkLength),
          );
          const targetZ =
            tip.z +
            (constrainedTargetZ - tip.z) *
              verticalTargetBlend;
          const normalizedSolverForce = clamp(
            forceMagnitude / POINTER_SOLVER_FULL_BODY_FORCE,
            0,
            1,
          );
          const solverBodyBlend = skeleton.grabbed
            ? 1
            : normalizedSolverForce *
              normalizedSolverForce *
              (3 - 2 * normalizedSolverForce);
          capturePointerSolverState(points);
          const targetDeltaX = targetX - rootX;
          const targetDeltaY = targetY - rootY;
          const targetDeltaZ = targetZ - rootZ;
          const rootToTarget = Math.max(
            0.000001,
            length3(targetDeltaX, targetDeltaY, targetDeltaZ),
          );

          if (rootToTarget >= skeleton.totalLength * 0.9995) {
            const stepScale = skeleton.linkLength / rootToTarget;
            const stepX = targetDeltaX * stepScale;
            const stepY = targetDeltaY * stepScale;
            const stepZ = targetDeltaZ * stepScale;
            root.x = rootX;
            root.y = rootY;
            root.z = rootZ;
            for (let joint = 1; joint <= CHAIN_LINKS; joint++) {
              const previous = points[joint - 1];
              const point = points[joint];
              point.x = previous.x + stepX;
              point.y = previous.y + stepY;
              point.z = previous.z + stepZ;
            }
            blendPointerSolverBody(points, solverBodyBlend);
            stabilizePointerSolverVelocity(
              points,
              forceMagnitude,
              delta,
            );
            return;
          }

          const solverIterations = skeleton.grabbed ? 20 : 7;
          for (let iteration = 0; iteration < solverIterations; iteration++) {
            tip.x = targetX;
            tip.y = targetY;
            tip.z = targetZ;

            for (let joint = CHAIN_LINKS - 1; joint >= 0; joint--) {
              const parent = points[joint];
              const child = points[joint + 1];
              const dx = parent.x - child.x;
              const dy = parent.y - child.y;
              const dz = parent.z - child.z;
              const distance = Math.max(
                0.000001,
                length3(dx, dy, dz),
              );
              const scale = skeleton.linkLength / distance;
              parent.x = child.x + dx * scale;
              parent.y = child.y + dy * scale;
              parent.z = child.z + dz * scale;
            }

            root.x = rootX;
            root.y = rootY;
            root.z = rootZ;

            for (let joint = 0; joint < CHAIN_LINKS; joint++) {
              const parent = points[joint];
              const child = points[joint + 1];
              const dx = child.x - parent.x;
              const dy = child.y - parent.y;
              const dz = child.z - parent.z;
              const distance = Math.max(
                0.000001,
                length3(dx, dy, dz),
              );
              const scale = skeleton.linkLength / distance;
              child.x = parent.x + dx * scale;
              child.y = parent.y + dy * scale;
              child.z = parent.z + dz * scale;
            }
          }
          blendPointerSolverBody(points, solverBodyBlend);
          stabilizePointerSolverVelocity(
            points,
            forceMagnitude,
            delta,
          );
        }

        function updateSkeletons(time, delta, wallTime) {
          if (debugPointerOverride) {
            pointer.targetX = clamp(debugPointerX, 0, 1);
            pointer.targetY = clamp(debugPointerY, 0, 1);
