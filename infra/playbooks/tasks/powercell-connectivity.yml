---
- name: Check relay TCP reachability from outside the VPS
  block:
    - name: Connect from the Ansible controller to the public relay address
      ansible.builtin.wait_for:
        host: "{{ powercell_relay_url | ansible.builtin.urlsplit('hostname') }}"
        port: "{{ (powercell_relay_url | ansible.builtin.urlsplit('port')) | default(443, true) | int }}"
        state: started
        connect_timeout: 3
        timeout: "{{ powercell_relay_probe_timeout | default(30) }}"
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
  rescue:
    - name: Explain an unreachable relay instead of reporting successful setup
      ansible.builtin.fail:
        msg: "Relay {{ powercell_relay_url }} is unreachable from the Ansible controller. Check DNS, the relay bind address, custom nftables/iptables rules, or provider filtering."
