<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget layout</title>
    <style>
      body { margin: 0; }
      section { box-sizing: border-box; padding: 8px; border: 1px solid; overflow-wrap: anywhere; }
      input { box-sizing: border-box; max-width: 100%; }
      .fixture-widget-hidden { display: none; }
      .fixture-widget-surface { display: grid; padding: 8px; background: lime; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/demo/widget-layout.tsx"></script>
  </body>
</html>
