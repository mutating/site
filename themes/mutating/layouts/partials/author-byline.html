{{- $author := .author -}}
{{- $status := partial "author-kind.html" $author -}}
{{- $prefix := default "" .prefix -}}
<span
  class="author-byline{{ with .class }} {{ . }}{{ end }}"
  data-author-status="{{ $status }}"
>
  <i class="author-status__light" aria-hidden="true"></i>
  {{- if .link }}
    <a class="author-byline__name post__author" href="{{ $author.RelPermalink }}" rel="author">{{ $prefix }}{{ $author.Title }}</a>
  {{- else }}
    <span class="author-byline__name">{{ $prefix }}{{ $author.Title }}</span>
  {{- end }}
</span>
