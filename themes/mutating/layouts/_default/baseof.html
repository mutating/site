<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="{{ with .Params.bodyClass }}{{ . }}{{ else }}{{ if .IsHome }}home-page{{ else if or (eq .Section "blog") (eq .Section "news") (eq .Section "author-posts") }}blog-page{{ else }}site-page{{ end }}{{ end }}">
    <main>
      {{ partial "header.html" . }}
      {{ block "main" . }}{{ end }}
      {{ partial "footer.html" . }}
    </main>
    {{- $siteScript := resources.Get "js/site.js" | minify | fingerprint -}}
    <script src="{{ $siteScript.RelPermalink }}" integrity="{{ $siteScript.Data.Integrity }}" crossorigin="anonymous" defer></script>
    {{- if hugo.IsProduction }}
      {{ partialCached "yandex-metrika.html" . }}
    {{- end }}
  </body>
</html>
