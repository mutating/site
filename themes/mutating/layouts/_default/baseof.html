<!doctype html>
<html lang="en">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="{{ with .Params.bodyClass }}{{ . }}{{ else }}site-page{{ end }}">
    <main>
      {{ partial "header.html" . }}
      {{ block "main" . }}{{ end }}
      {{ partial "footer.html" . }}
    </main>
    {{- $siteScript := resources.Get "js/site.js" | minify | fingerprint -}}
    <script src="{{ $siteScript.RelPermalink }}" integrity="{{ $siteScript.Data.Integrity }}" crossorigin="anonymous" defer></script>
    {{- if hugo.IsProduction }}
      {{ partialCached "yandex-metrika.html" . }}
    {{- end }}
  </body>
</html>
