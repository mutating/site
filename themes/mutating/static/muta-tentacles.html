<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffafb" />
    <meta
      name="description"
      content="Muta — единая живая желейная поверхность с процедурными щупальцами."
    />
    <title>Muta — живая желейная актиния</title>
    <style>
      :root {
        color-scheme: light;
        --site-background: #fffafb;
        background: transparent;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --site-background: #090608;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        border-radius: 32px;
        overflow: hidden;
        background: transparent;
      }

      body,
      main {
        width: 100%;
        height: 100%;
      }

      main {
        position: relative;
      }

      .organism {
        position: absolute;
        inset: 0;
        border-radius: 32px;
        overflow: hidden;
        background: transparent;
        isolation: isolate;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 32px;
        outline: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

    </style>
  </head>
  <body>
    <main>
      <section
        class="organism"
        aria-label="Интерактивная живая поверхность Muta"
        aria-describedby="interaction-help"
      >
        <canvas id="muta" tabindex="0"></canvas>
        <p class="sr-only" id="interaction-help">
          Перемещайте указатель внутри квадрата. Щупальца в радиусе досягаемости
          потянутся к нему, а ближайшие попробуют обхватить указатель. Нажатие
          левой кнопки создаёт короткий импульс притяжения, правой — отталкивания.
        </p>
      </section>
    </main>

    <script>
      (() => {
        "use strict";

        const canvas = document.querySelector("#muta");
        const gl = canvas.getContext("webgl2", {
          alpha: true,
          antialias: false,
          depth: false,
          desynchronized: true,
          powerPreference: "high-performance",
          preserveDrawingBuffer: false,
          premultipliedAlpha: true,
        });

        if (!gl) {
          const fallback = document.createElement("p");
          fallback.textContent = "Для рендера Muta требуется браузер с поддержкой WebGL 2.";
          fallback.style.cssText =
            "position:absolute;inset:10%;display:grid;place-items:center;text-align:center;color:#a83368;font:500 16px system-ui";
          canvas.replaceWith(fallback);
          return;
        }
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, 2);

        const runtimeSearch = new URLSearchParams(location.search);
        const requestedSkeletonLimit = Number(
          runtimeSearch.get("max-tentacles"),
        );
        const requestedRenderSupersample = Number(
          runtimeSearch.get("render-supersample"),
        );
        const requestedSpatialCapacity = Number(
          runtimeSearch.get("max-spatial-candidates"),
        );
        const requestedSpatialGridRows = Number(
          runtimeSearch.get("spatial-grid-rows"),
        );
        const requestedAnimationTimeOrigin = runtimeSearch.has(
          "animation-time-origin",
        )
          ? Number(runtimeSearch.get("animation-time-origin"))
          : Number.NaN;
        const useManualAnimationFrame =
          runtimeSearch.get("manual-animation-frame") === "1";
        const gpuTimingRequested =
          runtimeSearch.get("gpu-timing") === "1";
        const requestedGpuTimingInterval = Number(
          runtimeSearch.get("gpu-timing-interval"),
        );
        const requestedColorTargetFormat = runtimeSearch.get(
          "color-target-format",
        );
        const solverEarlyExitEnabled =
          runtimeSearch.get("solver-early-exit") !== "0";
        const pbdEarlyExitEnabled =
          solverEarlyExitEnabled &&
          runtimeSearch.get("pbd-early-exit") !== "0";
        const fabrikEarlyExitEnabled =
          solverEarlyExitEnabled &&
          runtimeSearch.get("fabrik-early-exit") !== "0";
        const fabrikVisualSkipEnabled =
          solverEarlyExitEnabled &&
          runtimeSearch.get("fabrik-visual-skip") !== "0";
        const GPU_TIMING_SAMPLE_INTERVAL =
          useManualAnimationFrame &&
          Number.isFinite(requestedGpuTimingInterval) &&
          requestedGpuTimingInterval > 0
            ? Math.min(
                120,
                Math.max(1, Math.floor(requestedGpuTimingInterval)),
              )
            : 30;
        const GPU_TIMING_QUERY_POOL_SIZE = 4;
        const CHAIN_LINKS = 50;
        const RENDER_POINTS = 14;
        const POINT_X = 0;
        const POINT_Y = 1;
        const POINT_Z = 2;
        const POINT_PREVIOUS_X = 3;
        const POINT_PREVIOUS_Y = 4;
        const POINT_PREVIOUS_Z = 5;
        const POINT_STRIDE = 6;
        const MAX_SKELETONS =
          Number.isFinite(requestedSkeletonLimit) &&
          requestedSkeletonLimit > 0
            ? Math.min(
                900,
                Math.max(64, Math.floor(requestedSkeletonLimit)),
              )
            : 900;
        const MOTION_SPEED_MULTIPLIER = (4 / 5) * 2 * 1.2;
        const SCROLL_RESPONSE_BOOST_PER_OMITTED_FRAME = 0.4;
        const MAXIMUM_SCROLL_REST_RESPONSE = 0.32;
        const TENTACLE_THICKNESS_MULTIPLIER = 1.5 * 1.3 * 1.3;
        const CURSOR_ATTRACTION_MULTIPLIER = 1 / 6 / 1.1;
        const LEFT_HELD_FORCE_MULTIPLIER = 2;
        const RIGHT_HELD_FORCE_MULTIPLIER = 2;
        const PRESS_IMPULSE_MULTIPLIER = 20 / 1.5;
        const PRESS_IMPULSE_RADIUS_MULTIPLIER = 1.5;
        const PRESS_IMPULSE_HOLD_SECONDS = 0.10 / 6.75;
        const PRESS_IMPULSE_DECAY_RATE = 26 * 6.75;
        const PRESS_IMPULSE_TOTAL_SECONDS = 0.28 / 6.75;
        const HELD_ATTRACTION_CAP_SECONDS = PRESS_IMPULSE_TOTAL_SECONDS;
        const HELD_ATTRACTION_BLEND_SECONDS = 0.1;
        const RELEASE_ATTRACTION_CAP_SECONDS = 0.5;
        const RELEASE_ATTRACTION_BLEND_SECONDS = 0.25;
        const RELEASE_ATTRACTION_CANCEL_DISTANCE_PIXELS = 1;
        canvas.dataset.pressImpulseTotalMs =
          (PRESS_IMPULSE_TOTAL_SECONDS * 1000).toFixed(1);
        const POINTER_SOLVER_FULL_BODY_FORCE = 0.35;
        const MAX_CURSOR_GRABBERS = 6;
        const SOLVER_ERROR_TOLERANCE_PIXELS = 0.003;
        const MIN_PBD_ITERATIONS = 4;
        const MIN_FABRIK_ITERATIONS = 2;
        canvas.dataset.solverEarlyExit =
          solverEarlyExitEnabled ? "enabled" : "disabled";
        canvas.dataset.pbdEarlyExit =
          pbdEarlyExitEnabled ? "enabled" : "disabled";
        canvas.dataset.fabrikEarlyExit =
          fabrikEarlyExitEnabled ? "enabled" : "disabled";
        canvas.dataset.fabrikVisualSkip =
          fabrikVisualSkipEnabled ? "enabled" : "disabled";
        canvas.dataset.solverErrorTolerancePixels = String(
          SOLVER_ERROR_TOLERANCE_PIXELS,
        );
        const PROJECTION_SCALE = 1.0;
        const HEIGHT_PERSPECTIVE = 0;
        const HEIGHT_OFFSET_X = 0;
        const HEIGHT_OFFSET_Y = 0;
        const RENDER_SUPERSAMPLE =
          Number.isFinite(requestedRenderSupersample) &&
          requestedRenderSupersample > 0
            ? Math.min(
                2,
                Math.max(0.5, requestedRenderSupersample),
              )
            : 2;
        // A 56-row lookup grid keeps the exact same rendered surface while
        // reducing the CPU work needed to rebuild the spatial index each frame.
        // The query override supports deterministic regression comparisons.
        const SPATIAL_GRID_ROWS =
          useManualAnimationFrame &&
          Number.isFinite(requestedSpatialGridRows) &&
          requestedSpatialGridRows > 0
            ? Math.min(
                64,
                Math.max(16, Math.floor(requestedSpatialGridRows)),
              )
            : 56;
        // The production surface currently peaks at roughly 21 candidates per
        // cell. Keep a generous fast-path margin, then fall back to the full
        // skeleton scan if an unusual deformation ever exceeds it.
        const MAX_SPATIAL_SKELETONS =
          Number.isFinite(requestedSpatialCapacity) &&
          requestedSpatialCapacity > 0
            ? Math.min(
                64,
                Math.max(1, Math.floor(requestedSpatialCapacity)),
              )
            : 64;
        const prefersReducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const floatColor = Boolean(gl.getExtension("EXT_color_buffer_float"));
        const gpuTimerExtension = gpuTimingRequested
          ? gl.getExtension("EXT_disjoint_timer_query_webgl2")
          : null;
        const gpuTimerQueries = [];
        let gpuTimingEnabled = Boolean(gpuTimerExtension);
        if (gpuTimingEnabled) {
          for (
            let queryIndex = 0;
            queryIndex < GPU_TIMING_QUERY_POOL_SIZE;
            queryIndex += 1
          ) {
            const query = gl.createQuery();
            if (!query) {
              gpuTimingEnabled = false;
              break;
            }
            gpuTimerQueries.push(query);
          }
        }
        if (!gpuTimingEnabled) {
          for (const query of gpuTimerQueries) {
            gl.deleteQuery(query);
          }
          gpuTimerQueries.length = 0;
        }
        canvas.dataset.gpuTiming = gpuTimingRequested
          ? gpuTimingEnabled
            ? "enabled"
            : "unsupported"
          : "disabled";
        canvas.dataset.gpuTimingSampleInterval = String(
          GPU_TIMING_SAMPLE_INTERVAL,
        );
        const compactMedia = matchMedia("(max-width: 620px)");
        const isCompact = compactMedia.matches;
        canvas.dataset.runtimeCompact =
          isCompact ? "true" : "false";
        const initialCanvasRect = canvas.getBoundingClientRect();
        const surfaceAspect = Math.min(
          2.4,
          Math.max(
            0.6,
            initialCanvasRect.width / Math.max(1, initialCanvasRect.height),
          ),
        );
        const maximumTextureDimension = gl.getParameter(
          gl.MAX_TEXTURE_SIZE,
        );
        const SPATIAL_GRID_COLUMNS = Math.min(
          Math.floor(
            maximumTextureDimension / SPATIAL_GRID_ROWS,
          ),
          Math.max(
            1,
            Math.round(SPATIAL_GRID_ROWS * surfaceAspect),
          ),
        );
        const SPATIAL_CELL_COUNT =
          SPATIAL_GRID_COLUMNS * SPATIAL_GRID_ROWS;
        const skeletonCount = Math.min(
          MAX_SKELETONS,
          Math.max(
            150,
            Math.round((isCompact ? 209 : 356) * surfaceAspect),
          ),
        );
        const maximumGridResolution = isCompact ? 512 : 640;
        // Surface noise is defined in aspect-correct world coordinates. A
        // square mesh therefore oversamples the short axis of a rectangle
        // without revealing extra detail. Match vertex spacing on both axes
        // and keep the exact former resolution on the long axis.
        const gridColumns = Math.max(
          2,
          Math.round(
            maximumGridResolution * Math.min(1, surfaceAspect),
          ),
        );
        const gridRows = Math.max(
          2,
          Math.round(
            maximumGridResolution / Math.max(1, surfaceAspect),
          ),
        );
        const gpuRenderLimit = Math.min(
          maximumTextureDimension,
          gl.getParameter(gl.MAX_RENDERBUFFER_SIZE),
        );
        const jointS = new Float64Array(CHAIN_LINKS + 1);
        const jointBendFactors = new Float64Array(CHAIN_LINKS + 1);
        const jointInitialPhases = new Float64Array(CHAIN_LINKS + 1);
        const jointNoisePhaseASines = new Float64Array(CHAIN_LINKS + 1);
        const jointNoisePhaseACosines = new Float64Array(CHAIN_LINKS + 1);
        const jointNoisePhaseBSines = new Float64Array(CHAIN_LINKS + 1);
        const jointNoisePhaseBCosines = new Float64Array(CHAIN_LINKS + 1);
        const jointNoisePhaseCSines = new Float64Array(CHAIN_LINKS + 1);
        const jointNoisePhaseCCosines = new Float64Array(CHAIN_LINKS + 1);
        const jointNoiseWeights = new Float64Array(CHAIN_LINKS + 1);
        const jointHorizontalTapers = new Float64Array(CHAIN_LINKS + 1);
        const jointVerticalPhaseSines = new Float64Array(CHAIN_LINKS + 1);
        const jointVerticalPhaseCosines = new Float64Array(CHAIN_LINKS + 1);
        for (let joint = 0; joint <= CHAIN_LINKS; joint++) {
          const s = joint / CHAIN_LINKS;
          jointS[joint] = s;
          jointBendFactors[joint] = s * s;
          jointInitialPhases[joint] = s * 4.2;
          jointNoisePhaseASines[joint] = Math.sin(s * 5.3);
          jointNoisePhaseACosines[joint] = Math.cos(s * 5.3);
          jointNoisePhaseBSines[joint] = Math.sin(-s * 9.1);
          jointNoisePhaseBCosines[joint] = Math.cos(-s * 9.1);
          jointNoisePhaseCSines[joint] = Math.sin(s * 14.7);
          jointNoisePhaseCCosines[joint] = Math.cos(s * 14.7);
          jointNoiseWeights[joint] = 0.28 + s * 0.72;
          jointHorizontalTapers[joint] = 1 - s * 0.08;
          jointVerticalPhaseSines[joint] = Math.sin(s * 3.2);
          jointVerticalPhaseCosines[joint] = Math.cos(s * 3.2);
        }
        const renderChainJoints = new Uint8Array(RENDER_POINTS);
        const renderRadiusScales = new Float64Array(RENDER_POINTS);
        const renderBoundScales = new Float64Array(RENDER_POINTS);
        for (
          let renderJoint = 0;
          renderJoint < RENDER_POINTS;
          renderJoint++
        ) {
          const s = renderJoint / (RENDER_POINTS - 1);
          renderChainJoints[renderJoint] = Math.round(
            s * CHAIN_LINKS,
          );
          renderRadiusScales[renderJoint] =
            renderJoint === 0 ? 1.48 : 1.09 - s * 0.12;
          renderBoundScales[renderJoint] =
            renderJoint === 0 ? 1.48 : 1;
        }

        const surfaceVertex = `#version 300 es
          precision highp float;
          precision highp int;

          layout(location = 0) in vec2 aUv;

          uniform sampler2D uNoise;
          uniform sampler2D uSkeletons;
          uniform sampler2D uSkeletonBounds;
          uniform highp usampler2D uSpatialIndices;
          uniform highp usampler2D uSpatialSegmentMasks;
          uniform highp usampler2D uSpatialCounts;
          uniform int uSkeletonCount;
          uniform int uUseSpatialGrid;
          uniform float uTime;
          uniform float uSurfaceAspect;

          out vec3 vWorld;
          out float vHeight;
          out float vVariation;
          out float vEdge;
          out float vRidge;

          const int MAX_SKELS = ${MAX_SKELETONS};
          const int RENDER_POINTS = ${RENDER_POINTS};
          const int RENDER_SEGMENTS = ${RENDER_POINTS - 1};
          const int SPATIAL_GRID_COLUMNS = ${SPATIAL_GRID_COLUMNS};
          const int SPATIAL_GRID_ROWS = ${SPATIAL_GRID_ROWS};
          const int MAX_SPATIAL_SKELS = ${MAX_SPATIAL_SKELETONS};
          float saturate(float x) {
            return clamp(x, 0.0, 1.0);
          }

          float smoothMaximum(float a, float b, float softness) {
            float h = saturate(0.5 + 0.5 * (b - a) / softness);
            return mix(a, b, h) + softness * h * (1.0 - h);
          }

          vec4 noise4(vec2 uv) {
            return textureLod(uNoise, fract(uv), 0.0);
          }

          float morphNoise(vec2 uv) {
            float t = uTime;
            vec4 n0 = noise4(uv * 1.05 + vec2(t * 0.010, -t * 0.008));
            vec4 n1 = noise4(uv * 1.87 + vec2(-t * 0.007, t * 0.011));
            float a = 0.5 + 0.5 * sin(t * 0.135);
            float b = 0.5 + 0.5 * sin(t * 0.091 + 1.7);
            return mix(n0.r, n0.g, a) * 0.63 + mix(n1.b, n1.a, b) * 0.37;
          }

          float organismMask(vec2 uv) {
            return 1.0;
          }

          vec2 segmentMetric(vec2 p, vec2 a, vec2 b) {
            vec2 ab = b - a;
            float t = saturate(dot(p - a, ab) / max(dot(ab, ab), 0.000001));
            return vec2(length(p - (a + ab * t)), t);
          }

          float capsuleTop(float distanceToAxis, float radius, float centerHeight) {
            float x = saturate(distanceToAxis / max(radius, 0.0001));
            float dome = sqrt(max(0.0, 1.0 - x * x));
            float skirt = pow(1.0 - x, 2.2);
            return centerHeight * mix(skirt, dome, 0.78);
          }

          float evaluateSurface(
            vec2 rawUv,
            out float variation,
            out float ridgeAmount,
            out float edgeMask
          ) {
            vec2 displayUv = clamp(rawUv, 0.0, 1.0);
            vec2 uv = vec2(
              displayUv.x * uSurfaceAspect,
              displayUv.y
            );
            edgeMask = organismMask(uv);
            float mask = edgeMask;
            float broad = morphNoise(uv * 0.71 + vec2(0.13, 0.29));
            float fine = morphNoise(uv * 2.55 + vec2(0.47, 0.11));
            float base = (0.022 + broad * 0.030 + fine * 0.012) * mask;
            float height = base;
            float strongest = 0.0;
            variation = (fine - 0.5) * 0.36;

            ivec2 spatialCell = ivec2(
              clamp(
                floor(
                  vec2(
                    uv.x / uSurfaceAspect *
                      float(SPATIAL_GRID_COLUMNS),
                    uv.y * float(SPATIAL_GRID_ROWS)
                  )
                ),
                vec2(0.0),
                vec2(
                  float(SPATIAL_GRID_COLUMNS - 1),
                  float(SPATIAL_GRID_ROWS - 1)
                )
              )
            );
            int spatialCellIndex =
              spatialCell.y * SPATIAL_GRID_COLUMNS +
              spatialCell.x;
            int spatialCandidateCount = min(
              int(
                texelFetch(
                  uSpatialCounts,
                  ivec2(0, spatialCellIndex),
                  0
                ).r
              ),
              MAX_SPATIAL_SKELS
            );
            int candidateCount =
              uUseSpatialGrid != 0
                ? spatialCandidateCount
                : uSkeletonCount;

            for (int candidate = 0; candidate < MAX_SKELS; candidate++) {
              if (candidate >= candidateCount) {
                break;
              }
              int skeletonIndex =
                uUseSpatialGrid != 0
                  ? int(
                      texelFetch(
                        uSpatialIndices,
                        ivec2(candidate, spatialCellIndex),
                        0
                      ).r
                    )
                  : candidate;
              uint segmentMask =
                uUseSpatialGrid != 0
                  ? texelFetch(
                      uSpatialSegmentMasks,
                      ivec2(candidate, spatialCellIndex),
                      0
                    ).r
                  : uint((1 << RENDER_SEGMENTS) - 1);

              vec4 skeletonBounds =
                texelFetch(
                  uSkeletonBounds,
                  ivec2(0, skeletonIndex),
                  0
                );
              vec2 boundDelta = uv - skeletonBounds.xy;
              if (
                dot(boundDelta, boundDelta) >
                skeletonBounds.z * skeletonBounds.z
              ) {
                continue;
              }

              float strand = 0.0;

              for (int joint = 1; joint < RENDER_POINTS; joint++) {
                uint segmentBit = uint(1) << uint(joint - 1);
                if ((segmentMask & segmentBit) == uint(0)) {
                  continue;
                }
                vec4 previousPoint =
                  texelFetch(
                    uSkeletons,
                    ivec2(joint - 1, skeletonIndex),
                    0
                  );
                vec4 currentPoint =
                  texelFetch(
                    uSkeletons,
                    ivec2(joint, skeletonIndex),
                    0
                  );
                vec2 metric =
                  segmentMetric(
                    uv,
                    previousPoint.xy,
                    currentPoint.xy
                  );
                float radius =
                  mix(previousPoint.w, currentPoint.w, metric.y);
                float centerHeight =
                  mix(previousPoint.z, currentPoint.z, metric.y);
                strand = max(
                  strand,
                  capsuleTop(metric.x, radius, centerHeight)
                );
              }

              if (
                (
                  segmentMask &
                  (uint(1) << uint(RENDER_SEGMENTS - 1))
                ) != uint(0)
              ) {
                vec4 tipPoint =
                  texelFetch(
                    uSkeletons,
                    ivec2(RENDER_POINTS - 1, skeletonIndex),
                    0
                  );
                float tipDistance = length(uv - tipPoint.xy);
                strand = max(
                  strand,
                  capsuleTop(
                    tipDistance,
                    tipPoint.w,
                    tipPoint.z * 1.025
                  )
                );
              }
              if ((segmentMask & uint(1)) != uint(0)) {
                vec4 rootPoint =
                  texelFetch(
                    uSkeletons,
                    ivec2(0, skeletonIndex),
                    0
                  );
                float rootDistance = length(uv - rootPoint.xy);
                strand = max(
                  strand,
                  capsuleTop(
                    rootDistance,
                    rootPoint.w * 1.48,
                    rootPoint.z * 0.90
                  )
                );
              }
              strand *= mask;

              float softness =
                mix(0.019, 0.032, saturate(strand * 4.2));
              height = smoothMaximum(height, strand, softness);

              float strength = strand / max(height, 0.001);
              if (strength > strongest) {
                strongest = strength;
                float indexVariation =
                  sin(float(skeletonIndex) * 12.9898 + 4.137) * 0.5 +
                  sin(float(skeletonIndex) * 3.711) * 0.24;
                variation = indexVariation;
              }
            }

            float micro =
              (morphNoise(uv * 4.8 + vec2(0.31, 0.73)) - 0.5) *
              0.0013 *
              mask;
            ridgeAmount = saturate((height - base) * 5.0);
            return max(0.0, (height + micro) * mask);
          }

          void main() {
            float variation;
            float ridge;
            float edge;
            float height =
              evaluateSurface(aUv, variation, ridge, edge);

            vec3 world = vec3(aUv.x * uSurfaceAspect, aUv.y, height);
            float perspective = 1.0 + height * ${HEIGHT_PERSPECTIVE.toFixed(3)};
            vec2 projected =
              vec2(0.5) +
              (aUv - vec2(0.5)) *
              perspective *
              ${PROJECTION_SCALE.toFixed(3)};
            projected +=
              height *
              vec2(
                ${HEIGHT_OFFSET_X.toFixed(3)} / uSurfaceAspect,
                ${HEIGHT_OFFSET_Y.toFixed(3)}
              );

            vWorld = world;
            vHeight = height;
            vVariation = variation;
            vEdge = edge;
            vRidge = ridge;

            gl_Position = vec4(
              projected.x * 2.0 - 1.0,
              1.0 - projected.y * 2.0,
              0.58 - height * 0.84,
              1.0
            );
          }
        `;

        const surfaceFragment = `#version 300 es
          precision highp float;

          in vec3 vWorld;
          in float vHeight;
          in float vVariation;
          in float vEdge;
          in float vRidge;

          layout(location = 0) out vec4 outColor;
          layout(location = 1) out vec4 outGeometry;

          const float PI = 3.14159265359;

          float saturate(float x) {
            return clamp(x, 0.0, 1.0);
          }

          float distributionGGX(vec3 n, vec3 h, float roughness) {
            float a = roughness * roughness;
            float a2 = a * a;
            float ndh = max(dot(n, h), 0.0);
            float d = ndh * ndh * (a2 - 1.0) + 1.0;
            return a2 / max(PI * d * d, 0.0001);
          }

          float geometrySchlick(float ndv, float roughness) {
            float r = roughness + 1.0;
            float k = (r * r) / 8.0;
            return ndv / max(ndv * (1.0 - k) + k, 0.0001);
          }

          vec3 fresnelSchlick(float cosTheta, vec3 f0) {
            return f0 + (1.0 - f0) * pow(1.0 - cosTheta, 5.0);
          }

          vec3 pbrLight(
            vec3 n,
            vec3 v,
            vec3 lightDirection,
            vec3 radiance,
            vec3 albedo,
            float roughness
          ) {
            vec3 l = normalize(lightDirection);
            vec3 h = normalize(v + l);
            float ndl = max(dot(n, l), 0.0);
            float ndv = max(dot(n, v), 0.001);
            float ndh = max(dot(n, h), 0.0);
            float vdh = max(dot(v, h), 0.0);
            vec3 f0 = mix(vec3(0.035), albedo, 0.045);
            vec3 f = fresnelSchlick(vdh, f0);
            float d = distributionGGX(n, h, roughness);
            float g = geometrySchlick(ndv, roughness) * geometrySchlick(ndl, roughness);
            vec3 specular = d * g * f / max(4.0 * ndv * ndl, 0.001);
            vec3 diffuse = (vec3(1.0) - f) * albedo / PI;
            return (diffuse + specular) * radiance * ndl;
          }

          void main() {
            if (vEdge < 0.015) {
              discard;
            }

            vec3 derivativeX = dFdx(vWorld);
            vec3 derivativeY = dFdy(vWorld);
            vec3 n = normalize(cross(derivativeX, derivativeY));
            if (n.z < 0.0) {
              n = -n;
            }
            vec3 v = normalize(vec3(-0.09, -0.11, 1.0));
            float normalizedColorShift =
              clamp(vVariation / 0.72, -1.0, 1.0);
            normalizedColorShift =
              sign(normalizedColorShift) *
              sqrt(abs(normalizedColorShift));
            float colorShift = normalizedColorShift * 0.72;
            vec3 roseA = vec3(0.776471, 0.282353, 0.470588);
            vec3 roseB = vec3(0.984314, 0.533333, 0.705882);
            vec3 albedo = mix(roseA, roseB, 0.50 + colorShift * 0.46);
            albedo *= 0.985 + 0.035 * sin(vWorld.x * 31.0 + vWorld.y * 19.0);

            float roughness = mix(0.235, 0.165, vRidge);
            vec3 color = albedo * vec3(0.61, 0.52, 0.57);
            color += pbrLight(
              n,
              v,
              normalize(vec3(-0.54, -0.66, 0.79)),
              vec3(1.46, 1.34, 1.38),
              albedo,
              roughness
            );
            color += pbrLight(
              n,
              v,
              normalize(vec3(0.69, 0.24, 0.52)),
              vec3(0.78, 0.64, 0.72),
              albedo,
              roughness + 0.08
            );

            float ndv = max(dot(n, v), 0.0);
            float fresnel = pow(1.0 - ndv, 3.2);
            float back = pow(max(dot(-n, normalize(vec3(0.49, 0.62, -0.58))), 0.0), 1.4);
            float thickness = saturate(1.0 - vHeight * 2.1) * 0.44 + (1.0 - vRidge) * 0.17;
            vec3 transmission = vec3(1.0, 0.22, 0.42) * back * (0.12 + thickness * 0.42);
            color += transmission;
            color += vec3(1.0, 0.75, 0.84) * fresnel * 0.36;

            float tipGlow = smoothstep(0.13, 0.32, vHeight) * max(n.z, 0.0);
            color += vec3(1.0, 0.54, 0.68) * tipGlow * 0.075;
            vec3 studioHalf = normalize(v + normalize(vec3(-0.52, -0.65, 0.86)));
            float broadSheen = pow(max(dot(n, studioHalf), 0.0), 9.0);
            float wetGlint = pow(max(dot(n, studioHalf), 0.0), 52.0);
            color +=
              vec3(1.0, 0.66, 0.78) * broadSheen * 0.17 +
              vec3(1.0, 0.95, 0.98) * wetGlint * 0.38;
            color = min(color, vec3(1.45));

            outColor = vec4(color, 1.0);
            outGeometry = vec4(n * 0.5 + 0.5, vHeight);
          }
        `;

        const postVertex = `#version 300 es
          precision highp float;

          out vec2 vUv;

          void main() {
            vec2 p = vec2(
              float((gl_VertexID << 1) & 2),
              float(gl_VertexID & 2)
            );
            vUv = p;
            gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
          }
        `;

        const scatterFragment = `#version 300 es
          precision highp float;

          uniform sampler2D uSource;
          uniform sampler2D uGeometry;
          uniform vec2 uDirection;
          uniform vec2 uTexel;
          uniform float uPass;

          in vec2 vUv;
          out vec4 outColor;

          void main() {
            vec4 centerGeometry = texture(uGeometry, vUv);
            float centerHeight = centerGeometry.a;
            vec3 center = texture(uSource, vUv).rgb;
            if (centerHeight < 0.002) {
              outColor = vec4(center, 1.0);
              return;
            }
            vec3 accumulated = center * 0.225;
            float total = 0.225;

            const float weights[6] = float[6](
              0.1946, 0.1650, 0.1210, 0.0760, 0.0410, 0.0180
            );

            for (int i = 1; i <= 6; i++) {
              float fi = float(i);
              vec2 offset = uDirection * uTexel * fi * mix(1.55, 2.15, uPass);

              for (int side = -1; side <= 1; side += 2) {
                vec2 sampleUv = vUv + offset * float(side);
                vec4 sampleGeometry = texture(uGeometry, sampleUv);
                float sampleHeight = sampleGeometry.a;
                float bilateral = exp(-abs(sampleHeight - centerHeight) * 18.0);
                bilateral *= step(0.0015, sampleHeight);
                float weight = weights[i - 1] * bilateral;
                vec3 sampleColor = texture(uSource, sampleUv).rgb;
                accumulated += sampleColor * weight;
                total += weight;
              }
            }

            vec3 blurred = accumulated / max(total, 0.001);
            outColor = vec4(blurred, 1.0);
          }
        `;

        const compositeFragment = `#version 300 es
          precision highp float;

          uniform sampler2D uSharp;
          uniform sampler2D uScatter;
          uniform sampler2D uGeometry;
          uniform vec2 uTexel;
          uniform vec2 uPointer;
          uniform float uPointerInside;
          uniform float uTime;
          uniform float uSurfaceAspect;
          uniform vec2 uViewport;
          uniform float uCornerRadius;
          uniform float uUseTransparentSubstrate;

          in vec2 vUv;
          out vec4 outColor;

          const float SSS_TRANSPARENCY = 0.05;
          const vec3 SSS_LIGHT_POSITION = vec3(-0.12, 1.12, 0.42);
          uniform vec3 uSubstrate;
          const vec3 TENTACLE_ROSE =
            vec3(0.941176, 0.376471, 0.588235);
          const vec3 MUTA_PINK_DEEP =
            vec3(0.674510, 0.215686, 0.396078);
          const vec3 MUTA_PINK_SHADOW =
            vec3(0.776471, 0.282353, 0.470588);
          const vec3 MUTA_PINK_MID =
            vec3(0.882353, 0.313725, 0.525490);
          const vec3 MUTA_PINK_BODY =
            vec3(0.968627, 0.447059, 0.643137);
          const vec3 MUTA_PINK_LIGHT =
            vec3(0.984314, 0.533333, 0.705882);
          const vec3 MUTA_PINK_HIGHLIGHT =
            vec3(0.992157, 0.803922, 0.874510);

          float saturate(float x) {
            return clamp(x, 0.0, 1.0);
          }

          vec3 mutaPinkPalette(float tone) {
            float t = saturate(tone);
            if (t < 0.20) {
              return mix(
                MUTA_PINK_DEEP,
                MUTA_PINK_SHADOW,
                t / 0.20
              );
            }
            if (t < 0.43) {
              return mix(
                MUTA_PINK_SHADOW,
                MUTA_PINK_MID,
                (t - 0.20) / 0.23
              );
            }
            if (t < 0.68) {
              return mix(
                MUTA_PINK_MID,
                MUTA_PINK_BODY,
                (t - 0.43) / 0.25
              );
            }
            if (t < 0.86) {
              return mix(
                MUTA_PINK_BODY,
                MUTA_PINK_LIGHT,
                (t - 0.68) / 0.18
              );
            }
            return mix(
              MUTA_PINK_LIGHT,
              MUTA_PINK_HIGHLIGHT,
              (t - 0.86) / 0.14
            );
          }

          void main() {
            vec2 halfViewport = uViewport * 0.5;
            vec2 cornerPosition =
              abs(vUv * uViewport - halfViewport) -
              (halfViewport - vec2(uCornerRadius));
            float cornerDistance =
              length(max(cornerPosition, 0.0)) +
              min(max(cornerPosition.x, cornerPosition.y), 0.0) -
              uCornerRadius;
            if (cornerDistance > 0.0) {
              outColor = vec4(0.0);
              return;
            }

            vec4 geometry = texture(uGeometry, vUv);
            float height = geometry.a;

            if (height < 0.0015) {
              if (uUseTransparentSubstrate > 0.5) {
                outColor = vec4(0.0);
                return;
              }

              float groundShadow = 0.0;
              groundShadow +=
                step(
                  0.002,
                  texture(uGeometry, vUv - vec2(5.0, 7.0) * uTexel).a
                ) *
                0.32;
              groundShadow +=
                step(
                  0.002,
                  texture(uGeometry, vUv - vec2(10.0, 13.0) * uTexel).a
                ) *
                0.18;
              groundShadow +=
                step(
                  0.002,
                  texture(uGeometry, vUv - vec2(16.0, 20.0) * uTexel).a
                ) *
                0.08;
              float pointerAura =
                uPointerInside *
                exp(
                  -length(
                    vec2(
                      (vUv.x - uPointer.x) * uSurfaceAspect,
                      vUv.y - uPointer.y
                    )
                  ) *
                  54.0
                ) *
                (0.010 + 0.003 * sin(uTime * 4.0));
              vec3 shadowColor = mix(
                uSubstrate,
                vec3(0.025, 0.010, 0.018),
                0.76
              );
              vec3 paper = mix(
                uSubstrate,
                shadowColor,
                saturate(groundShadow * 0.78)
              );
              paper = mix(
                paper,
                TENTACLE_ROSE,
                pointerAura * 0.34
              );
              outColor = vec4(paper, 1.0);
              return;
            }

            vec3 normalAccumulator = geometry.rgb * 2.0 - 1.0;
            vec3 sharpAccumulator = texture(uSharp, vUv).rgb * 2.0;
            float smoothingWeight = 2.0;
            const vec2 smoothingOffsets[4] = vec2[4](
              vec2(1.0, 0.0),
              vec2(-1.0, 0.0),
              vec2(0.0, 1.0),
              vec2(0.0, -1.0)
            );

            for (int i = 0; i < 4; i++) {
              vec2 sampleUv = vUv + smoothingOffsets[i] * uTexel * 1.65;
              vec4 nearbyGeometry = texture(uGeometry, sampleUv);
              float nearbyWeight =
                exp(-abs(nearbyGeometry.a - height) * 72.0) *
                step(0.0015, nearbyGeometry.a);
              normalAccumulator +=
                (nearbyGeometry.rgb * 2.0 - 1.0) * nearbyWeight;
              sharpAccumulator +=
                texture(uSharp, sampleUv).rgb * nearbyWeight;
              smoothingWeight += nearbyWeight;
            }

            vec3 normal = normalize(normalAccumulator);
            vec3 sharp = sharpAccumulator / max(smoothingWeight, 0.001);
            vec3 scatter = texture(uScatter, vUv).rgb;
            vec3 sssLightVector =
              SSS_LIGHT_POSITION - vec3(vUv, height);
            float sssLightDistanceSquared =
              dot(sssLightVector, sssLightVector);
            vec3 sssLightDirection = normalize(sssLightVector);
            float sssIncidence = saturate(
              0.42 + 0.58 * dot(normal, sssLightDirection)
            );
            float sssLightFalloff =
              1.0 / (1.0 + sssLightDistanceSquared * 0.82);
            float sssLightEnergy = saturate(
              sssIncidence * sssLightFalloff * 1.55
            );

            float occlusion = 0.0;
            float neighboringSurface = 0.0;
            const vec2 directions[10] = vec2[10](
              vec2(1.0, 0.0),
              vec2(-1.0, 0.0),
              vec2(0.0, 1.0),
              vec2(0.0, -1.0),
              vec2(0.707, 0.707),
              vec2(-0.707, 0.707),
              vec2(0.707, -0.707),
              vec2(-0.707, -0.707),
              vec2(0.383, 0.924),
              vec2(-0.924, 0.383)
            );

            for (int i = 0; i < 10; i++) {
              vec2 sampleUv = vUv + directions[i] * uTexel * 8.0;
              float neighborHeight = texture(uGeometry, sampleUv).a;
              occlusion += max(0.0, neighborHeight - height - 0.007);
              neighboringSurface = max(
                neighboringSurface,
                smoothstep(0.066, 0.115, neighborHeight)
              );
            }

            occlusion = saturate(occlusion * 3.20);
            float valley = saturate((1.0 - normal.z) * 0.46 + occlusion);
            float scatterMix =
              0.14 + valley * 0.08 + sssLightEnergy * 0.06;
            vec3 color = mix(sharp, scatter, scatterMix);
            color *= 1.0 - occlusion * 0.18;

            float depthTint = saturate((0.095 - height) * 6.5);
            color = mix(color, color * vec3(0.98, 0.78, 0.87), depthTint * 0.18);

            float pointerSheen =
              uPointerInside *
              exp(
                -length(
                  vec2(
                    (vUv.x - uPointer.x) * uSurfaceAspect,
                    vUv.y - uPointer.y
                  )
                ) *
                18.0
              ) *
              0.035;
            color += vec3(1.0, 0.72, 0.82) * pointerSheen;

            color = vec3(1.0) - exp(-color * 2.05);
            color = pow(color, vec3(0.82));
            color = mix(color, TENTACLE_ROSE, 0.15);
            float tipColorGradient =
              smoothstep(0.048, 0.190, height);
            color = mix(
              uSubstrate,
              color,
              tipColorGradient
            );
            float heightLift = smoothstep(0.055, 0.205, height);
            color *= 0.88 + heightLift * 0.15;
            vec3 highlightDirection = normalize(vec3(-0.48, -0.62, 0.82));
            float softGloss = pow(max(dot(normal, highlightDirection), 0.0), 11.0);
            float sharpGloss = pow(max(dot(normal, highlightDirection), 0.0), 48.0);
            color +=
              vec3(1.0, 0.62, 0.76) * softGloss * 0.105 +
              vec3(1.0, 0.96, 0.99) * sharpGloss * 0.19;
            color = mix(color, vec3(1.0), 0.025);

            float vignette = smoothstep(0.73, 0.15, length(vUv - 0.5));
            color *= mix(0.985, 1.018, vignette);
            float tentacleMask = smoothstep(0.045, 0.120, height);
            float opticalThickness = saturate(height / 0.240);
            vec3 transmittedPaper = mix(
              uSubstrate,
              mix(
                uSubstrate,
                TENTACLE_ROSE,
                tipColorGradient
              ),
              opticalThickness
            );
            transmittedPaper *= mix(0.58, 1.28, sssLightEnergy);
            color = mix(
              color,
              transmittedPaper,
              SSS_TRANSPARENCY * tentacleMask
            );
            float paletteTone = saturate(
              dot(color, vec3(0.2126, 0.7152, 0.0722)) * 0.72 +
              tipColorGradient * 0.22 -
              occlusion * 0.18 +
              sharpGloss * 0.12
            );
            vec3 referencePink = mutaPinkPalette(paletteTone);
            float paletteStrength =
              smoothstep(0.052, 0.145, height) * 0.90;
            color = mix(color, referencePink, paletteStrength);
            color +=
              MUTA_PINK_HIGHLIGHT *
              sharpGloss *
              paletteStrength *
              0.08;
            float outerContour =
              smoothstep(0.063, 0.073, height) *
              (1.0 - smoothstep(0.092, 0.112, height)) *
              paletteStrength;
            float innerContour =
              smoothstep(0.092, 0.112, height) *
              (1.0 - smoothstep(0.135, 0.165, height)) *
              paletteStrength;
            float edgeRim =
              pow(1.0 - saturate(normal.z), 1.55) *
              smoothstep(0.067, 0.155, height) *
              (1.0 - occlusion * 0.35);
            float paintedSheen =
              pow(
                max(
                  dot(
                    normal,
                    normalize(vec3(-0.31, -0.56, 0.82))
                  ),
                  0.0
                ),
                7.0
              ) *
              smoothstep(0.082, 0.190, height);
            float highlightBody =
              smoothstep(0.078, 0.165, height) *
              (1.0 - occlusion * 0.58) *
              paletteStrength;
            vec3 pearlDirection =
              normalize(vec3(-0.42, -0.58, 0.70));
            float pearlFacing =
              max(dot(normal, pearlDirection), 0.0);
            float broadPearl =
              pow(pearlFacing, 2.35) *
              highlightBody;
            float glossyRibbon =
              pow(pearlFacing, 9.5) *
              highlightBody;
            vec3 pinDirection =
              normalize(vec3(-0.66, -0.26, 0.71));
            float pinHighlight =
              pow(
                max(dot(normal, pinDirection), 0.0),
                34.0
              ) *
              highlightBody;
            float contourShadow = saturate(
              innerContour * 0.38 +
              occlusion * paletteStrength * 0.10
            );
            color = mix(
              color,
              MUTA_PINK_DEEP,
              contourShadow
            );
            float illustratedHighlight = saturate(
              outerContour * 0.78 +
              edgeRim * 0.31 +
              paintedSheen * 0.26
            );
            color = mix(
              color,
              MUTA_PINK_HIGHLIGHT,
              illustratedHighlight
            );
            color = mix(
              color,
              MUTA_PINK_LIGHT,
              broadPearl * 0.34
            );
            color = mix(
              color,
              vec3(1.0, 0.815686, 0.894118),
              glossyRibbon * 0.58
            );
            color +=
              vec3(1.0, 0.956863, 0.984314) *
              (
                sharpGloss * paletteStrength * 0.24 +
                pinHighlight * 0.38
              );
            float surfaceAlpha = max(
              smoothstep(0.064, 0.092, height),
              neighboringSurface * 0.08
            );
            surfaceAlpha = saturate(surfaceAlpha);
            outColor =
              uUseTransparentSubstrate > 0.5
                ? vec4(color * surfaceAlpha, surfaceAlpha)
                : vec4(color, 1.0);
          }
        `;

        function compileShader(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            const message = gl.getShaderInfoLog(shader);
            gl.deleteShader(shader);
            throw new Error(message || "Не удалось скомпилировать шейдер.");
          }
          return shader;
        }

        function createProgram(vertexSource, fragmentSource) {
          const program = gl.createProgram();
          gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vertexSource));
          gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fragmentSource));
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            const message = gl.getProgramInfoLog(program);
            gl.deleteProgram(program);
            throw new Error(message || "Не удалось собрать программу.");
          }
          return program;
        }

        const fastSurfaceVertex = surfaceVertex.replace(
          `const int MAX_SKELS = ${MAX_SKELETONS};`,
          `const int MAX_SKELS = ${MAX_SPATIAL_SKELETONS};`,
        );
        const surfaceProgram = createProgram(
          fastSurfaceVertex,
          surfaceFragment,
        );
        const fallbackSurfaceProgram = createProgram(
          surfaceVertex,
          surfaceFragment,
        );
        const scatterProgram = createProgram(postVertex, scatterFragment);
        const compositeProgram = createProgram(postVertex, compositeFragment);

        function uniform(program, name) {
          return gl.getUniformLocation(program, name);
        }

        function makeSurfaceUniforms(program) {
          return {
            noise: uniform(program, "uNoise"),
            skeletons: uniform(program, "uSkeletons"),
            skeletonBounds: uniform(program, "uSkeletonBounds"),
            spatialIndices: uniform(program, "uSpatialIndices"),
            spatialSegmentMasks: uniform(
              program,
              "uSpatialSegmentMasks",
            ),
            spatialCounts: uniform(program, "uSpatialCounts"),
            skeletonCount: uniform(program, "uSkeletonCount"),
            useSpatialGrid: uniform(program, "uUseSpatialGrid"),
            time: uniform(program, "uTime"),
            surfaceAspect: uniform(program, "uSurfaceAspect"),
          };
        }

        const surfaceUniforms =
          makeSurfaceUniforms(surfaceProgram);
        const fallbackSurfaceUniforms =
          makeSurfaceUniforms(fallbackSurfaceProgram);

        const scatterUniforms = {
          source: uniform(scatterProgram, "uSource"),
          geometry: uniform(scatterProgram, "uGeometry"),
          direction: uniform(scatterProgram, "uDirection"),
          texel: uniform(scatterProgram, "uTexel"),
          pass: uniform(scatterProgram, "uPass"),
        };

        const compositeUniforms = {
          sharp: uniform(compositeProgram, "uSharp"),
          scatter: uniform(compositeProgram, "uScatter"),
          geometry: uniform(compositeProgram, "uGeometry"),
          texel: uniform(compositeProgram, "uTexel"),
          pointer: uniform(compositeProgram, "uPointer"),
          pointerInside: uniform(compositeProgram, "uPointerInside"),
          time: uniform(compositeProgram, "uTime"),
          surfaceAspect: uniform(compositeProgram, "uSurfaceAspect"),
          substrate: uniform(compositeProgram, "uSubstrate"),
          viewport: uniform(compositeProgram, "uViewport"),
          cornerRadius: uniform(compositeProgram, "uCornerRadius"),
          useTransparentSubstrate: uniform(
            compositeProgram,
            "uUseTransparentSubstrate",
          ),
        };

        function configureSurfaceProgram(program, uniforms) {
          gl.useProgram(program);
          gl.uniform1i(uniforms.noise, 0);
          gl.uniform1i(uniforms.skeletons, 1);
          gl.uniform1i(uniforms.skeletonBounds, 2);
          gl.uniform1i(uniforms.spatialIndices, 3);
          gl.uniform1i(uniforms.spatialCounts, 4);
          gl.uniform1i(uniforms.spatialSegmentMasks, 5);
          gl.uniform1i(uniforms.skeletonCount, skeletonCount);
          gl.uniform1f(uniforms.surfaceAspect, surfaceAspect);
        }
        configureSurfaceProgram(surfaceProgram, surfaceUniforms);
        configureSurfaceProgram(
          fallbackSurfaceProgram,
          fallbackSurfaceUniforms,
        );
        gl.useProgram(scatterProgram);
        gl.uniform1i(scatterUniforms.source, 0);
        gl.uniform1i(scatterUniforms.geometry, 1);
        gl.useProgram(compositeProgram);
        gl.uniform1i(compositeUniforms.sharp, 0);
        gl.uniform1i(compositeUniforms.scatter, 1);
        gl.uniform1i(compositeUniforms.geometry, 2);
        gl.uniform1f(compositeUniforms.surfaceAspect, surfaceAspect);
        gl.useProgram(null);
        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.BLEND);
        gl.clearColor(0, 0, 0, 0);

        const themeColors = {
          light: [1, 250 / 255, 251 / 255],
          dark: [9 / 255, 6 / 255, 8 / 255],
        };
        let activeTheme = "light";
        let substrateColor = themeColors.light;
        // Standalone previews animate immediately. When embedded in the site,
        // stay paused until the parent visibility observer explicitly enables
        // the contact section; this also closes the brief startup window before
        // the first cross-frame runtime message arrives.
        const isEmbeddedRuntime =
          runtimeSearch.get("embedded") === "1";
        let runtimeVisible = !isEmbeddedRuntime;
        let scrollRenderingSuppressed = false;
        let scrollSuppressionCount = 0;
        let animationFrameRequest = null;
        let reportedAnimationFrameScheduled = null;
        let animationLoopReady = false;
        let animationRuntimeActive = false;
        let resetAnimationClockOnNextFrame = false;
        const SCROLL_IDLE_FALLBACK_MS = 320;

        function applyTheme(theme) {
          activeTheme = theme === "dark" ? "dark" : "light";
          substrateColor = themeColors[activeTheme];
          document.documentElement.dataset.theme = activeTheme;
        }

        function readParentTheme() {
          try {
            return window.parent.document.documentElement.dataset.theme;
          } catch {
            return new URLSearchParams(location.search).get("theme");
          }
        }

        function applyRuntimeState(nextState) {
          const wasScrollRenderingSuppressed =
            scrollRenderingSuppressed;
          runtimeVisible = nextState.visible !== false;
          scrollRenderingSuppressed =
            runtimeVisible && nextState.scrollActive === true;
          if (
            scrollRenderingSuppressed &&
            !wasScrollRenderingSuppressed
          ) {
            scrollSuppressionCount += 1;
            canvas.dataset.scrollSuppressionCount =
              String(scrollSuppressionCount);
          }
          canvas.dataset.runtimeVisible =
            runtimeVisible ? "true" : "false";
          canvas.dataset.scrollRendering =
            scrollRenderingSuppressed ? "suppressed" : "active";
          syncAnimationLoopState();
