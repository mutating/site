            pointerSolverOrigin[offset + 1] =
              points[pointOffset + POINT_Y];
            pointerSolverOrigin[offset + 2] =
              points[pointOffset + POINT_Z];
          }
        }

        function blendPointerSolverBody(points, blend) {
          if (blend >= 1) {
            return;
          }
          for (let joint = 1; joint < CHAIN_LINKS; joint++) {
            const pointOffset = joint * POINT_STRIDE;
            const offset = joint * 3;
            points[pointOffset + POINT_X] =
              pointerSolverOrigin[offset] +
              (
                points[pointOffset + POINT_X] -
                pointerSolverOrigin[offset]
              ) *
                blend;
            points[pointOffset + POINT_Y] =
              pointerSolverOrigin[offset + 1] +
              (
                points[pointOffset + POINT_Y] -
                pointerSolverOrigin[offset + 1]
              ) *
                blend;
            points[pointOffset + POINT_Z] =
              pointerSolverOrigin[offset + 2] +
              (
                points[pointOffset + POINT_Z] -
                pointerSolverOrigin[offset + 2]
              ) *
                blend;
          }
        }

        function stabilizePointerSolverVelocity(
          points,
          forceMagnitude,
          delta,
        ) {
          const tipVelocityDamping =
            1 -
            Math.exp(
              -delta * Math.min(forceMagnitude, 2) * 32,
            );

          for (let joint = 1; joint <= CHAIN_LINKS; joint++) {
            const pointOffset = joint * POINT_STRIDE;
            const offset = joint * 3;

            // The IK displacement shapes the tentacle, but it must not become
            // Verlet velocity on the next frame. Otherwise the tip overshoots
            // a stationary pointer and is pulled back every other frame.
            points[pointOffset + POINT_PREVIOUS_X] +=
              points[pointOffset + POINT_X] -
              pointerSolverOrigin[offset];
            points[pointOffset + POINT_PREVIOUS_Y] +=
              points[pointOffset + POINT_Y] -
              pointerSolverOrigin[offset + 1];
            points[pointOffset + POINT_PREVIOUS_Z] +=
              points[pointOffset + POINT_Z] -
              pointerSolverOrigin[offset + 2];

            const tipWeight = joint / CHAIN_LINKS;
            const damping =
              tipVelocityDamping * tipWeight * tipWeight;
            points[pointOffset + POINT_PREVIOUS_X] +=
              (
                points[pointOffset + POINT_X] -
                points[pointOffset + POINT_PREVIOUS_X]
              ) *
              damping;
            points[pointOffset + POINT_PREVIOUS_Y] +=
              (
                points[pointOffset + POINT_Y] -
                points[pointOffset + POINT_PREVIOUS_Y]
              ) *
              damping;
            points[pointOffset + POINT_PREVIOUS_Z] +=
              (
                points[pointOffset + POINT_Z] -
                points[pointOffset + POINT_PREVIOUS_Z]
              ) *
              damping;
          }
        }

        function solveChainTowardPointer(
          skeleton,
          attraction,
          delta,
          pointerWorldX,
          pointerWorldY,
          solverPixelScale,
        ) {
          if (interactionDiagnostics) {
            solverDiagnostics.fabrikAttempts += 1;
          }
          const forceMagnitude = Math.abs(attraction);
          if (forceMagnitude <= 0) {
            if (interactionDiagnostics) {
              solverDiagnostics.fabrikExactZeroSkips += 1;
            }
            return;
          }
          const forceDirection = Math.sign(attraction);

          const points = skeleton.points;
          const rootOffset = 0;
          const tipOffset = CHAIN_LINKS * POINT_STRIDE;
          const rootX = skeleton.root.x;
          const rootY = skeleton.root.y;
          const rootZ = skeleton.baseHeight;
          const pointerDeltaX =
            pointerWorldX - points[tipOffset + POINT_X];
          const pointerDeltaY =
            pointerWorldY - points[tipOffset + POINT_Y];
          const pointerDistance = length2(
            pointerDeltaX,
            pointerDeltaY,
          );
          const maximumTipStep =
            cursorTipSpeed(forceMagnitude) * delta;
          const movementScale =
            pointerDistance > 0
              ? Math.min(1, maximumTipStep / pointerDistance)
              : 0;
          const targetX =
            points[tipOffset + POINT_X] +
            pointerDeltaX * movementScale * forceDirection;
          const targetY =
            points[tipOffset + POINT_Y] +
            pointerDeltaY * movementScale * forceDirection;
          const horizontalDistance = length2(
            targetX - rootX,
            targetY - rootY,
          );
          const maximumVerticalReach = Math.sqrt(
            Math.max(
              0,
              skeleton.totalLengthSquared -
                horizontalDistance * horizontalDistance,
            ),
          );
          const desiredHeight = Math.max(
            points[tipOffset + POINT_Z],
            skeleton.baseHeight + skeleton.tipClearance * 0.88,
          );
          const constrainedTargetZ = Math.min(
            desiredHeight,
            rootZ + maximumVerticalReach * 0.84,
          );
          const verticalTargetBlend = Math.min(
            1,
            maximumTipStep /
              Math.max(0.000001, skeleton.linkLength),
          );
          const targetZ =
            points[tipOffset + POINT_Z] +
            (constrainedTargetZ - points[tipOffset + POINT_Z]) *
              verticalTargetBlend;
          if (
            fabrikVisualSkipEnabled &&
            !skeleton.grabbed
          ) {
            const movementTolerance =
              SOLVER_ERROR_TOLERANCE_PIXELS / solverPixelScale;
            const requestedTipDeltaX =
              targetX - points[tipOffset + POINT_X];
            const requestedTipDeltaY =
              targetY - points[tipOffset + POINT_Y];
            const requestedTipDeltaZ =
              targetZ - points[tipOffset + POINT_Z];
            if (
              requestedTipDeltaX * requestedTipDeltaX +
                requestedTipDeltaY * requestedTipDeltaY +
                requestedTipDeltaZ * requestedTipDeltaZ <=
              movementTolerance * movementTolerance
            ) {
              if (interactionDiagnostics) {
                solverDiagnostics.fabrikVisualSkips += 1;
              }
              return;
            }
          }
          const normalizedSolverForce = clamp(
            forceMagnitude / POINTER_SOLVER_FULL_BODY_FORCE,
            0,
            1,
          );
          const solverBodyBlend = skeleton.grabbed
            ? 1
            : normalizedSolverForce *
              normalizedSolverForce *
              (3 - 2 * normalizedSolverForce);
          capturePointerSolverState(points);
          const targetDeltaX = targetX - rootX;
          const targetDeltaY = targetY - rootY;
          const targetDeltaZ = targetZ - rootZ;
          const rootToTarget = Math.max(
            0.000001,
            length3(targetDeltaX, targetDeltaY, targetDeltaZ),
          );

          if (rootToTarget >= skeleton.totalLength * 0.9995) {
            if (interactionDiagnostics) {
              solverDiagnostics.fabrikDirectSolves += 1;
            }
            const stepScale = skeleton.linkLength / rootToTarget;
            const stepX = targetDeltaX * stepScale;
            const stepY = targetDeltaY * stepScale;
            const stepZ = targetDeltaZ * stepScale;
            points[rootOffset + POINT_X] = rootX;
            points[rootOffset + POINT_Y] = rootY;
            points[rootOffset + POINT_Z] = rootZ;
            for (let joint = 1; joint <= CHAIN_LINKS; joint++) {
              const previousOffset = (joint - 1) * POINT_STRIDE;
              const pointOffset = joint * POINT_STRIDE;
              points[pointOffset + POINT_X] =
                points[previousOffset + POINT_X] + stepX;
              points[pointOffset + POINT_Y] =
                points[previousOffset + POINT_Y] + stepY;
              points[pointOffset + POINT_Z] =
                points[previousOffset + POINT_Z] + stepZ;
            }
            blendPointerSolverBody(points, solverBodyBlend);
            stabilizePointerSolverVelocity(
              points,
              forceMagnitude,
              delta,
            );
            return;
          }

          const solverIterations = skeleton.grabbed ? 20 : 7;
          let completedSolverIterations = 0;
          let solverExitedEarly = false;
          for (let iteration = 0; iteration < solverIterations; iteration++) {
            completedSolverIterations = iteration + 1;
            points[tipOffset + POINT_X] = targetX;
            points[tipOffset + POINT_Y] = targetY;
            points[tipOffset + POINT_Z] = targetZ;

            for (let joint = CHAIN_LINKS - 1; joint >= 0; joint--) {
              const parentOffset = joint * POINT_STRIDE;
              const childOffset = parentOffset + POINT_STRIDE;
              const dx =
                points[parentOffset + POINT_X] -
                points[childOffset + POINT_X];
              const dy =
                points[parentOffset + POINT_Y] -
                points[childOffset + POINT_Y];
              const dz =
                points[parentOffset + POINT_Z] -
                points[childOffset + POINT_Z];
              const distance = Math.max(
                0.000001,
                length3(dx, dy, dz),
              );
              const scale = skeleton.linkLength / distance;
              points[parentOffset + POINT_X] =
                points[childOffset + POINT_X] + dx * scale;
              points[parentOffset + POINT_Y] =
                points[childOffset + POINT_Y] + dy * scale;
              points[parentOffset + POINT_Z] =
                points[childOffset + POINT_Z] + dz * scale;
            }

            points[rootOffset + POINT_X] = rootX;
            points[rootOffset + POINT_Y] = rootY;
            points[rootOffset + POINT_Z] = rootZ;

            for (let joint = 0; joint < CHAIN_LINKS; joint++) {
              const parentOffset = joint * POINT_STRIDE;
              const childOffset = parentOffset + POINT_STRIDE;
              const dx =
                points[childOffset + POINT_X] -
                points[parentOffset + POINT_X];
              const dy =
                points[childOffset + POINT_Y] -
                points[parentOffset + POINT_Y];
              const dz =
                points[childOffset + POINT_Z] -
                points[parentOffset + POINT_Z];
              const distance = Math.max(
                0.000001,
                length3(dx, dy, dz),
              );
              const scale = skeleton.linkLength / distance;
              points[childOffset + POINT_X] =
                points[parentOffset + POINT_X] + dx * scale;
              points[childOffset + POINT_Y] =
                points[parentOffset + POINT_Y] + dy * scale;
              points[childOffset + POINT_Z] =
                points[parentOffset + POINT_Z] + dz * scale;
            }

            if (
              fabrikEarlyExitEnabled &&
              !skeleton.grabbed &&
              completedSolverIterations >= MIN_FABRIK_ITERATIONS
            ) {
              const convergenceTolerance =
                SOLVER_ERROR_TOLERANCE_PIXELS / solverPixelScale;
              const convergenceDeltaX =
                points[tipOffset + POINT_X] - targetX;
              const convergenceDeltaY =
                points[tipOffset + POINT_Y] - targetY;
              const convergenceDeltaZ =
                points[tipOffset + POINT_Z] - targetZ;
              if (
                convergenceDeltaX * convergenceDeltaX +
                  convergenceDeltaY * convergenceDeltaY +
                  convergenceDeltaZ * convergenceDeltaZ <=
                convergenceTolerance * convergenceTolerance
              ) {
                solverExitedEarly = true;
                break;
              }
            }
          }
          if (interactionDiagnostics) {
            solverDiagnostics.fabrikIterativeSolves += 1;
            solverDiagnostics.fabrikIterations +=
              completedSolverIterations;
            if (skeleton.grabbed) {
              solverDiagnostics.fabrikGrabbedSolves += 1;
              solverDiagnostics.fabrikGrabbedIterations +=
                completedSolverIterations;
            } else {
              solverDiagnostics.fabrikOrdinarySolves += 1;
              solverDiagnostics.fabrikOrdinaryIterations +=
                completedSolverIterations;
            }
            if (solverExitedEarly) {
              solverDiagnostics.fabrikEarlyExits += 1;
            }
          }
          blendPointerSolverBody(points, solverBodyBlend);
          stabilizePointerSolverVelocity(
            points,
            forceMagnitude,
            delta,
          );
        }

        const grabberSkeletons = new Array(MAX_CURSOR_GRABBERS);
        const grabberDistances = new Float64Array(
          MAX_CURSOR_GRABBERS,
        );

        function updateSkeletons(
          time,
          delta,
          wallTime,
          temporalDelta = delta,
          incomingVelocityScale = 1,
        ) {
          if (interactionDiagnostics) {
            resetSolverDiagnostics();
          }
          const solverPixelScale = Math.max(
            1,
            canvasRect.height * PROJECTION_SCALE,
          );
          const solverErrorTolerance =
            SOLVER_ERROR_TOLERANCE_PIXELS / solverPixelScale;
          if (debugPointerOverride) {
            pointer.targetX = clamp(debugPointerX, 0, 1);
            pointer.targetY = clamp(debugPointerY, 0, 1);
            pointer.inside = true;
          }
          pointer.x = pointer.targetX;
          pointer.y = pointer.targetY;
          const targetEnergy = pointer.inside ? 1 : 0;
          pointer.energy +=
            (targetEnergy - pointer.energy) *
            (1 - Math.exp(-temporalDelta * 6));
          const pointerInteraction =
            currentPointerInteraction(wallTime);
          const pointerWorldX = pointer.x * surfaceAspect;
          const pointerWorldY = pointer.y;
          const heldAttractionBlend =
            currentStationaryHeldAttractionBlend(
              pointerInteraction,
              temporalDelta,
            );
          const postReleaseAttractionBlend =
            pointerInteraction.direction === 0 && !pointer.pressed
              ? releaseAttractionBlend(temporalDelta)
              : 1;
          renderedInteractionPhase = pointerInteraction.phase;
          canvas.dataset.pointerInteractionPhase =
            pointerInteraction.phase;
          canvas.dataset.pointerInteractionForceMultiplier =
            pointerInteraction.forceMultiplier.toFixed(3);
          canvas.dataset.pointerInteractionRadiusMultiplier =
            pointerInteraction.radiusMultiplier.toFixed(3);
          canvas.dataset.pointerInteractionDirection =
            String(pointer.pressed ? pointer.pressDirection : 0);
          canvas.dataset.pointerPressed =
            pointer.pressed ? "true" : "false";
          if (pointerInteraction.phase === "impulse") {
            impulsePhysicsApplications += 1;
            canvas.dataset.impulsePhysicsApplications =
              String(impulsePhysicsApplications);
            canvas.dataset.lastImpulsePeakForceMultiplier =
              pointerInteraction.forceMultiplier.toFixed(3);
            canvas.dataset.lastImpulseDirection =
              String(pointerInteraction.direction);
          }
          const collectDiagnostics =
            interactionDiagnostics ||
            debugTargets ||
            wallTime - diagnosticStart >= 1;
          if (collectDiagnostics) {
            diagnostics.activeTips = 0;
            diagnostics.maximumAttraction = 0;
            diagnostics.maximumRestDisplacement = 0;
            diagnostics.minimumTipClearance = 1;
            diagnostics.minimumCursorDistance = 1;
            diagnostics.closestTipX = pointer.x;
            diagnostics.closestTipY = pointer.y;
            diagnostics.strongTipCount = 0;
            diagnostics.strongTipX = 0;
            diagnostics.strongTipY = 0;
            diagnostics.grabberCount = 0;
            diagnostics.maximumGrabberError = 0;
          }

          let grabberCount = 0;
          for (const skeleton of skeletons) {
            skeleton.grabbed = false;
            if (pointer.energy <= 0.01) {
              continue;
            }
            const rootDistance = length2(
              pointerWorldX - skeleton.root.x,
              pointerWorldY - skeleton.root.y,
            );
            if (
              pointerInteraction.direction >= 0 &&
              rootDistance <= skeleton.maximumGrabDistance
            ) {
              let insertionIndex = grabberCount;
              while (
                insertionIndex > 0 &&
                grabberDistances[insertionIndex - 1] > rootDistance
              ) {
                insertionIndex--;
              }
              if (insertionIndex < MAX_CURSOR_GRABBERS) {
                const nextGrabberCount = Math.min(
                  MAX_CURSOR_GRABBERS,
                  grabberCount + 1,
                );
                for (
                  let candidateIndex = nextGrabberCount - 1;
                  candidateIndex > insertionIndex;
                  candidateIndex--
                ) {
                  grabberSkeletons[candidateIndex] =
                    grabberSkeletons[candidateIndex - 1];
                  grabberDistances[candidateIndex] =
                    grabberDistances[candidateIndex - 1];
                }
                grabberSkeletons[insertionIndex] = skeleton;
                grabberDistances[insertionIndex] = rootDistance;
                grabberCount = nextGrabberCount;
              }
            }
          }
          if (collectDiagnostics) {
            diagnostics.grabberCount = grabberCount;
          }
          for (
            let grabberIndex = 0;
            grabberIndex < grabberCount;
            grabberIndex++
          ) {
            grabberSkeletons[grabberIndex].grabbed = true;
          }

          spatialCountPixels.fill(0);
          spatialGridValid = true;
          maximumSpatialCellLoad = 0;
          const velocityDamping = Math.exp(-temporalDelta * 10.2);
          // Ordinary frames retain the original integration exactly. A
          // budgeted scroll frame represents several omitted RAF intervals.
          // Start with the equivalent accumulated 60 Hz rest response rather
          // than squaring a large delta (which would overshoot), then apply a
          // bounded cadence compensation calibrated against sampled 60 FPS
          // trajectories. Without it, one solver pass travels only about
          // 54-78% as far as the visible reference path.
          const restResponse =
            temporalDelta === delta
              ? 72.0 * delta * delta
              : Math.min(
                  MAXIMUM_SCROLL_REST_RESPONSE,
                  (1 - Math.pow(0.98, temporalDelta * 60)) *
                    (
                      1 +
                      SCROLL_RESPONSE_BOOST_PER_OMITTED_FRAME *
                        Math.max(0, temporalDelta * 60 - 1)
                    ),
                );
          const verticalMotionTime = time * 0.31;

          for (const skeleton of skeletons) {
            const points = skeleton.points;
            const rootOffset = 0;
            const tipOffset = CHAIN_LINKS * POINT_STRIDE;
            points[rootOffset + POINT_X] = skeleton.root.x;
            points[rootOffset + POINT_Y] = skeleton.root.y;
            points[rootOffset + POINT_Z] = skeleton.baseHeight;
            points[rootOffset + POINT_PREVIOUS_X] =
              points[rootOffset + POINT_X];
            points[rootOffset + POINT_PREVIOUS_Y] =
              points[rootOffset + POINT_Y];
            points[rootOffset + POINT_PREVIOUS_Z] =
              points[rootOffset + POINT_Z];

            let restX = points[rootOffset + POINT_X];
            let restY = points[rootOffset + POINT_Y];
            let restZ = points[rootOffset + POINT_Z];
            const timeSpeed = time * skeleton.speed;
            const timeSpeedSecondary = timeSpeed * 0.47;
            const timeSpeedDetail = timeSpeed * 1.53;
            const detailPhase = skeleton.phase * 0.31;
            const noiseABase =
              timeSpeed + skeleton.phase;
            const noiseABaseSine = Math.sin(noiseABase);
            const noiseABaseCosine = Math.cos(noiseABase);
            const noiseBBase =
              timeSpeedSecondary + skeleton.phase2;
            const noiseBBaseSine = Math.sin(noiseBBase);
            const noiseBBaseCosine = Math.cos(noiseBBase);
            const noiseCBase =
              timeSpeedDetail + detailPhase;
            const noiseCBaseSine = Math.sin(noiseCBase);
            const noiseCBaseCosine = Math.cos(noiseCBase);
            const verticalBase =
              verticalMotionTime + skeleton.phase2;
            const verticalBaseSine = Math.sin(verticalBase);
            const verticalBaseCosine = Math.cos(verticalBase);

            for (let joint = 1; joint <= CHAIN_LINKS; joint++) {
              const pointOffset = joint * POINT_STRIDE;
              const noiseA =
                noiseABaseSine * jointNoisePhaseACosines[joint] +
                noiseABaseCosine * jointNoisePhaseASines[joint];
              const noiseB =
                noiseBBaseSine * jointNoisePhaseBCosines[joint] +
                noiseBBaseCosine * jointNoisePhaseBSines[joint];
              const noiseC =
                noiseCBaseSine * jointNoisePhaseCCosines[joint] +
                noiseCBaseCosine * jointNoisePhaseCSines[joint];
              const spatialNoise =
                noiseA * 0.62 +
                noiseB * 0.27 +
                noiseC * 0.11;
              const restAngle =
                skeleton.baseAngle +
                skeleton.bend * jointBendFactors[joint] +
                spatialNoise *
                  skeleton.noiseStrength *
                  jointNoiseWeights[joint];
              const horizontalStep =
                skeleton.horizontalSteps[joint];
              const verticalStep =
                skeleton.verticalSteps[joint];
              restX += Math.cos(restAngle) * horizontalStep;
              restY += Math.sin(restAngle) * horizontalStep;
              restZ +=
                verticalStep *
                (
                  0.96 +
                  (
                    verticalBaseSine *
                      jointVerticalPhaseCosines[joint] +
                    verticalBaseCosine *
                      jointVerticalPhaseSines[joint]
                  ) *
                    0.035
                );

              const velocityX =
                (
                  points[pointOffset + POINT_X] -
                  points[pointOffset + POINT_PREVIOUS_X]
                ) *
                velocityDamping *
                incomingVelocityScale;
              const velocityY =
                (
                  points[pointOffset + POINT_Y] -
                  points[pointOffset + POINT_PREVIOUS_Y]
                ) *
                velocityDamping *
                incomingVelocityScale;
              const velocityZ =
                (
                  points[pointOffset + POINT_Z] -
                  points[pointOffset + POINT_PREVIOUS_Z]
                ) *
                velocityDamping *
                incomingVelocityScale;
              points[pointOffset + POINT_PREVIOUS_X] =
                points[pointOffset + POINT_X];
              points[pointOffset + POINT_PREVIOUS_Y] =
                points[pointOffset + POINT_Y];
              points[pointOffset + POINT_PREVIOUS_Z] =
                points[pointOffset + POINT_Z];
              points[pointOffset + POINT_X] +=
                velocityX +
                (restX - points[pointOffset + POINT_X]) * restResponse;
              points[pointOffset + POINT_Y] +=
                velocityY +
                (restY - points[pointOffset + POINT_Y]) * restResponse;
              points[pointOffset + POINT_Z] +=
                velocityZ +
                (restZ - points[pointOffset + POINT_Z]) * restResponse;
            }

            const tipDistance = length2(
              pointerWorldX - points[tipOffset + POINT_X],
              pointerWorldY - points[tipOffset + POINT_Y],
            );
            const normalizedDistance = clamp(
              tipDistance /
                (
                  skeleton.projectedAttractionRadius *
                  pointerInteraction.radiusMultiplier
                ),
              0,
              1,
            );
            const distanceFalloff = 1 - normalizedDistance;
            const forceDirection =
              pointerInteraction.direction || 1;
            let pointerForce =
              pointer.energy *
              distanceFalloff *
              distanceFalloff *
              pointerInteraction.forceMultiplier *
              forceDirection;
            const prePressHoverForce =
              prePressHoverForceCaps[skeleton.index];
            if (
              heldAttractionBlend < 1 &&
              prePressHoverForce > 0.01
            ) {
              const heldAttractionCap =
                prePressHoverForce *
                pointerInteraction.forceMultiplier;
              if (pointerForce > heldAttractionCap) {
                pointerForce =
                  heldAttractionCap +
                  (pointerForce - heldAttractionCap) *
                    heldAttractionBlend;
              }
            }
            if (
              postReleaseAttractionBlend < 1 &&
              pointerForce > prePressHoverForceCaps[skeleton.index]
            ) {
              const cappedPointerForce =
                prePressHoverForceCaps[skeleton.index];
              pointerForce =
                cappedPointerForce +
                (pointerForce - cappedPointerForce) *
                  postReleaseAttractionBlend;
            }
            if (collectDiagnostics) {
              const forceMagnitude = Math.abs(pointerForce);
              if (forceMagnitude > 0.01) {
                diagnostics.activeTips += 1;
              }
              diagnostics.maximumAttraction = Math.max(
                diagnostics.maximumAttraction,
                forceMagnitude,
              );
            }
            const surfaceDistance =
              points[tipOffset + POINT_Z] - skeleton.baseHeight;
            const repulsion = clamp(
              1 - surfaceDistance / skeleton.tipClearance,
              0,
              1,
            );
            points[tipOffset + POINT_Z] +=
              repulsion * repulsion * temporalDelta * 0.160;

            let completedPbdIterations = 0;
            let pbdExitedEarly = false;
            for (let iteration = 0; iteration < 8; iteration++) {
              completedPbdIterations = iteration + 1;
              let constraintsWithinTolerance =
                pbdEarlyExitEnabled &&
                completedPbdIterations >= MIN_PBD_ITERATIONS;
              let tipHeightAdjusted = false;
              points[rootOffset + POINT_X] = skeleton.root.x;
              points[rootOffset + POINT_Y] = skeleton.root.y;
              points[rootOffset + POINT_Z] = skeleton.baseHeight;

              for (let joint = 0; joint < CHAIN_LINKS; joint++) {
                const pointAOffset = joint * POINT_STRIDE;
                const pointBOffset = pointAOffset + POINT_STRIDE;
                const dx =
                  points[pointBOffset + POINT_X] -
                  points[pointAOffset + POINT_X];
                const dy =
                  points[pointBOffset + POINT_Y] -
                  points[pointAOffset + POINT_Y];
                const dz =
                  points[pointBOffset + POINT_Z] -
                  points[pointAOffset + POINT_Z];
                const distance = Math.max(
                  0.000001,
                  length3(dx, dy, dz),
                );
                const correction =
                  (distance - skeleton.linkLength) / distance;
                if (
                  constraintsWithinTolerance &&
                  Math.abs(distance - skeleton.linkLength) >
                    solverErrorTolerance
                ) {
                  constraintsWithinTolerance = false;
                }

                if (joint === 0) {
                  points[pointBOffset + POINT_X] -= dx * correction;
                  points[pointBOffset + POINT_Y] -= dy * correction;
                  points[pointBOffset + POINT_Z] -= dz * correction;
                } else {
                  const weightA = 0.48;
                  const weightB = 0.52;
                  points[pointAOffset + POINT_X] +=
                    dx * correction * weightA;
                  points[pointAOffset + POINT_Y] +=
                    dy * correction * weightA;
                  points[pointAOffset + POINT_Z] +=
                    dz * correction * weightA;
                  points[pointBOffset + POINT_X] -=
                    dx * correction * weightB;
                  points[pointBOffset + POINT_Y] -=
                    dy * correction * weightB;
                  points[pointBOffset + POINT_Z] -=
                    dz * correction * weightB;
                }
              }

              if (
                points[tipOffset + POINT_Z] <
                skeleton.minimumTipHeight
              ) {
                tipHeightAdjusted = true;
                points[tipOffset + POINT_Z] +=
                  (
                    skeleton.minimumTipHeight -
                    points[tipOffset + POINT_Z]
                  ) *
                    0.28;
              }

              if (
                constraintsWithinTolerance &&
                !tipHeightAdjusted
              ) {
                pbdExitedEarly = true;
                break;
              }
            }
            if (interactionDiagnostics) {
              solverDiagnostics.pbdChains += 1;
              solverDiagnostics.pbdIterations +=
                completedPbdIterations;
              if (pbdExitedEarly) {
                solverDiagnostics.pbdEarlyExits += 1;
              }
            }

            solveChainTowardPointer(
              skeleton,
              pointerForce,
              temporalDelta,
              pointerWorldX,
              pointerWorldY,
              solverPixelScale,
            );

            if (collectDiagnostics) {
              const forceMagnitude = Math.abs(pointerForce);
              diagnostics.maximumRestDisplacement = Math.max(
                diagnostics.maximumRestDisplacement,
                length3(
                  (points[tipOffset + POINT_X] - restX) /
                    Math.max(0.001, surfaceAspect),
                  points[tipOffset + POINT_Y] - restY,
                  points[tipOffset + POINT_Z] - restZ,
                ),
              );
              const finalProjectedTipX =
                points[tipOffset + POINT_X] / surfaceAspect;
              const finalProjectedTipY =
                points[tipOffset + POINT_Y];
              const cursorDistance = length2(
                pointerWorldX - points[tipOffset + POINT_X],
                pointerWorldY - points[tipOffset + POINT_Y],
              );
              if (skeleton.grabbed) {
                diagnostics.maximumGrabberError = Math.max(
                  diagnostics.maximumGrabberError,
                  cursorDistance,
                );
              }
              if (forceMagnitude > 0.48) {
                diagnostics.strongTipCount += 1;
                diagnostics.strongTipX += finalProjectedTipX;
                diagnostics.strongTipY += finalProjectedTipY;
              }
              if (
                forceMagnitude > 0.01 ||
                skeleton.grabbed
              ) {
                if (
                  cursorDistance <
                  diagnostics.minimumCursorDistance
                ) {
                  diagnostics.minimumCursorDistance =
                    cursorDistance;
                  diagnostics.closestTipX =
                    finalProjectedTipX;
                  diagnostics.closestTipY =
                    finalProjectedTipY;
                }
              }
              diagnostics.minimumTipClearance = Math.min(
                diagnostics.minimumTipClearance,
                points[tipOffset + POINT_Z] - skeleton.baseHeight,
              );
            }

            let boundMinimumX = Infinity;
            let boundMinimumY = Infinity;
            let boundMaximumX = -Infinity;
            let boundMaximumY = -Infinity;
            for (let renderJoint = 0; renderJoint < RENDER_POINTS; renderJoint++) {
              const chainJoint =
                renderChainJoints[renderJoint];
              const pointOffset = chainJoint * POINT_STRIDE;
              const radius =
                skeleton.radius *
                renderRadiusScales[renderJoint];
              const offset =
                skeleton.pixelOffset + renderJoint * 4;
              skeletonPixels[offset] = points[pointOffset + POINT_X];
              skeletonPixels[offset + 1] =
                points[pointOffset + POINT_Y];
              skeletonPixels[offset + 2] =
                points[pointOffset + POINT_Z];
              skeletonPixels[offset + 3] = radius;

              const boundRadius =
                radius * renderBoundScales[renderJoint];
              boundMinimumX = Math.min(
                boundMinimumX,
                points[pointOffset + POINT_X] - boundRadius,
              );
              boundMinimumY = Math.min(
                boundMinimumY,
                points[pointOffset + POINT_Y] - boundRadius,
              );
              boundMaximumX = Math.max(
                boundMaximumX,
                points[pointOffset + POINT_X] + boundRadius,
              );
              boundMaximumY = Math.max(
                boundMaximumY,
                points[pointOffset + POINT_Y] + boundRadius,
              );
            }

            let touchedSkeletonCellCount = 0;
            if (spatialGridValid) {
              for (
                let renderSegment = 0;
                renderSegment < RENDER_POINTS - 1;
                renderSegment++
              ) {
                const pointAOffset =
                  renderChainJoints[renderSegment] * POINT_STRIDE;
                const pointBOffset =
                  renderChainJoints[renderSegment + 1] * POINT_STRIDE;
                const radiusA =
                  skeleton.radius *
                  renderRadiusScales[renderSegment];
                const radiusB =
                  skeleton.radius *
                  renderRadiusScales[renderSegment + 1];
                let segmentPadding =
                  Math.max(radiusA, radiusB) + 0.001;
                if (renderSegment === 0) {
                  segmentPadding = Math.max(
                    segmentPadding,
                    radiusA * 1.48 + 0.001,
                  );
                }
                const segmentMinimumCellX = clamp(
                  Math.floor(
                    (
                      (
                        Math.min(
                          points[pointAOffset + POINT_X],
                          points[pointBOffset + POINT_X],
                        ) -
                        segmentPadding
                      ) /
                      surfaceAspect
                    ) *
                      SPATIAL_GRID_COLUMNS,
                  ),
                  0,
                  SPATIAL_GRID_COLUMNS - 1,
                );
                const segmentMinimumCellY = clamp(
                  Math.floor(
                    (
                      Math.min(
                        points[pointAOffset + POINT_Y],
                        points[pointBOffset + POINT_Y],
                      ) -
                      segmentPadding
                    ) *
                      SPATIAL_GRID_ROWS,
                  ),
                  0,
                  SPATIAL_GRID_ROWS - 1,
                );
                const segmentMaximumCellX = clamp(
                  Math.floor(
                    (
                      (
                        Math.max(
                          points[pointAOffset + POINT_X],
                          points[pointBOffset + POINT_X],
                        ) +
                        segmentPadding
                      ) /
                      surfaceAspect
                    ) *
                      SPATIAL_GRID_COLUMNS,
                  ),
                  0,
                  SPATIAL_GRID_COLUMNS - 1,
                );
                const segmentMaximumCellY = clamp(
                  Math.floor(
                    (
                      Math.max(
                        points[pointAOffset + POINT_Y],
                        points[pointBOffset + POINT_Y],
                      ) +
                      segmentPadding
                    ) *
                      SPATIAL_GRID_ROWS,
                  ),
                  0,
                  SPATIAL_GRID_ROWS - 1,
                );
                const segmentBit = 1 << renderSegment;
                for (
                  let cellY = segmentMinimumCellY;
                  cellY <= segmentMaximumCellY;
                  cellY++
                ) {
                  for (
                    let cellX = segmentMinimumCellX;
                    cellX <= segmentMaximumCellX;
                    cellX++
                  ) {
                    const cellIndex =
                      cellY * SPATIAL_GRID_COLUMNS + cellX;
                    if (skeletonCellSegmentMasks[cellIndex] === 0) {
                      touchedSkeletonCells[
                        touchedSkeletonCellCount++
                      ] = cellIndex;
                    }
                    skeletonCellSegmentMasks[cellIndex] |=
                      segmentBit;
                  }
                }
              }
            }

            const boundCenterX = (boundMinimumX + boundMaximumX) * 0.5;
            const boundCenterY = (boundMinimumY + boundMaximumY) * 0.5;
            const skeletonBoundRadius =
              length2(
                boundMaximumX - boundMinimumX,
                boundMaximumY - boundMinimumY,
              ) *
                0.5 +
              0.035;
            const boundOffset = skeleton.boundOffset;
            skeletonBoundsPixels[boundOffset] = boundCenterX;
            skeletonBoundsPixels[boundOffset + 1] = boundCenterY;
            skeletonBoundsPixels[boundOffset + 2] =
              skeletonBoundRadius;
            skeletonBoundsPixels[boundOffset + 3] = 1;

            if (spatialGridValid) {
              for (
                let touchedCell = 0;
                touchedCell < touchedSkeletonCellCount;
                touchedCell++
              ) {
                const cellIndex =
                  touchedSkeletonCells[touchedCell];
                const segmentMask =
                  skeletonCellSegmentMasks[cellIndex];
                const cellLoad = spatialCountPixels[cellIndex];
                if (cellLoad >= MAX_SPATIAL_SKELETONS) {
                  spatialGridValid = false;
                  break;
                }
                spatialIndexPixels[
                  cellIndex * MAX_SPATIAL_SKELETONS + cellLoad
                ] = skeleton.index;
                spatialSegmentMaskPixels[
                  cellIndex * MAX_SPATIAL_SKELETONS + cellLoad
                ] = segmentMask;
                const nextCellLoad = cellLoad + 1;
                spatialCountPixels[cellIndex] = nextCellLoad;
                maximumSpatialCellLoad = Math.max(
                  maximumSpatialCellLoad,
                  nextCellLoad,
                );
              }
            }
            for (
              let touchedCell = 0;
              touchedCell < touchedSkeletonCellCount;
              touchedCell++
            ) {
              skeletonCellSegmentMasks[
                touchedSkeletonCells[touchedCell]
              ] = 0;
            }
          }

          if (interactionDiagnostics) {
            canvas.dataset.pbdChains = String(
              solverDiagnostics.pbdChains,
            );
            canvas.dataset.pbdIterations = String(
              solverDiagnostics.pbdIterations,
            );
            canvas.dataset.pbdAverageIterations = (
              solverDiagnostics.pbdIterations /
              Math.max(1, solverDiagnostics.pbdChains)
            ).toFixed(3);
            canvas.dataset.pbdEarlyExits = String(
              solverDiagnostics.pbdEarlyExits,
            );
            canvas.dataset.fabrikAttempts = String(
              solverDiagnostics.fabrikAttempts,
            );
            canvas.dataset.fabrikExactZeroSkips = String(
              solverDiagnostics.fabrikExactZeroSkips,
            );
            canvas.dataset.fabrikVisualSkips = String(
              solverDiagnostics.fabrikVisualSkips,
            );
            canvas.dataset.fabrikDirectSolves = String(
              solverDiagnostics.fabrikDirectSolves,
            );
            canvas.dataset.fabrikIterativeSolves = String(
              solverDiagnostics.fabrikIterativeSolves,
            );
            canvas.dataset.fabrikIterations = String(
              solverDiagnostics.fabrikIterations,
            );
            canvas.dataset.fabrikGrabbedSolves = String(
              solverDiagnostics.fabrikGrabbedSolves,
            );
            canvas.dataset.fabrikGrabbedIterations = String(
              solverDiagnostics.fabrikGrabbedIterations,
            );
            canvas.dataset.fabrikOrdinarySolves = String(
              solverDiagnostics.fabrikOrdinarySolves,
            );
            canvas.dataset.fabrikOrdinaryIterations = String(
              solverDiagnostics.fabrikOrdinaryIterations,
            );
            canvas.dataset.fabrikAverageIterations = (
              solverDiagnostics.fabrikIterations /
              Math.max(
                1,
                solverDiagnostics.fabrikIterativeSolves,
              )
            ).toFixed(3);
            canvas.dataset.fabrikEarlyExits = String(
              solverDiagnostics.fabrikEarlyExits,
            );
          }

          if (debugTargets) {
            const visible = pointer.inside ? "block" : "none";
            cursorMarker.style.display = visible;
            tipMarker.style.display = visible;
            cursorMarker.style.left = `${pointer.x * 100}%`;
            cursorMarker.style.top = `${pointer.y * 100}%`;
            tipMarker.style.left = `${diagnostics.closestTipX * 100}%`;
            tipMarker.style.top = `${diagnostics.closestTipY * 100}%`;
          }

          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, skeletonTexture);
          gl.texSubImage2D(
            gl.TEXTURE_2D,
            0,
            0,
            0,
            RENDER_POINTS,
            skeletonCount,
            gl.RGBA,
            gl.FLOAT,
            skeletonPixels,
          );
          gl.activeTexture(gl.TEXTURE2);
          gl.bindTexture(gl.TEXTURE_2D, skeletonBoundsTexture);
          gl.texSubImage2D(
            gl.TEXTURE_2D,
            0,
            0,
            0,
            1,
            skeletonCount,
            gl.RGBA,
            gl.FLOAT,
            skeletonBoundsPixels,
          );
          if (spatialGridValid) {
            gl.activeTexture(gl.TEXTURE3);
            gl.bindTexture(gl.TEXTURE_2D, spatialIndexTexture);
            gl.pixelStorei(
              gl.UNPACK_ROW_LENGTH,
              MAX_SPATIAL_SKELETONS,
            );
            gl.texSubImage2D(
              gl.TEXTURE_2D,
              0,
              0,
              0,
              maximumSpatialCellLoad,
              SPATIAL_CELL_COUNT,
              gl.RED_INTEGER,
              gl.UNSIGNED_SHORT,
              spatialIndexPixels,
            );
            gl.activeTexture(gl.TEXTURE5);
            gl.bindTexture(
              gl.TEXTURE_2D,
              spatialSegmentMaskTexture,
            );
            gl.texSubImage2D(
              gl.TEXTURE_2D,
              0,
              0,
              0,
              maximumSpatialCellLoad,
              SPATIAL_CELL_COUNT,
              gl.RED_INTEGER,
              gl.UNSIGNED_SHORT,
              spatialSegmentMaskPixels,
            );
            gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 0);
            gl.activeTexture(gl.TEXTURE4);
            gl.bindTexture(gl.TEXTURE_2D, spatialCountTexture);
            gl.texSubImage2D(
              gl.TEXTURE_2D,
              0,
              0,
              0,
              1,
              SPATIAL_CELL_COUNT,
              gl.RED_INTEGER,
              gl.UNSIGNED_SHORT,
              spatialCountPixels,
            );
          }
        }

        function bindTexture(unit, texture) {
          gl.activeTexture(gl.TEXTURE0 + unit);
          gl.bindTexture(gl.TEXTURE_2D, texture);
        }

        function renderFrame(time) {
          resize();
          const texelX = 1 / pixelWidth;
          const texelY = 1 / pixelHeight;

          gl.bindFramebuffer(gl.FRAMEBUFFER, renderTargets.surfaceFramebuffer);
          gl.viewport(0, 0, pixelWidth, pixelHeight);
          gl.clear(gl.COLOR_BUFFER_BIT);
          const activeSurfaceProgram = spatialGridValid
            ? surfaceProgram
            : fallbackSurfaceProgram;
          const activeSurfaceUniforms = spatialGridValid
            ? surfaceUniforms
            : fallbackSurfaceUniforms;
          gl.useProgram(activeSurfaceProgram);
          bindTexture(0, noiseTexture);
          bindTexture(1, skeletonTexture);
          bindTexture(2, skeletonBoundsTexture);
          bindTexture(3, spatialIndexTexture);
          bindTexture(4, spatialCountTexture);
          bindTexture(5, spatialSegmentMaskTexture);
          gl.uniform1i(
            activeSurfaceUniforms.useSpatialGrid,
            spatialGridValid ? 1 : 0,
          );
          gl.uniform1f(activeSurfaceUniforms.time, time);
          gl.bindVertexArray(surfaceVao);
          gl.drawElements(
            gl.TRIANGLES,
            surfaceIndexCount,
            gl.UNSIGNED_INT,
            0,
          );

          gl.bindVertexArray(fullscreenVao);
          gl.useProgram(scatterProgram);
          gl.uniform2f(scatterUniforms.texel, texelX, texelY);

          gl.bindFramebuffer(gl.FRAMEBUFFER, renderTargets.scatterFramebufferA);
          bindTexture(0, renderTargets.sharp);
          bindTexture(1, renderTargets.geometry);
          gl.uniform2f(scatterUniforms.direction, 1, 0);
          gl.uniform1f(scatterUniforms.pass, 0);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          gl.bindFramebuffer(gl.FRAMEBUFFER, renderTargets.scatterFramebufferB);
          bindTexture(0, renderTargets.scatterA);
          bindTexture(1, renderTargets.geometry);
          gl.uniform2f(scatterUniforms.direction, 0, 1);
          gl.uniform1f(scatterUniforms.pass, 1);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, pixelWidth, pixelHeight);
          gl.useProgram(compositeProgram);
          bindTexture(0, renderTargets.sharp);
          bindTexture(1, renderTargets.scatterB);
          bindTexture(2, renderTargets.geometry);
          gl.uniform2f(compositeUniforms.texel, texelX, texelY);
          gl.uniform2f(compositeUniforms.pointer, pointer.x, 1 - pointer.y);
          gl.uniform1f(compositeUniforms.pointerInside, pointer.energy);
          gl.uniform1f(compositeUniforms.time, time);
          gl.uniform3f(
            compositeUniforms.substrate,
            substrateColor[0],
            substrateColor[1],
            substrateColor[2],
          );
          gl.uniform2f(
            compositeUniforms.viewport,
            pixelWidth,
            pixelHeight,
          );
          gl.uniform1f(
            compositeUniforms.cornerRadius,
            32 *
              Math.min(
                pixelWidth / Math.max(1, canvasRect.width),
                pixelHeight / Math.max(1, canvasRect.height),
              ),
          );
          gl.uniform1f(
            compositeUniforms.useTransparentSubstrate,
            activeTheme === "light" ? 1 : 0,
          );
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        const gpuTimerQueryStates = gpuTimingEnabled
          ? new Uint8Array(GPU_TIMING_QUERY_POOL_SIZE)
          : null;
        const gpuTimerQueryInvalid = gpuTimingEnabled
          ? new Uint8Array(GPU_TIMING_QUERY_POOL_SIZE)
          : null;
        let gpuTimingRenderedFrames = 0;
        let gpuTimingQueryCursor = 0;
        let gpuTimingSampleCount = 0;
        let gpuTimingMeanMilliseconds = 0;
        let gpuTimingPendingQueries = 0;
        let gpuTimingDroppedSamples = 0;
        let gpuTimingDisjointCount = 0;
        let gpuTimingWasDisjoint = false;

        function publishGpuTimingCounters() {
          canvas.dataset.gpuTimingSamples = String(
            gpuTimingSampleCount,
          );
          canvas.dataset.gpuTimingPending = String(
            gpuTimingPendingQueries,
          );
          canvas.dataset.gpuTimingDroppedSamples = String(
            gpuTimingDroppedSamples,
          );
          canvas.dataset.gpuTimingDisjointCount = String(
            gpuTimingDisjointCount,
          );
        }

        function pollGpuTimerQueries(checkDisjoint = false) {
          if (gpuTimingPendingQueries === 0 && !checkDisjoint) {
            return false;
          }
          const disjoint = Boolean(
            gl.getParameter(gpuTimerExtension.GPU_DISJOINT_EXT),
          );
          if (disjoint) {
            if (!gpuTimingWasDisjoint) {
              gpuTimingDisjointCount += 1;
            }
            for (
              let queryIndex = 0;
              queryIndex < gpuTimerQueries.length;
              queryIndex += 1
            ) {
              if (gpuTimerQueryStates[queryIndex] !== 0) {
                gpuTimerQueryInvalid[queryIndex] = 1;
              }
            }
          }
          gpuTimingWasDisjoint = disjoint;

          for (
            let queryIndex = 0;
            queryIndex < gpuTimerQueries.length;
            queryIndex += 1
          ) {
            if (gpuTimerQueryStates[queryIndex] === 0) {
              continue;
            }
            const query = gpuTimerQueries[queryIndex];
            if (!gl.getQueryParameter(query, gl.QUERY_RESULT_AVAILABLE)) {
              continue;
            }
            if (!gpuTimerQueryInvalid[queryIndex] && !disjoint) {
              const elapsedNanoseconds = Number(
                gl.getQueryParameter(query, gl.QUERY_RESULT),
              );
              const elapsedMilliseconds = elapsedNanoseconds / 1e6;
              gpuTimingSampleCount += 1;
              gpuTimingMeanMilliseconds +=
                (elapsedMilliseconds - gpuTimingMeanMilliseconds) /
                gpuTimingSampleCount;
              canvas.dataset.gpuMs = elapsedMilliseconds.toFixed(3);
              canvas.dataset.gpuMsAverage =
                gpuTimingMeanMilliseconds.toFixed(3);
            }
            gpuTimerQueryStates[queryIndex] = 0;
            gpuTimerQueryInvalid[queryIndex] = 0;
            gpuTimingPendingQueries -= 1;
          }
          publishGpuTimingCounters();
          return disjoint;
        }

        function renderFrameWithGpuTiming(time) {
          const shouldSample =
            gpuTimingRenderedFrames % GPU_TIMING_SAMPLE_INTERVAL === 0;
          gpuTimingRenderedFrames += 1;
          const disjoint = pollGpuTimerQueries(shouldSample);
          if (!shouldSample) {
            renderFrame(time);
            return;
          }
          if (disjoint) {
            renderFrame(time);
            return;
          }

          let availableQueryIndex = -1;
          for (
            let queryOffset = 0;
            queryOffset < gpuTimerQueries.length;
            queryOffset += 1
          ) {
            const queryIndex =
              (gpuTimingQueryCursor + queryOffset) %
              gpuTimerQueries.length;
            if (gpuTimerQueryStates[queryIndex] === 0) {
              availableQueryIndex = queryIndex;
              break;
            }
          }
          if (availableQueryIndex < 0) {
            gpuTimingDroppedSamples += 1;
            publishGpuTimingCounters();
            renderFrame(time);
            return;
          }

          gpuTimingQueryCursor =
            (availableQueryIndex + 1) % gpuTimerQueries.length;
          gl.beginQuery(
            gpuTimerExtension.TIME_ELAPSED_EXT,
            gpuTimerQueries[availableQueryIndex],
          );
          try {
            renderFrame(time);
          } finally {
            gl.endQuery(gpuTimerExtension.TIME_ELAPSED_EXT);
            gpuTimerQueryStates[availableQueryIndex] = 1;
            gpuTimingPendingQueries += 1;
            publishGpuTimingCounters();
          }
        }

        if (gpuTimingEnabled) {
          publishGpuTimingCounters();
        }
        const render = gpuTimingEnabled
          ? renderFrameWithGpuTiming
          : renderFrame;

        let lastTime =
          useManualAnimationFrame &&
          Number.isFinite(requestedAnimationTimeOrigin)
            ? requestedAnimationTimeOrigin
            : performance.now() * 0.001;
        let smoothedTime = lastTime;
        function advanceAnimationClock(elapsedSeconds) {
          smoothedTime +=
            elapsedSeconds * (prefersReducedMotion ? 0.22 : 1);
        }
        let diagnosticStart = lastTime;
        let diagnosticFrames = 0;
        let immediateFrameInProgress = false;
        let skipRedundantAnimationFrame = false;
        let lastPhysicsDuration = 0;
        let lastRenderSubmissionDuration = 0;
        let physicsFrameId = 0;
        let previousPhysicsTemporalDelta = 1 / 60;
        let scrollExitVelocityStabilizationFrames = 0;
        canvas.dataset.scrollExitVelocityScale = "1.000";
        function velocityScaleForPhysicsStep(delta, temporalDelta) {
          const returnsToOrdinaryCadence =
            temporalDelta <= delta + 0.000001 &&
            previousPhysicsTemporalDelta > delta + 0.000001;
          let velocityScale = 1;
          if (returnsToOrdinaryCadence) {
            const representedFrameCount =
              previousPhysicsTemporalDelta / delta;
            // Verlet stores displacement per solver step, not velocity per
            // second. A compensated scroll step may represent 2-5 ordinary
            // frames, so carrying its raw displacement into 60 FPS creates a
            // visible acceleration burst. The calibrated 1.8 exponent removes
            // that stored long-step energy without zeroing motion outright.
            velocityScale = Math.min(
              1,
              Math.pow(1 / representedFrameCount, 1.8),
            );
            // Rest attraction in the first ordinary frames can recreate some
            // of the removed displacement. Continue mild damping only for the
            // excess represented frames; fast 30 FPS needs no continuation.
            scrollExitVelocityStabilizationFrames = Math.max(
              0,
              Math.ceil(representedFrameCount) - 2,
            );
          } else if (
            temporalDelta <= delta + 0.000001 &&
            scrollExitVelocityStabilizationFrames > 0
          ) {
            velocityScale = 0.8;
            scrollExitVelocityStabilizationFrames -= 1;
          } else if (temporalDelta > delta + 0.000001) {
            scrollExitVelocityStabilizationFrames = 0;
          }
          previousPhysicsTemporalDelta = temporalDelta;
          if (velocityScale < 1) {
            canvas.dataset.scrollExitVelocityScale =
              velocityScale.toFixed(3);
          }
          return velocityScale;
        }
        // Passive scroll animation keeps the production render path and varies
        // only cadence. Static profiles avoid allocations in the RAF loop; the
        // resolver below chooses among them from smoothed cadence and frame cost.
        const scrollAnimationBudgets = {
          fast: {
            name: "fast",
            intervalMilliseconds: 1000 / 30,
          },
          balanced: {
            name: "balanced",
            intervalMilliseconds: 50,
          },
          conservative: {
            name: "conservative",
            intervalMilliseconds: 1000 / 12,
          },
          frozen: {
            name: "frozen",
            intervalMilliseconds: Infinity,
          },
        };
        const minimumScrollBudgetCadenceSamples = 3;
        const scrollBudgetAverageWeight = 0.2;
        const scrollBudgetDeadlineToleranceMilliseconds = 0.01;
        const maximumSkippedAnimationClockStepSeconds = 0.05;
        let previousAnimationFrameAtMilliseconds = null;
        let animationFrameCadenceAverageMilliseconds = 0;
        let animationFrameCadenceSamples = 0;
        let completeFrameCostAverageMilliseconds = 0;
        let completeFrameCostSamples = 0;
        let scrollAnimationLastFrameAtMilliseconds = -Infinity;
        let deferredScrollPhysicsSeconds = 0;
        let scrollSuppressionObservedByFrame = false;
        let scrollBudgetSignalOverride = null;
        let reportedScrollAnimationTier = null;
        let reportedScrollAnimationInterval = null;

        function recordAnimationFrameCadence(
          nowMilliseconds,
          resetSample,
        ) {
          if (
            resetSample ||
            previousAnimationFrameAtMilliseconds === null
          ) {
            previousAnimationFrameAtMilliseconds = nowMilliseconds;
            return;
          }
          const cadenceMilliseconds =
            nowMilliseconds - previousAnimationFrameAtMilliseconds;
          previousAnimationFrameAtMilliseconds = nowMilliseconds;
          if (
            cadenceMilliseconds <= 0 ||
            cadenceMilliseconds > 250
          ) {
            return;
          }
          if (animationFrameCadenceSamples === 0) {
            animationFrameCadenceAverageMilliseconds =
              cadenceMilliseconds;
          } else {
            animationFrameCadenceAverageMilliseconds +=
              (
                cadenceMilliseconds -
                animationFrameCadenceAverageMilliseconds
              ) * scrollBudgetAverageWeight;
          }
          animationFrameCadenceSamples += 1;
        }

        function recordCompleteFrameCost() {
          const costMilliseconds =
            lastPhysicsDuration + lastRenderSubmissionDuration;
          if (!Number.isFinite(costMilliseconds) || costMilliseconds < 0) {
            return;
          }
          if (completeFrameCostSamples === 0) {
            completeFrameCostAverageMilliseconds = costMilliseconds;
          } else {
            completeFrameCostAverageMilliseconds +=
              (costMilliseconds - completeFrameCostAverageMilliseconds) *
              scrollBudgetAverageWeight;
          }
          completeFrameCostSamples += 1;
        }

        function resolveScrollAnimationBudget() {
          const usesOverride = scrollBudgetSignalOverride !== null;
          const cadenceMilliseconds = usesOverride
            ? scrollBudgetSignalOverride.cadenceMilliseconds
            : animationFrameCadenceAverageMilliseconds;
          const measuredFrameCostMilliseconds = usesOverride
            ? scrollBudgetSignalOverride.frameCostMilliseconds
            : completeFrameCostAverageMilliseconds;
          const estimatedFrameCostMilliseconds = usesOverride
            ? measuredFrameCostMilliseconds
            : Math.max(
                measuredFrameCostMilliseconds,
                gpuTimingSampleCount > 0
                  ? gpuTimingMeanMilliseconds
                  : 0,
              );
          if (
            !usesOverride &&
            (
              animationFrameCadenceSamples <
                minimumScrollBudgetCadenceSamples ||
              completeFrameCostSamples < 1
            )
          ) {
            return scrollAnimationBudgets.conservative;
          }
          if (
            cadenceMilliseconds > 45 ||
            estimatedFrameCostMilliseconds > 20
          ) {
            return scrollAnimationBudgets.frozen;
          }
          if (
            cadenceMilliseconds > 28 ||
            estimatedFrameCostMilliseconds > 12
          ) {
            return scrollAnimationBudgets.conservative;
          }
          if (
            cadenceMilliseconds > 20 ||
            estimatedFrameCostMilliseconds > 7
          ) {
            return scrollAnimationBudgets.balanced;
          }
          return scrollAnimationBudgets.fast;
        }

        function publishScrollAnimationBudget(budget) {
          const tier = scrollRenderingSuppressed
            ? budget.name
            : "inactive";
          const interval = scrollRenderingSuppressed
            ? Number.isFinite(budget.intervalMilliseconds)
              ? budget.intervalMilliseconds.toFixed(1)
              : "paused"
            : "0.0";
          if (reportedScrollAnimationTier !== tier) {
            reportedScrollAnimationTier = tier;
            canvas.dataset.scrollAnimationTier = tier;
          }
          if (reportedScrollAnimationInterval !== interval) {
            reportedScrollAnimationInterval = interval;
            canvas.dataset.scrollAnimationIntervalMs = interval;
          }
        }

        function recordRenderedInteraction() {
          renderedFrameId += 1;
          canvas.dataset.renderedFrameId =
            String(renderedFrameId);
          canvas.dataset.renderedInteractionPhase =
            renderedInteractionPhase;
          canvas.dataset.renderedPointerPressed =
            pointer.pressed ? "true" : "false";
          canvas.dataset.renderedMaximumRestDisplacement =
            diagnostics.maximumRestDisplacement.toFixed(5);
        }

        function runImmediateReleaseFrame(minimumDelta = 0) {
          if (immediateFrameInProgress) {
            return;
          }
          immediateFrameInProgress = true;
          const now = performance.now() * 0.001;
          const elapsed = Math.max(0.001, now - lastTime);
          const delta = Math.min(
            0.033,
            Math.max(minimumDelta, 1 / 90, elapsed),
          );
          lastTime = now;
          advanceAnimationClock(delta);
          const physicsStartedAt = performance.now();
          const incomingVelocityScale =
            velocityScaleForPhysicsStep(delta, delta);
          updateSkeletons(
            smoothedTime,
            delta,
            now,
            delta,
            incomingVelocityScale,
          );
          lastPhysicsDuration =
            performance.now() - physicsStartedAt;
          const renderStartedAt = performance.now();
          render(smoothedTime);
          recordRenderedInteraction();
          lastRenderSubmissionDuration =
            performance.now() - renderStartedAt;
          recordCompleteFrameCost();
          if (scrollRenderingSuppressed) {
            scrollAnimationLastFrameAtMilliseconds = now * 1000;
          }
          skipRedundantAnimationFrame = true;
          immediateFrameInProgress = false;
        }

        function frame(nowMilliseconds) {
          animationFrameRequest = null;
          const now = nowMilliseconds * 0.001;
          if (!runtimeVisible || document.hidden) {
            diagnosticStart = now;
            previousAnimationFrameAtMilliseconds = null;
            canvas.dataset.runtimePaused = "true";
            syncAnimationLoopState();
            return;
          }
          const resetsCadenceSample = resetAnimationClockOnNextFrame;
          if (resetAnimationClockOnNextFrame) {
            lastTime = now - 1 / 60;
            diagnosticStart = now;
            skipRedundantAnimationFrame = false;
            resetAnimationClockOnNextFrame = false;
          }
          recordAnimationFrameCadence(
            nowMilliseconds,
            resetsCadenceSample,
          );
          canvas.dataset.runtimePaused = "false";
          // A prewarmed embedded runtime owns allocated WebGL resources but no
          // completed texture while it remains outside the viewport. If its
          // first visible state arrives during an active scroll, allow exactly
          // one ordinary physics-and-render frame before applying the scroll
          // hold. Later scroll ticks see a nonzero renderedFrameId and keep the
          // completed full-quality texture unchanged until the next adaptive
          // budget deadline.
          const needsInitialPresentationFrame = renderedFrameId === 0;
          const passiveScrollAnimation =
            scrollRenderingSuppressed &&
            !pointer.pressed &&
            !pointer.impulsePending;
          if (
            scrollRenderingSuppressed !==
            scrollSuppressionObservedByFrame
          ) {
            scrollSuppressionObservedByFrame =
              scrollRenderingSuppressed;
            if (scrollRenderingSuppressed) {
              scrollAnimationLastFrameAtMilliseconds = nowMilliseconds;
            } else {
              deferredScrollPhysicsSeconds = 0;
            }
          }
          let budgetPermitsScrollAnimationFrame = false;
          let scrollAnimationBudget =
            scrollAnimationBudgets.conservative;
          if (scrollRenderingSuppressed) {
            scrollAnimationBudget = resolveScrollAnimationBudget();
            publishScrollAnimationBudget(scrollAnimationBudget);
            budgetPermitsScrollAnimationFrame =
              passiveScrollAnimation &&
              Number.isFinite(
                scrollAnimationBudget.intervalMilliseconds,
              ) &&
              nowMilliseconds -
                  scrollAnimationLastFrameAtMilliseconds +
                  scrollBudgetDeadlineToleranceMilliseconds >=
                scrollAnimationBudget.intervalMilliseconds;
          } else {
            publishScrollAnimationBudget(
              scrollAnimationBudgets.conservative,
            );
          }
          if (
            passiveScrollAnimation &&
            !needsInitialPresentationFrame &&
            !budgetPermitsScrollAnimationFrame
          ) {
            // The last complete full-resolution texture is already held on
            // screen between budgeted scroll updates. Advancing hundreds of
            // Verlet chains before the adaptive deadline only competes with
            // the parent page's scroll frames. Updating the clock discards
            // missed physics/render work instead of accumulating a catch-up
            // step. The lightweight animation clock still follows ordinary
            // RAF time: otherwise a 20 FPS budget would make the tentacles
            // move at one third speed, and 8 FPS would look almost frozen.
            // The 50 ms bound covers every finite cadence tier (up to 45 ms)
            // but intentionally discards a genuine long-task gap
            // rather than producing a sudden phase jump after a stalled page.
            const skippedAnimationSeconds = Math.min(
              maximumSkippedAnimationClockStepSeconds,
              Math.max(0, now - lastTime),
            );
            advanceAnimationClock(skippedAnimationSeconds);
            deferredScrollPhysicsSeconds = Number.isFinite(
              scrollAnimationBudget.intervalMilliseconds,
            )
              ? Math.min(
                  0.125,
                  deferredScrollPhysicsSeconds +
                    skippedAnimationSeconds,
                )
              : 0;
            lastTime = now;
            diagnosticStart = now;
            skipRedundantAnimationFrame = false;
            canvas.dataset.scrollPhysics = "suppressed";
            scheduleFrame();
            return;
          }
          canvas.dataset.scrollPhysics = "active";
          if (
            skipRedundantAnimationFrame &&
            now - lastTime < 0.008
          ) {
            skipRedundantAnimationFrame = false;
            scheduleFrame();
            return;
          }
          skipRedundantAnimationFrame = false;
          const previousFrameTime = lastTime;
          const frameDelta = Math.min(
            0.033,
            Math.max(0.001, now - lastTime),
          );
          const elapsedSincePreviousRaf = Math.max(
            0.001,
            now - lastTime,
          );
          lastTime = now;
          const submitsInitialImpulse = pointer.impulsePending;
          const inputStartedAt = pointer.impulseStartedAt;
          const delta = submitsInitialImpulse
            ? Math.min(
                0.033,
                Math.max(
                  1 / 90,
                  inputStartedAt - previousFrameTime,
                ),
              )
            : frameDelta;
          const scrollAnimationDelta =
            passiveScrollAnimation &&
            budgetPermitsScrollAnimationFrame
              ? Math.min(
                  maximumSkippedAnimationClockStepSeconds,
                  elapsedSincePreviousRaf,
                )
              : delta;
          const temporalDelta =
            passiveScrollAnimation &&
            budgetPermitsScrollAnimationFrame
              ? Math.min(
                  0.125,
                  deferredScrollPhysicsSeconds +
                    scrollAnimationDelta,
                )
              : delta;
          deferredScrollPhysicsSeconds = 0;
          canvas.dataset.physicsSubsteps = "1";
          canvas.dataset.physicsElapsedMs =
            (temporalDelta * 1000).toFixed(1);
          if (submitsInitialImpulse) {
            canvas.dataset.impulsePhysicsDeltaMs =
              (delta * 1000).toFixed(1);
            canvas.dataset.inputToImpulseRafStartMs =
              (
                performance.now() -
                inputStartedAt * 1000
              ).toFixed(1);
          }
          const physicsStartedAt = performance.now();
          advanceAnimationClock(scrollAnimationDelta);
          const incomingVelocityScale =
            velocityScaleForPhysicsStep(delta, temporalDelta);
          updateSkeletons(
            smoothedTime,
            delta,
            now,
            temporalDelta,
            incomingVelocityScale,
          );
          physicsFrameId += 1;
          canvas.dataset.physicsFrameId = String(physicsFrameId);
          if (canvas.dataset.pointerInteractionPhase === "impulse") {
            const submittedImpulseFrames = Number.parseInt(
              canvas.dataset.animationImpulseFramesSincePress || "0",
              10,
            );
            canvas.dataset.animationImpulseFramesSincePress =
              String(submittedImpulseFrames + 1);
          }
          lastPhysicsDuration =
            performance.now() - physicsStartedAt;
          if (
            !scrollRenderingSuppressed ||
            pointer.pressed ||
            submitsInitialImpulse ||
            needsInitialPresentationFrame ||
            budgetPermitsScrollAnimationFrame
          ) {
            const renderStartedAt = performance.now();
            render(smoothedTime);
            recordRenderedInteraction();
            lastRenderSubmissionDuration =
              performance.now() - renderStartedAt;
            recordCompleteFrameCost();
            if (scrollRenderingSuppressed) {
              scrollAnimationLastFrameAtMilliseconds = nowMilliseconds;
            }
            if (submitsInitialImpulse) {
              canvas.dataset.inputToImpulseSubmissionMs =
                (
                  performance.now() -
                  inputStartedAt * 1000
                ).toFixed(1);
            }
            diagnosticFrames += 1;
          }
          if (now - diagnosticStart >= 1) {
            diagnostics.fps = diagnosticFrames / (now - diagnosticStart);
            canvas.dataset.fps = diagnostics.fps.toFixed(0);
            canvas.dataset.linksPerTentacle = String(CHAIN_LINKS);
            canvas.dataset.tentacles = String(skeletons.length);
            canvas.dataset.spatialAcceleration =
              spatialGridValid ? "enabled" : "fallback";
            canvas.dataset.surfaceShaderPath =
              spatialGridValid ? "fast-spatial" : "full-fallback";
            canvas.dataset.spatialCandidateCapacity = String(
              MAX_SPATIAL_SKELETONS,
            );
            canvas.dataset.surfaceGrid = `${gridColumns}x${gridRows}`;
            canvas.dataset.maximumSpatialCellLoad = String(
              maximumSpatialCellLoad,
            );
            canvas.dataset.activeTips = String(diagnostics.activeTips);
            canvas.dataset.maximumAttraction =
              diagnostics.maximumAttraction.toFixed(3);
            canvas.dataset.minimumTipClearance =
              diagnostics.minimumTipClearance.toFixed(3);
            canvas.dataset.minimumCursorDistance =
              diagnostics.minimumCursorDistance.toFixed(4);
            canvas.dataset.motionSpeedMultiplier = String(
              MOTION_SPEED_MULTIPLIER,
            );
            canvas.dataset.pointerX = pointer.x.toFixed(4);
            canvas.dataset.pointerY = pointer.y.toFixed(4);
            canvas.dataset.closestTipX =
              diagnostics.closestTipX.toFixed(4);
            canvas.dataset.closestTipY =
              diagnostics.closestTipY.toFixed(4);
            canvas.dataset.strongTipCount =
              String(diagnostics.strongTipCount);
            canvas.dataset.strongTipX =
              (
                diagnostics.strongTipX /
                Math.max(1, diagnostics.strongTipCount)
              ).toFixed(4);
            canvas.dataset.strongTipY =
              (
                diagnostics.strongTipY /
                Math.max(1, diagnostics.strongTipCount)
              ).toFixed(4);
            canvas.dataset.grabberCount =
              String(diagnostics.grabberCount);
            canvas.dataset.maximumGrabberError =
              diagnostics.maximumGrabberError.toFixed(4);
            canvas.dataset.physicsMs =
              lastPhysicsDuration.toFixed(1);
            canvas.dataset.renderSubmissionMs =
              lastRenderSubmissionDuration.toFixed(1);
            diagnosticStart = now;
            diagnosticFrames = 0;
          }
          scheduleFrame();
        }

        function runtimeCanAnimate() {
          return runtimeVisible && !document.hidden;
        }

        function cancelScheduledAnimationFrame() {
          if (animationFrameRequest !== null) {
            cancelAnimationFrame(animationFrameRequest);
            animationFrameRequest = null;
          }
          if (reportedAnimationFrameScheduled !== false) {
            reportedAnimationFrameScheduled = false;
            canvas.dataset.animationFrameScheduled = "false";
          }
        }

        function syncAnimationLoopState() {
          const canAnimate = runtimeCanAnimate();
          canvas.dataset.runtimePaused = canAnimate ? "false" : "true";
          if (useManualAnimationFrame) {
            animationRuntimeActive = canAnimate;
            canvas.dataset.animationLoop = "manual";
            cancelScheduledAnimationFrame();
            return;
          }
          if (!canAnimate) {
            if (animationRuntimeActive) {
              resetAnimationClockOnNextFrame = true;
            }
            animationRuntimeActive = false;
            canvas.dataset.animationLoop = "paused";
            cancelScheduledAnimationFrame();
            return;
          }
          if (!animationRuntimeActive) {
            resetAnimationClockOnNextFrame = true;
          }
          animationRuntimeActive = true;
          canvas.dataset.animationLoop = "running";
          scheduleFrame();
        }

        function scheduleFrame() {
          if (
            useManualAnimationFrame ||
            !animationLoopReady ||
            !runtimeCanAnimate() ||
            animationFrameRequest !== null
          ) {
            return;
          }
          animationFrameRequest = requestAnimationFrame(frame);
          if (reportedAnimationFrameScheduled !== true) {
            reportedAnimationFrameScheduled = true;
            canvas.dataset.animationFrameScheduled = "true";
          }
        }

        updateSkeletons(smoothedTime, 1 / 60, smoothedTime);
        resize();
        animationLoopReady = true;
        if (useManualAnimationFrame) {
          window.__mutaTentaclesDebugSpatialGridRows =
            SPATIAL_GRID_ROWS;
          window.__mutaTentaclesDebugFrameAfter = (
            elapsedMilliseconds,
          ) => {
            frame(
              (lastTime + elapsedMilliseconds * 0.001) *
              1000,
            );
          };
          window.__mutaTentaclesDebugSetScrollBudgetSignals = (
            signals,
          ) => {
            const cadenceMilliseconds = Number(signals?.cadenceMs);
            const frameCostMilliseconds = Number(signals?.frameCostMs);
            if (
              !Number.isFinite(cadenceMilliseconds) ||
              cadenceMilliseconds <= 0 ||
              !Number.isFinite(frameCostMilliseconds) ||
              frameCostMilliseconds < 0
            ) {
              throw new TypeError(
                "Scroll budget signals must be finite milliseconds.",
              );
            }
            scrollBudgetSignalOverride = {
              cadenceMilliseconds,
              frameCostMilliseconds,
            };
          };
          window.__mutaTentaclesDebugAnimationTimeSeconds = () =>
            smoothedTime;
          window.__mutaTentaclesDebugPointerState = () => ({
            targetX: pointer.targetX,
            targetY: pointer.targetY,
            inside: pointer.inside,
            inputSource: canvas.dataset.pointerInputSource || "none",
          });
          window.__mutaTentaclesDebugTrajectorySample = () => {
            const sample = [];
            const skeletonSampleCount = Math.min(12, skeletons.length);
            const sampleJoints = [
              Math.round(CHAIN_LINKS / 3),
              Math.round((CHAIN_LINKS * 2) / 3),
              CHAIN_LINKS,
            ];
            for (
              let sampleIndex = 0;
              sampleIndex < skeletonSampleCount;
              sampleIndex++
            ) {
              const skeletonIndex =
                skeletonSampleCount === 1
                  ? 0
                  : Math.round(
                      (sampleIndex * (skeletons.length - 1)) /
                        (skeletonSampleCount - 1),
                    );
              const points = skeletons[skeletonIndex].points;
              for (const joint of sampleJoints) {
                const pointOffset = joint * POINT_STRIDE;
                sample.push(
                  points[pointOffset + POINT_X],
                  points[pointOffset + POINT_Y],
                  points[pointOffset + POINT_Z],
                );
              }
            }
            return sample;
          };
        } else {
          syncAnimationLoopState();
        }
      })();
    </script>
  </body>
</html>
