<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Toroidal Field Reactor — MSAA v5</title>
  <meta name="description" content="HTML-версия 3D-модели тороидального реактора, поворот которой синхронизирован с прокруткой родительской страницы.">
  <!-- Frozen source revision: b68f0b587c863465ec2885d95370e9a32f559eaf -->
  <style>:root {
  --background: #000;
  --foreground: #ffd5e1;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #000;
}

body {
  color: var(--foreground);
  font-family:
    ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
    monospace;
}

.scene-shell,
.reactor-scene {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 100svh;
  overflow: hidden;
  background: #000;
}

.reactor-scene {
  cursor: default;
  touch-action: auto;
  pointer-events: none;
}

.reactor-scene canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.tokamak-fallback {
  width: 100%;
  height: 100%;
  padding: 32px;
  display: grid;
  place-content: center;
  gap: 10px;
  text-align: center;
  background: radial-gradient(circle at 50% 45%, #240914, #000 68%);
}

.tokamak-fallback__title {
  color: #ff79aa;
  font-size: clamp(15px, 3vw, 22px);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.tokamak-fallback__copy {
  max-width: 44ch;
  margin: 0;
  color: rgb(255 213 225 / 78%);
  font-size: clamp(12px, 2vw, 15px);
  line-height: 1.5;
}

.scene-shell::after {
  position: absolute;
  inset: 0;
  pointer-events: none;
  content: "";
  background:
    radial-gradient(circle at 50% 47%, transparent 50%, rgb(0 0 0 / 18%) 76%),
    linear-gradient(180deg, rgb(0 0 0 / 15%), transparent 22% 78%, rgb(0 0 0 / 16%));
}</style>

  background: transparent !important;
}
.scene-shell::after { display: none !important; }
</style>
