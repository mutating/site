[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/dashboard", "/venv", "/.venv"]

[project]
name = "throng-api"
version = "0.1.0"
description = "Durable API and scheduler for user-owned throng workers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "pillow>=11,<13",
  "cryptography>=44,<48",
  "pyopenssl>=25,<27",
  "cbor2>=5.6,<6",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "anyio>=4,<5",
    "ruff>=0.9,<1",
    "pytest-cov>=7.1,<8",
]

[project.scripts]
throng-api = "throng_api.cli:main"

[tool.pytest.ini_options]
testpaths = ["../../tests/platform/api"]
pythonpath = ["../.."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["throng_api"]
concurrency = ["greenlet", "thread"]
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["throng_api", "server", "tests"]
