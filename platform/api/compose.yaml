services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - throng-data:/data
    environment:
      THRONG_ALLOW_REGISTRATION: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  throng-data:
