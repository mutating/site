[project]
name = "throng-dashboard-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.5,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "anyio>=4,<5", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["../../tests/platform/web/server"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]
