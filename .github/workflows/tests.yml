name: Tests

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.suite.timeout }}
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Browser tests
            marker: "not interactive_visuals"
            workers: 2
            timeout: 15
          - name: Tentacle WebGL tests
            marker: "xdist_group(name='tentacle-webgl')"
            workers: 1
            timeout: 30
          - name: Tokamak WebGL tests
            marker: "xdist_group(name='tokamak-webgl')"
            workers: 1
            timeout: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3.2.0
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Create the test virtual environment
        run: python -m venv venv

      - name: Install Python test dependencies
        run: |
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r requirements_dev.txt

      - name: Install Chromium and its system dependencies
        run: venv/bin/python -m playwright install --with-deps chromium

      - name: Run the test suite
        run: >-
          venv/bin/python -m pytest
          -n ${{ matrix.suite.workers }}
          -m "${{ matrix.suite.marker }}"
          -vv
          --tb=short
          --max-worker-restart=0
          --durations=25

  test-result:
    name: Hugo and Playwright tests
    if: ${{ always() }}
    needs: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify every test shard passed
        env:
          TEST_SHARDS_RESULT: ${{ needs.pytest.result }}
        run: test "$TEST_SHARDS_RESULT" = "success"
