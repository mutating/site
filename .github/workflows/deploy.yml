name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          missing=0
          for secret_name in \
            SITE_BASE_URL \
            DEPLOY_HOST \
            DEPLOY_PORT \
            DEPLOY_USER \
            DEPLOY_PATH \
            DEPLOY_PASSWORD \
            DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error title=Missing deployment secret::${secret_name} is empty or unavailable to this workflow."
              missing=1
            fi
          done

          if (( missing != 0 )); then
            exit 1
          fi

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3.2.0
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Install password-based SSH support
        run: |
          sudo apt-get update
          sudo apt-get install --yes rsync sshpass

      - name: Build the production site
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ ! "$SITE_BASE_URL" =~ ^https?:// ]]; then
            echo "SITE_BASE_URL must be a complete http(s) URL." >&2
            exit 1
          fi
          hugo \
            --cleanDestinationDir \
            --environment production \
            --minify \
            --baseURL "$SITE_BASE_URL"

      - name: Configure SSH host verification
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" \
            | tr -d '\r' \
            > "$HOME/.ssh/known_hosts"

          if ! ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null; then
            echo "::error title=Invalid DEPLOY_KNOWN_HOSTS::The secret does not contain a valid OpenSSH known_hosts entry."
            exit 1
          fi

          known_host="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != "22" ]]; then
            known_host="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi
          if ! ssh-keygen -F "$known_host" \
            -f "$HOME/.ssh/known_hosts" >/dev/null; then
            echo "::error title=Host key not found::DEPLOY_KNOWN_HOSTS has no entry for ${known_host}. Regenerate it with ssh-keyscan using the configured host and port."
            exit 1
          fi

      - name: Replace the deployed site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]]; then
            echo "DEPLOY_PORT must contain only digits." >&2
            exit 1
          fi

          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "DEPLOY_PATH must be an absolute path without spaces." >&2
            exit 1
          fi

          target_path="${DEPLOY_PATH%/}"
          case "$target_path" in
            *"/../"*|*"/.."|*"/./"*|*"/.")
              echo "DEPLOY_PATH must not contain dot path segments." >&2
              exit 1
              ;;
          esac

          case "$target_path" in
            /|/home|/root|/srv|/usr|/var|/var/www)
              echo "Refusing to synchronize into an unsafe DEPLOY_PATH." >&2
              exit 1
              ;;
          esac

          ssh_options=(
            -p "$DEPLOY_PORT"
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o NumberOfPasswordPrompts=1
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )

          remote_preflight="
            set -eu
            if [ ! -d '$target_path' ]; then
              echo 'Remote DEPLOY_PATH does not exist: $target_path' >&2
              exit 20
            fi
            if [ ! -w '$target_path' ]; then
              echo 'Remote DEPLOY_PATH is not writable by DEPLOY_USER: $target_path' >&2
              exit 21
            fi
            if ! command -v rsync >/dev/null 2>&1; then
              echo 'rsync is not installed on the remote server.' >&2
              exit 22
            fi
          "

          if ! sshpass -e ssh "${ssh_options[@]}" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_preflight"; then
            echo "::error title=SSH preflight failed::Check DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, DEPLOY_PASSWORD, DEPLOY_KNOWN_HOSTS, remote rsync, and DEPLOY_PATH permissions."
            exit 1
          fi

          if ! sshpass -e rsync \
            --archive \
            --compress \
            --checksum \
            --delete-delay \
            --delay-updates \
            --chmod=D755,F644 \
            -e "ssh -p $DEPLOY_PORT -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            public/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$target_path/"; then
            echo "::error title=Upload failed::SSH succeeded, but rsync could not synchronize public/ to DEPLOY_PATH. Review the rsync output above."
            exit 1
          fi
