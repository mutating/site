name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  seo_contracts:
    name: SEO contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3.2.0
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements_dev.txt

      - name: Verify production SEO contracts
        run: python -m pytest tests/test_seo_contracts.py -m seo -n 0 -vv --tb=short

  deploy:
    name: Build and deploy over SSH
    needs: seo_contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_PATH: /var/www/mutating.tech
      SITE_BASE_URL: https://mutating.tech/

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          for secret_name in \
            DEPLOY_HOST \
            DEPLOY_PORT \
            DEPLOY_USER \
            DEPLOY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error title=Missing deployment secret::${secret_name} is empty or unavailable to this workflow."
              missing=1
            fi
          done

          if (( missing != 0 )); then
            exit 1
          fi

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3.2.0
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Install password-based SSH support
        run: |
          sudo apt-get update
          sudo apt-get install --yes rsync sshpass

      - name: Build the production site
        run: |
          set -euo pipefail
          if [[ "$SITE_BASE_URL" != "https://mutating.tech/" ]]; then
            echo "SITE_BASE_URL must be exactly https://mutating.tech/." >&2
            exit 1
          fi
          hugo \
            --cleanDestinationDir \
            --environment production \
            --minify \
            --panicOnWarning \
            --baseURL "$SITE_BASE_URL"

          if rg --glob '*.html' --glob '*.xml' --glob 'robots.txt' \
            'localhost|127\.0\.0\.1|http://mutating\.tech|example\.test' public; then
            echo "Production output contains a forbidden origin." >&2
            exit 1
          fi

      - name: Replace the deployed site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]]; then
            echo "DEPLOY_PORT must contain only digits." >&2
            exit 1
          fi

          if ! getent ahostsv4 "$DEPLOY_HOST" >/dev/null; then
            echo "::error title=No IPv4 deployment address::DEPLOY_HOST does not resolve to IPv4. A standard GitHub-hosted runner cannot reach an IPv6-only SSH endpoint."
            exit 1
          fi

          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "DEPLOY_PATH must be an absolute path without spaces." >&2
            exit 1
          fi

          target_path="${DEPLOY_PATH%/}"
          case "$target_path" in
            *"/../"*|*"/.."|*"/./"*|*"/.")
              echo "DEPLOY_PATH must not contain dot path segments." >&2
              exit 1
              ;;
          esac

          case "$target_path" in
            /|/home|/root|/srv|/usr|/var|/var/www)
              echo "Refusing to synchronize into an unsafe DEPLOY_PATH." >&2
              exit 1
              ;;
          esac

          ssh_options=(
            -4
            -p "$DEPLOY_PORT"
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o NumberOfPasswordPrompts=1
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
          )

          remote_preflight="
            set -eu
            if [ ! -d '$target_path' ]; then
              echo 'Remote DEPLOY_PATH does not exist: $target_path' >&2
              exit 20
            fi
            if [ ! -w '$target_path' ]; then
              echo 'Remote DEPLOY_PATH is not writable by DEPLOY_USER: $target_path' >&2
              exit 21
            fi
            if ! command -v rsync >/dev/null 2>&1; then
              echo 'rsync is not installed on the remote server.' >&2
              exit 22
            fi
          "

          if ! sshpass -e ssh "${ssh_options[@]}" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$remote_preflight"; then
            echo "::error title=SSH connection or preflight failed::If SSH reported 'Network is unreachable', DEPLOY_HOST must point to a public IPv4 address reachable on DEPLOY_PORT. Otherwise review the SSH message above, the server firewall, credentials, remote rsync, and DEPLOY_PATH permissions."
            exit 1
          fi

          if ! sshpass -e rsync \
            --archive \
            --compress \
            --checksum \
            --delete-delay \
            --delay-updates \
            --chmod=D755,F644 \
            -e "ssh -4 -p $DEPLOY_PORT -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            public/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$target_path/"; then
            echo "::error title=Upload failed::SSH succeeded, but rsync could not synchronize public/ to DEPLOY_PATH. Review the rsync output above."
            exit 1
          fi

      - name: Verify the deployed content contracts
        run: |
          set -euo pipefail

          assert_status() {
            local expected="$1"
            local url="$2"
            local actual
            actual="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 "$url")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Expected $expected from $url, got $actual." >&2
              exit 1
            fi
          }

          assert_status 200 "https://mutating.tech/"
          assert_status 200 "https://mutating.tech/robots.txt"
          assert_status 200 "https://mutating.tech/sitemap.xml"
          assert_status 404 "https://mutating.tech/__seo_missing_page__"

          assert_redirect() {
            local source_url="$1"
            local expected_location="$2"
            local headers
            local location
            headers="$(curl --silent --show-error --head --max-time 30 "$source_url")"
            printf '%s' "$headers" | rg --quiet '^HTTP/[^ ]+ 308'
            location="$(printf '%s' "$headers" | rg --ignore-case '^location: ' | cut -d' ' -f2- | tr -d '\r')"
            [[ "$location" == "$expected_location" ]]
          }

          assert_redirect "http://mutating.tech/blog/?probe=1" "https://mutating.tech/blog/?probe=1"
          assert_redirect "http://www.mutating.tech/blog/?probe=1" "https://mutating.tech/blog/?probe=1"
          assert_redirect "https://www.mutating.tech/blog/?probe=1" "https://mutating.tech/blog/?probe=1"

          unknown_host_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Host: seo-invalid.invalid' --max-time 30 http://mutating.tech/ || true)"
          [[ "$unknown_host_status" == "000" || "$unknown_host_status" == "404" ]]

          printf '' | openssl s_client \
            -connect www.mutating.tech:443 \
            -servername www.mutating.tech \
            2>/dev/null | openssl x509 -noout -checkhost www.mutating.tech

          alpn="$(printf '' | openssl s_client \
            -connect mutating.tech:443 \
            -servername mutating.tech \
            -alpn h2 \
            2>/dev/null | sed -n 's/^ALPN protocol: //p')"
          [[ "$alpn" == "h2" ]]

          root_html="$(curl --fail --silent --show-error --max-time 30 https://mutating.tech/)"
          robots="$(curl --fail --silent --show-error --max-time 30 https://mutating.tech/robots.txt)"
          printf '%s' "$root_html" | rg --quiet '<link rel=?"?canonical"? href=?"?https://mutating\.tech/"?>'
          [[ "$robots" == *'Sitemap: https://mutating.tech/sitemap.xml'* ]]

          root_headers="$(curl --silent --show-error --head --max-time 30 https://mutating.tech/)"
          printf '%s' "$root_headers" | rg --quiet --ignore-case '^strict-transport-security: max-age=31536000; includeSubDomains\r?$'
          printf '%s' "$root_headers" | rg --quiet --ignore-case '^cache-control: no-cache\r?$'

          css_path="$(find public/css -type f -name '*.css' -print -quit)"
          css_url="https://mutating.tech/${css_path#public/}"
          css_headers="$(curl --silent --show-error --dump-header - --output /dev/null --header 'Accept-Encoding: gzip' --max-time 30 "$css_url")"
          printf '%s' "$css_headers" | rg --quiet --ignore-case '^content-encoding: gzip\r?$'
          printf '%s' "$css_headers" | rg --quiet --ignore-case '^vary: Accept-Encoding\r?$'
          printf '%s' "$css_headers" | rg --quiet --ignore-case '^cache-control: public, max-age=31536000, immutable\r?$'

          image_headers="$(curl --silent --show-error --head --max-time 30 https://mutating.tech/og.png)"
          if printf '%s' "$image_headers" | rg --quiet --ignore-case 'immutable'; then
            echo "Stable image URLs must not use immutable caching." >&2
            exit 1
          fi
